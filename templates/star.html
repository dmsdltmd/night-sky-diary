<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  canvas{display:block;width:100%;height:__HEIGHT__px;border-radius:18px}
</style></head>
<body>
<canvas id="cv"></canvas>
<script>
// 오늘의 별 미리보기: 감정 비율로 별 하나와 주변 성운을 그려요
const D = __DATA__;   // {p:[7], colors:[7], label:"..."}
const cv = document.getElementById('cv'), g = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const order = D.p.map((v,i)=>i).sort((a,b)=>D.p[b]-D.p[a]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, t0 = performance.now();
function draw(now){
  const t = reduce ? 1 : Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - t, 3);
  const R = mb32(9);
  g.setTransform(DPR,0,0,DPR,0,0);
  const bg = g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#050714'); bg.addColorStop(1,'#141a44');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  for (let i=0;i<140;i++){ g.fillStyle=`rgba(255,255,255,${.1+R()*.5})`; g.beginPath(); g.arc(R()*W,R()*H,.3+R()*.9,0,6.283); g.fill(); }
  const cx = W/2, cy = H/2, base = Math.min(W,H);
  // 성운: 감정 비율만큼 색이 섞여요
  g.globalCompositeOperation = 'lighter';
  order.forEach(k => { const v = D.p[k]; if (v < .03) return;
    for (let j=0;j<5;j++){ const a = R()*6.283, d = R()*base*.22*e, x = cx+Math.cos(a)*d, y = cy+Math.sin(a)*d, r = base*(.12+.35*v)*e;
      const rg = g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0, rgba(D.colors[k], .22*Math.sqrt(v))); rg.addColorStop(1, rgba(D.colors[k],0));
      g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill(); } });
  // 별
  const top = D.colors[order[0]], s = base*(.035 + .03*D.p[order[0]])*e;
  const halo = g.createRadialGradient(cx,cy,0,cx,cy,s*7); halo.addColorStop(0, rgba(top,.75)); halo.addColorStop(1, rgba(top,0));
  g.fillStyle = halo; g.beginPath(); g.arc(cx,cy,s*7,0,6.283); g.fill();
  for (let q=0;q<4;q++){ const an=q*Math.PI/2, L=s*(5+4*D.p[order[0]]), ex=cx+Math.cos(an)*L, ey=cy+Math.sin(an)*L, sp=g.createLinearGradient(cx,cy,ex,ey);
    sp.addColorStop(0,'rgba(255,255,255,.95)'); sp.addColorStop(1,'rgba(255,255,255,0)'); g.strokeStyle=sp; g.lineWidth=1.4; g.beginPath(); g.moveTo(cx,cy); g.lineTo(ex,ey); g.stroke(); }
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = rgba(D.colors[order[1]], .9); g.lineWidth = 2; g.beginPath(); g.arc(cx,cy,s*2.1,0,6.283); g.stroke();
  const body = g.createRadialGradient(cx,cy,0,cx,cy,s*1.6); body.addColorStop(0,'#fff'); body.addColorStop(.4, rgba(top,1)); body.addColorStop(1, rgba(top,0));
  g.fillStyle = body; g.beginPath(); g.arc(cx,cy,s*1.6,0,6.283); g.fill();
  if (D.label) { g.font = '500 13px "Gothic A1", sans-serif'; g.fillStyle = 'rgba(238,240,255,.8)'; g.textAlign = 'center'; g.fillText(D.label, cx, H - 18); }
  if (t < 1) requestAnimationFrame(draw);
}
function resize(){ W = cv.clientWidth; H = cv.clientHeight; cv.width = W*DPR; cv.height = H*DPR; t0 = performance.now(); requestAnimationFrame(draw); }
new ResizeObserver(resize).observe(cv);
</script>
</body></html>

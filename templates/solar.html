<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f4ff;--muted:#9da9d0;--line:rgba(171,187,245,.16);--panel:#111a37}
*{box-sizing:border-box}html,body{margin:0;padding:0;color:var(--ink);font:12px/1.6 'Gothic A1','Malgun Gothic',sans-serif;background:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #c9d8ff;outline-offset:2px}
#app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:14px}
#stage{position:relative;isolation:isolate;min-width:0;overflow:hidden;border-radius:22px;border:1px solid rgba(156,175,231,.19);background:radial-gradient(ellipse at 47% 49%,#20294e 0%,#111932 56%,#0b1027 100%)}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 105px rgba(2,5,22,.52);border-radius:inherit}
#cv{display:block;width:100%;height:100%;touch-action:pan-y}
#intro{position:absolute;top:23px;left:24px;pointer-events:none;z-index:2}
.eyebrow{font:700 9px/1.3 'Gothic A1',sans-serif;letter-spacing:.22em;color:#9aaedf}
#intro strong{font-size:17px;letter-spacing:-.035em;display:block;color:#f8f8ff;margin:8px 0 2px}
#intro span{color:#aab6da;font-size:11px}
#meta{position:absolute;right:17px;top:19px;z-index:2;border:1px solid rgba(167,191,255,.16);border-radius:99px;background:rgba(14,22,48,.68);padding:7px 12px;color:#b4c3e9;font-size:10px}
#meta b{color:#f7f9ff;font-weight:750}
#help{position:absolute;left:22px;bottom:20px;font-size:10px;color:#93a1c5;pointer-events:none;z-index:2}
#help i{display:inline-block;width:5px;height:5px;background:#7bdcb9;border-radius:50%;vertical-align:2px;margin-right:5px}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#a4b2dc;width:80%;line-height:2}
#side{position:relative;min-height:0;display:flex;flex-direction:column;border-radius:22px;border:1px solid rgba(166,185,240,.18);background:linear-gradient(155deg,rgba(28,39,78,.96),rgba(13,20,44,.98) 70%);padding:23px 19px;overflow:hidden}
#side:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,rgba(114,145,230,.13),transparent 47%);pointer-events:none}
#side>*{position:relative}.side-kicker{font-size:9px;letter-spacing:.2em;color:#9cadde;font-weight:700}.side-title{font-size:22px;line-height:1.35;margin:8px 0 12px;font-weight:800;letter-spacing:-.035em}
#planet-card{border-radius:16px;border:1px solid rgba(175,188,238,.17);background:linear-gradient(125deg,rgba(66,82,131,.26),rgba(18,28,59,.55));display:flex;gap:13px;align-items:center;padding:13px;min-height:110px}
#mini{width:85px;height:85px;flex:none}#pname{font-size:20px;font-weight:800;line-height:1.3}#percent{font-size:26px;font-weight:800;letter-spacing:-.04em;color:#fff;margin-top:2px}#count{color:#9eacd2;font-size:10px;margin-top:2px}
#about{color:#c2cce8;font-size:11px;line-height:1.8;margin:16px 0 14px}
#partition{height:7px;display:flex;gap:2px;overflow:hidden;border-radius:99px;margin:2px 0 6px;background:#283553}
#partition span{height:100%;border-radius:99px;min-width:0}
#shares{display:flex;justify-content:space-between;color:#8f9fc8;font-size:10px;margin-bottom:18px}
#records-head{font-weight:750;color:#e6edff;font-size:12px;border-top:1px solid var(--line);padding:17px 0 8px;display:flex;justify-content:space-between;align-items:center}#records-head small{color:#8e9ec9;font-size:10px;font-weight:400}
#records{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:#536494 transparent}
.entry{display:block;padding:12px 10px;margin:5px 0;border:1px solid rgba(162,184,242,.13);background:rgba(35,48,91,.35);border-radius:12px;min-width:0}
.entry b{display:block;font-size:11px;color:#dce5ff;font-weight:700;margin-bottom:4px}.entry span{display:block;color:#aebde0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed rgba(150,166,223,.25);border-radius:12px;color:#9cadcb;padding:17px 12px;font-size:11px;line-height:1.9}
#more{margin-top:12px;padding:10px;width:100%;border:1px solid rgba(160,179,242,.26);background:rgba(75,93,155,.19);border-radius:12px;color:#d5dfff;font-weight:700;font-size:11px}
#more:hover{background:rgba(75,95,164,.34)}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:390px 300px;gap:10px;height:__HEIGHT__px}#side{padding:15px 16px}#intro{top:14px;left:15px}#intro strong{font-size:14px}#help{bottom:12px;left:14px}#meta{right:11px;top:12px}}
</style></head><body>
<div id="app"><section id="stage" aria-label="감정 태양계 시각화"><canvas id="cv"></canvas><div id="intro"><div class="eyebrow">YOUR EMOTION ORBIT</div><strong>마음의 태양계</strong><span>감정 행성을 눌러 기록을 살펴보세요</span></div><div id="meta"><b id="nDays">0</b>일의 기록</div><div id="help"><i></i>행성 선택 · 휠로 확대 / 축소</div><div id="hint" hidden>이 달의 첫 감정을 기록하면<br>나만의 태양계가 나타나요.</div></section><aside id="side" aria-live="polite"></aside></div>
<script>__PLANET_JS__</script><script>
const DATA=__DATA__,COL=DATA.colors,EMO=DATA.emo;
const canvas=document.getElementById('cv'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),side=document.getElementById('side');
const dpr=Math.min(2,window.devicePixelRatio||1),reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const planets=DATA.planets.slice().sort((a,b)=>b.share-a.share||b.count-a.count).map((p,i)=>({...p,orbit:i,angle:-Math.PI*.68+i*(Math.PI*2/7)}));
let W=1,H=1,t=0,zoom=1,chosen=0,hover=-1,points=[],background=null,all=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hex=(c,a=1)=>{let n=parseInt(c.replace('#',''),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const random=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return ((x^x>>>14)>>>0)/4294967296};
function makeBg(){let c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;let b=c.getContext('2d');b.scale(dpr,dpr);let rand=random(17);let a=b.createRadialGradient(W*.5,H*.5,10,W*.5,H*.5,Math.max(W,H)*.7);a.addColorStop(0,'#202748');a.addColorStop(.55,'#111c3b');a.addColorStop(1,'#080d23');b.fillStyle=a;b.fillRect(0,0,W,H);
 for(let i=0;i<Math.min(450,Math.floor(W*H/900));i++){let x=rand()*W,y=rand()*H;let r=rand()*.85+.15;b.fillStyle=`rgba(211,227,255,${.08+rand()*.42})`;b.beginPath();b.arc(x,y,r,0,7);b.fill()}
 let v=b.createRadialGradient(W*.47,H*.51,40,W*.47,H*.51,Math.max(W,H)*.67);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(3,5,21,.63)');b.fillStyle=v;b.fillRect(0,0,W,H);background=c}
function geometry(){let small=W<520;let cx=W*(small?.53:.50),cy=H*(small?.52:.53);let rad=Math.min(W*.43,H*.75)*zoom;return{cx,cy,rad,scale:Math.min(1.1,rad/300)}}
function place(p,g){let a=p.angle+(reduced?0:t*.000025*(.85+p.orbit*.08));let rx=g.rad*(.40+.080*p.orbit),ry=rx*.57;return{x:g.cx+Math.cos(a)*rx,y:g.cy+Math.sin(a)*ry,r:(10+22*Math.sqrt(Math.max(.004,p.share)/Math.max(.03,...planets.map(q=>q.share))))*g.scale,dep:Math.sin(a),p}}
function sun(g){let r=Math.max(17,Math.min(W,H)*.055)*Math.sqrt(zoom),x=g.cx,y=g.cy;
 let corona=ctx.createRadialGradient(x,y,4,x,y,r*5);corona.addColorStop(0,'rgba(255,199,105,.42)');corona.addColorStop(.3,'rgba(255,155,75,.16)');corona.addColorStop(1,'rgba(255,160,70,0)');ctx.fillStyle=corona;ctx.beginPath();ctx.arc(x,y,r*5,0,7);ctx.fill();
 let glow=ctx.createRadialGradient(x-r*.33,y-r*.4,0,x,y,r);glow.addColorStop(0,'#fff6d5');glow.addColorStop(.42,'#ffd58a');glow.addColorStop(1,'#e8883f');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='rgba(255,232,188,.4)';ctx.lineWidth=.9;ctx.stroke()}
function orbit(g,r){ctx.beginPath();ctx.ellipse(g.cx,g.cy,r,r*.57,-.04,0,Math.PI*2);ctx.stroke()}
function planet(q,i){let p=q.p,active=i===chosen;ctx.save();ctx.globalAlpha=(chosen>=0 && !active) ? .70 : 1;const color=COL[p.k];
 let glow=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*(active?4.6:3));glow.addColorStop(0,hex(color,active?.35:.2));glow.addColorStop(1,hex(color,0));ctx.fillStyle=glow;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(active?4.6:3),0,7);ctx.fill();
 drawPlanet(ctx,q.x,q.y,q.r*(i===hover?1.10:1),color,{second:COL[(p.k+3)%7],seed:p.k*17+3,ring:p.orbit===0,glow:.25});
 if(active){ctx.strokeStyle=hex(color,.66);ctx.lineWidth=1.1;ctx.setLineDash([2,5]);ctx.beginPath();ctx.arc(q.x,q.y,q.r+10,0,7);ctx.stroke();ctx.setLineDash([])}
 let labelX=clamp(q.x+q.r+8,16,W-60),labelY=clamp(q.y-q.r*.4,80,H-39);ctx.shadowColor='#080d22';ctx.shadowBlur=8;ctx.textAlign='left';ctx.fillStyle=active?'#fff':color;ctx.font='700 12px Gothic A1,sans-serif';ctx.fillText(EMO[p.k],labelX,labelY);ctx.fillStyle='#b4bedb';ctx.font='500 10px Gothic A1,sans-serif';ctx.fillText(`${Math.round(p.share*100)}%`,labelX,labelY+15);ctx.restore()}
function draw(){if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(background)ctx.drawImage(background,0,0,W,H);if(!DATA.total){points=[];return}let g=geometry();ctx.strokeStyle='rgba(151,172,228,.15)';ctx.lineWidth=.8;for(const k of [0,2,4,6])orbit(g,g.rad*(.40+.08*k));points=planets.map((p,i)=>place(p,g));points.filter(q=>q.dep<0).forEach(q=>planet(q,planets.indexOf(q.p)));sun(g);points.filter(q=>q.dep>=0).forEach(q=>planet(q,planets.indexOf(q.p)))}
function detail(i){chosen=i;let p=planets[i];if(!p||!DATA.total){side.innerHTML='<div class="side-kicker">YOUR EMOTIONS</div><div class="side-title">아직 기록이 없어요</div><div class="empty">오늘의 감정을 남기면 이곳에 행성과 기록이 표시됩니다.</div>';return}let days=p.days.slice().sort((a,b)=>b.date.localeCompare(a.date));let rows=all?days:days.slice(0,4);let desc=DATA.desc[EMO[p.k]]||'';
 side.innerHTML=`<div class="side-kicker">SELECTED EMOTION</div><div class="side-title">${escapeHTML(EMO[p.k])}의 행성</div><div id="planet-card"><canvas id="mini" width="170" height="170"></canvas><div><div id="pname" style="color:${COL[p.k]}">${escapeHTML(EMO[p.k])}</div><div id="percent">${Math.round(p.share*100)}%</div><div id="count">이번 달 평균 감정 비율</div></div></div><div id="about">${escapeHTML(desc)}</div><div id="partition">${DATA.planets.map(e=>`<span style="width:${(e.share*100).toFixed(2)}%;background:${COL[e.k]}"></span>`).join('')}</div><div id="shares"><span>한 달의 감정 비율</span><span>${DATA.total}일 기록</span></div><div id="records-head">이 감정이 가장 컸던 날 <small>${p.count}일</small></div><div id="records">${rows.length?rows.map(d=>`<div class="entry"><b>${Number(d.date.slice(5,7))}월 ${Number(d.date.slice(8,10))}일</b><span>${escapeHTML(d.text||'기록된 내용이 없어요')}</span></div>`).join(''):'<div class="empty">이 감정이 가장 컸던 날은 아직 없어요.</div>'}</div>${days.length>4?'<button id="more">'+(all?'간단히 보기':'모든 관련 기록 보기')+'</button>':''}`;
 let mini=document.getElementById('mini').getContext('2d');mini.scale(2,2);drawPlanet(mini,42.5,42.5,26,COL[p.k],{second:COL[(p.k+3)%7],seed:p.k*17+3,glow:.65});let more=document.getElementById('more');if(more)more.onclick=()=>{all=!all;detail(chosen)};draw()}
function eventXY(e){let b=canvas.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};function pick(x,y){let nearest=-1,dist=1e6;points.forEach((q,i)=>{let d=Math.hypot(q.x-x,q.y-y)-q.r;if(d<dist){dist=d;nearest=i}});return dist<10?nearest:-1}
canvas.addEventListener('pointermove',e=>{let [x,y]=eventXY(e);hover=pick(x,y);canvas.style.cursor=hover<0?'default':'pointer';draw()});
canvas.addEventListener('click',e=>{let [x,y]=eventXY(e),i=pick(x,y);if(i>=0){all=false;detail(i)}});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.08:1/1.08),.72,1.35);draw()},{passive:false});
function resize(){W=stage.clientWidth;H=stage.clientHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);makeBg();draw()};new ResizeObserver(resize).observe(stage);
if(!DATA.total)document.getElementById('hint').hidden=false;document.getElementById('nDays').textContent=DATA.total;
resize();detail(DATA.total?0:-1);if(!reduced){let last=performance.now();function animate(now){let d=Math.min(now-last,45);last=now;t+=d;draw();requestAnimationFrame(animate)}requestAnimationFrame(animate)}
</script></body></html>

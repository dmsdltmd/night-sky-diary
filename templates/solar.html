<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: [태양계 무대 | 선택한 감정 패널] */
  :root{ --card:rgba(16,20,46,.82); --line:rgba(140,150,255,.15); --line-hi:rgba(165,155,255,.42); --ink:#eef0ff; --sub:#a3a8cf; --faint:#6b7099; --violet:#8b7bff; }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  button{font-family:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  #app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
  #stage{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .legend{position:absolute;left:18px;top:16px;font-size:12px;color:var(--sub);line-height:1.7}
  .legend b{color:var(--ink);font-weight:500}
  .ctrl{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
  .ctrl button{height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(12,14,36,.86);cursor:pointer;font-size:12.5px;display:grid;place-items:center}
  .ctrl svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
  .side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;min-height:0}
  .side h4{margin:0 0 16px;font-size:14px;font-weight:700}
  .top{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
  .top canvas{width:92px;height:92px}
  .top b{display:block;font-size:20px}
  .top span{display:block;font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .desc{font-size:13px;line-height:1.75;color:#cfd2ec;margin:14px 0 4px}
  .meta{font-size:12px;color:var(--faint)}
  .rel{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);font-weight:500}
  .list{overflow:auto;min-height:0;margin-top:6px}
  .day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px solid rgba(140,150,255,.08)}
  .day b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .day span{color:#cfd2ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{margin-top:12px;border:1px solid var(--line-hi);background:transparent;border-radius:99px;padding:9px;font-size:12.5px;cursor:pointer;width:100%}
  .none{font-size:12.5px;color:var(--faint);padding:8px 0}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
  @media (max-width:760px){ #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto} .side{max-height:260px} }
</style></head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
  </div>
  <div class="side" id="side"></div>
</div>
<script>
window.addEventListener('error', e => { const b = document.createElement('div'); b.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#3a1420;color:#ffd7dd;border:1px solid #f0645a;border-radius:8px;padding:10px 12px;font:12px/1.5 monospace'; b.textContent = '감정 태양계 오류: ' + e.message + (e.lineno ? ' (줄 ' + e.lineno + ')' : ''); document.body.appendChild(b); });
__PLANET_JS__
</script>
<script>
const D = __DATA__;   // {emo, colors, desc, label, total, sun, planets:[{k, share, count, days:[{date,text,v}]}]}
const EMO = D.emo, COL = D.colors;
const cv = document.getElementById('cv'), g = cv.getContext('2d'), stage = document.getElementById('stage');
const DPR = Math.min(2, devicePixelRatio || 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, zoom = 1, sel = -1, hover = -1, t = 0, last = performance.now(), playing = !reduce, showAll = false;
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const planets = D.planets.slice().sort((a,b) => b.count - a.count || b.share - a.share).map((p,i) => ({...p, orbit:i, a0: i*2.35 + .5}));
const maxShare = Math.max(.01, ...planets.map(p => p.share));

/* 배경 */
let bg = null;
function paintBg(){
  bg = document.createElement('canvas'); bg.width = W*DPR; bg.height = H*DPR; const b = bg.getContext('2d'); b.scale(DPR,DPR); const R = mb32(31);
  b.globalCompositeOperation = 'lighter';
  [[.5,.5,'#2a2a7a',.22],[.85,.8,'#4a2a8a',.16],[.15,.2,'#1e2a70',.14]].forEach(([x,y,c,a]) => { const gr = b.createRadialGradient(x*W,y*H,0,x*W,y*H,Math.min(W,H)*.48); gr.addColorStop(0,rgba(c,a)); gr.addColorStop(1,rgba(c,0)); b.fillStyle = gr; b.fillRect(0,0,W,H); });
  b.globalCompositeOperation = 'source-over';
  for (let i=0;i<Math.round(W*H/1300);i++){ b.fillStyle=`rgba(255,255,255,${.1+R()*.55})`; b.beginPath(); b.arc(R()*W,R()*H,.3+R(),0,6.283); b.fill(); }
}

/* 궤도 */
const TILT = -0.06;
const RINGS = [.42, .74, 1];
function geom(){ const cx = W*.5, cy = H*.52, maxR = Math.min(W*.43, H*.8) * zoom;
  return {cx, cy, maxR, sc: Math.min(1.1, maxR / 300)}; }
function pos(p, G){ const rx = G.maxR * (p.orbit % 2 ? .78 : .98), ry = rx*.5, sp = .00004, a = -Math.PI/2 + p.orbit * 2*Math.PI/planets.length + t*sp;
  const ex = Math.cos(a)*rx, ey = Math.sin(a)*ry;
  return {x: G.cx + ex*Math.cos(TILT) - ey*Math.sin(TILT), y: G.cy + ex*Math.sin(TILT) + ey*Math.cos(TILT), r: (9 + 22*Math.sqrt(p.share/maxShare)) * G.sc, rx, ry, front: Math.sin(a) > 0}; }

function drawOne(p, P, G){
  const isSel = sel >= 0 && planets[sel] === p;
  g.globalAlpha = sel >= 0 && !isSel ? .55 : 1;
  const dx = G.cx - P.x, dy = G.cy - P.y, d = Math.hypot(dx,dy) || 1;
  drawPlanet(g, P.x, P.y, P.r * (p.orbit === hover ? 1.08 : 1), COL[p.k], {second: COL[(p.k+3)%7], seed: p.k*17+3, ring: p.orbit === 0, lx: dx/d*.7, ly: dy/d*.7});
  if (isSel) { g.strokeStyle = 'rgba(255,255,255,.85)'; g.setLineDash([3,4]); g.lineWidth = 1.2; g.beginPath(); g.arc(P.x,P.y,P.r+10,0,6.283); g.stroke(); g.setLineDash([]); }
  g.textAlign = 'left'; const lx = P.x + P.r*.75 + 8, ly = P.y - P.r*.55;
  g.font = '700 13px "Gothic A1", sans-serif'; g.fillStyle = COL[p.k]; g.fillText(EMO[p.k], lx, ly);
  g.font = '500 12px "Gothic A1", sans-serif'; g.fillStyle = 'rgba(230,232,250,.85)'; g.fillText(Math.round(p.share*100) + '%', lx, ly + 16);
  g.globalAlpha = 1;
}
function drawSun(G){
  const c = COL[D.sun >= 0 ? D.sun : 0], r = Math.min(W,H) * .05 * Math.sqrt(zoom);
  g.globalCompositeOperation = 'lighter';
  const corona = g.createRadialGradient(G.cx,G.cy,r*.4,G.cx,G.cy,r*5); corona.addColorStop(0,'rgba(255,200,110,.55)'); corona.addColorStop(.4,rgba(c,.14)); corona.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = corona; g.beginPath(); g.arc(G.cx,G.cy,r*5,0,6.283); g.fill(); g.globalCompositeOperation = 'source-over';
  const body = g.createRadialGradient(G.cx-r*.3,G.cy-r*.3,r*.1,G.cx,G.cy,r); body.addColorStop(0,'#fff7dc'); body.addColorStop(.4,'#ffd06a'); body.addColorStop(1,'#ff9a3c');
  g.fillStyle = body; g.beginPath(); g.arc(G.cx,G.cy,r,0,6.283); g.fill();
  for (let i=0;i<14;i++){ const a = i*.45 + t*.0002, rr = r*(.3+(i%4)*.15); g.fillStyle = 'rgba(255,140,40,.18)'; g.beginPath(); g.arc(G.cx+Math.cos(a)*rr, G.cy+Math.sin(a)*rr, r*.12, 0, 6.283); g.fill(); }
}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H); if (bg) g.drawImage(bg,0,0,W,H);
  if (!D.total) return;
  const G = geom(), P = planets.map(p => pos(p, G));
  RINGS.forEach(k => { g.strokeStyle = 'rgba(180,180,255,.18)'; g.lineWidth = 1; g.beginPath(); g.ellipse(G.cx,G.cy,G.maxR*k,G.maxR*k*.5,TILT,0,6.283); g.stroke(); });
  planets.forEach((p,i) => { if (!P[i].front) drawOne(p, P[i], G); });
  drawSun(G);
  planets.forEach((p,i) => { if (P[i].front) drawOne(p, P[i], G); });
  draw.P = P;
}
function loop(now){ const dt = Math.min(50, now - last); last = now; if (playing) t += dt; draw(); requestAnimationFrame(loop); }

/* 선택한 감정 패널 */
function side(i){
  sel = i; const box = document.getElementById('side'), p = planets[i];
  if (!D.total || !p) { box.innerHTML = '<h4>선택한 감정</h4><div class="none">이 달에는 아직 기록이 없어요.</div>'; return; }
  const days = p.days.slice().sort((a,b) => a.date < b.date ? 1 : -1), shown = showAll ? days : days.slice(0,4);
  box.innerHTML = `<h4>선택한 감정</h4>
    <div class="top"><canvas id="mini" width="184" height="184"></canvas><div><b style="color:${COL[p.k]}">${EMO[p.k]}</b><span>${Math.round(p.share*100)}%</span><div class="meta">${p.count}일 가장 컸던 감정</div></div></div>
    <p class="desc">${esc(D.desc[EMO[p.k]] || '')}</p>
    <div class="rel">관련 기록</div>
    <div class="list">${shown.length ? shown.map(d => `<div class="day"><b>${+d.date.slice(5,7)}월 ${+d.date.slice(8,10)}일</b><span>${esc(d.text)}</span></div>`).join('') : '<div class="none">이 감정이 가장 컸던 날은 아직 없어요.</div>'}</div>
    ${days.length ? `<button class="more" id="more">${showAll ? '접기' : '해당 감정 기록 보기'}</button>` : ''}`;
  const m = document.getElementById('mini').getContext('2d'); m.scale(2,2); drawPlanet(m, 46, 46, 30, COL[p.k], {second: COL[(p.k+3)%7], seed: p.k*17+3, glow: .8});
  const more = document.getElementById('more'); if (more) more.onclick = () => { showAll = !showAll; side(sel); };
}

/* 마우스, 버튼 */
function mpos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function pick(mx,my){ const P = draw.P || []; let best = -1, bd = 1e9; P.forEach((q,i) => { const d = Math.hypot(q.x-mx,q.y-my) - q.r; if (d < bd) { bd = d; best = i; } }); return bd <= 8 ? best : -1; }
cv.addEventListener('pointermove', e => { const [x,y] = mpos(e); const h = pick(x,y); hover = h >= 0 ? planets[h].orbit : -1; cv.style.cursor = h >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('click', e => { const [x,y] = mpos(e); const i = pick(x,y); if (i >= 0) { showAll = false; side(i); } });
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(1.6, Math.max(.6, zoom * (e.deltaY < 0 ? 1.08 : 1/1.08))); }, {passive:false});

function resize(){ W = stage.clientWidth; H = stage.clientHeight; cv.width = W*DPR; cv.height = H*DPR; paintBg(); draw(); }
if (!D.total) { const e = document.createElement('div'); e.className = 'empty'; e.innerHTML = '이 달에는 아직 기록이 없어요.<br>홈에서 오늘의 일기를 써 보세요.'; stage.appendChild(e); }
new ResizeObserver(resize).observe(stage); resize();
side(D.total ? 0 : -1);
requestAnimationFrame(loop);
</script>
</body></html>

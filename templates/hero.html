<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* 홈 맨 위: [날짜 + 오늘의 문장 | 오늘의 행성 | 오늘의 감정 카드] */
  :root{ --card:rgba(16,20,46,.82); --line:rgba(140,150,255,.15); --ink:#eef0ff; --sub:#a3a8cf; --faint:#6b7099; --gold:#ffcf6a; }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  #app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 300px;gap:16px;align-items:center;position:relative}
  .txt{padding-left:4px;min-width:0}
  .user{position:absolute;right:4px;top:0;display:flex;align-items:center;gap:8px;font-size:13px;color:#d6d9f2}
  .user i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,#8b7bff,#5b84f0);color:#fff;font-size:12px;font-weight:700}
  .date{font-size:13px;color:var(--sub);margin-bottom:16px;letter-spacing:.02em}
  .q{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(20px,2.3vw,30px);line-height:1.5;white-space:pre-line;color:#f5f3ff;margin:0;text-wrap:balance}
  .by{margin-top:14px;font-size:12.5px;color:var(--gold);letter-spacing:.02em}
  .sub{margin-top:14px;font-size:12.5px;color:var(--sub);line-height:1.7}
  canvas{width:100%;height:__HEIGHT__px;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;align-self:stretch;margin:44px 0 10px;display:flex;flex-direction:column}
  .card h4{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--sub)}
  .emo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
  .emo i{width:26px;height:26px;border-radius:50%;flex:none}
  .msg{font-size:13px;color:#cfd2ec;line-height:1.75;margin:12px 0 0}
  .conf{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .conf small{display:block;font-size:11px;color:var(--faint);text-align:right}
  .conf b{display:block;font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .conf svg{width:46px;height:46px}
  .none{font-size:13px;color:var(--sub);line-height:1.8}
  @media (max-width:820px){ #app{grid-template-columns:1fr;height:auto} canvas{height:220px} .card{margin:0} }
</style></head>
<body>
<div id="app">
  <div class="user" id="user"></div>
  <div class="txt"><div class="date" id="date"></div><p class="q" id="q"></p><div class="by" id="by"></div><div class="sub" id="sub"></div></div>
  <canvas id="cv" aria-label="오늘의 감정 행성"></canvas>
  <div class="card" id="card"></div>
</div>
<script>
__PLANET_JS__
</script>
<script>
const D = __DATA__;   // {emo, colors, date, quote, author, sub, top, second, conf, msg}
const EMO = D.emo, COL = D.colors;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.getElementById('date').textContent = D.date;
document.getElementById('q').textContent = D.quote;
document.getElementById('by').textContent = '— ' + D.author;
document.getElementById('sub').textContent = D.sub;
if (D.user) document.getElementById('user').innerHTML = `${esc(D.user)}님 <i>${esc(D.user.slice(0,1))}</i>`;
const has = D.top >= 0, c1 = has ? COL[D.top] : '#ffcf6a', c2 = has ? COL[D.second] : '#5b84f0';
const card = document.getElementById('card');
if (has) {
  const pct = Math.round(D.conf * 100), C = 2 * Math.PI * 19;
  card.innerHTML = `<h4>오늘의 감정</h4><div class="emo"><i style="background:radial-gradient(circle at 35% 35%,#fff,${c1} 45%,${c1});box-shadow:0 0 14px ${c1}"></i>${EMO[D.top]}</div>
    <p class="msg">${esc(D.msg)}</p>
    <div class="conf"><div><small>AI 분석 신뢰도</small><b>${pct}%</b></div>
      <svg viewBox="0 0 46 46" role="img" aria-label="AI 분석 신뢰도 ${pct}%"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
      <circle cx="23" cy="23" r="19" fill="none" stroke="${c1}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*D.conf} ${C}" transform="rotate(-90 23 23)"/></svg></div>`;
} else {
  card.innerHTML = `<h4>오늘의 감정</h4><p class="none">아직 오늘의 기록이 없어요.<br>아래에 오늘의 일기를 쓰면<br>AI가 감정을 읽고 행성을 그려 줘요.</p>`;
}

const cv = document.getElementById('cv'), g = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, t0 = performance.now(), stars = [];
function rnd(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function draw(now){
  const t = (now - t0) / 1000;
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  stars.forEach(s => { g.fillStyle = `rgba(255,255,255,${s.a * (.6 + .4*Math.sin(t*s.f + s.p))})`; g.beginPath(); g.arc(s.x,s.y,s.r,0,6.283); g.fill(); });
  const r = Math.min(W*.24, H*.3), x = W/2, y = H/2;
  // 행성 뒤를 도는 작은 위성
  const ma = reduce ? 2.4 : t*.35 + 2.4, mx = x + Math.cos(ma)*r*1.75, my = y + Math.sin(ma)*r*.42;
  const front = Math.sin(ma) > 0;
  const moon = () => { g.fillStyle = '#d9cfa8'; g.beginPath(); g.arc(mx,my,r*.07,0,6.283); g.fill(); };
  g.strokeStyle = 'rgba(200,190,255,.25)'; g.lineWidth = 1; g.beginPath(); g.ellipse(x,y,r*1.75,r*.42,0,0,6.283); g.stroke();
  if (!front) moon();
  drawPlanet(g, x, y, r, c1, {second:c2, seed: 42, ring:true, glow:.85});
  if (front) moon();
  if (!reduce) requestAnimationFrame(draw);
}
function resize(){ W = cv.clientWidth; H = cv.clientHeight; cv.width = W*DPR; cv.height = H*DPR; const R = rnd(3); stars = Array.from({length:60}, () => ({x:R()*W, y:R()*H, r:.4+R()*.9, a:.2+R()*.5, f:.5+R()*1.5, p:R()*6})); requestAnimationFrame(draw); }
new ResizeObserver(resize).observe(cv);
</script>
</body></html>

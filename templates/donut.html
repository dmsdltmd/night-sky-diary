<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 오늘의 감정 비율: [도넛 | 7감정 목록] */
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:#eef0ff;font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  #app{height:__HEIGHT__px;display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
  svg{width:150px;height:150px}
  svg text{font-family:"Gothic A1",sans-serif}
  .leg{display:grid;gap:6px;font-size:12.5px}
  .leg div{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
  .leg i{width:9px;height:9px;border-radius:50%}
  .leg span:last-child{color:#a3a8cf;font-variant-numeric:tabular-nums}
  .none{grid-column:1/-1;text-align:center;color:#a3a8cf;font-size:13px;line-height:1.8}
</style></head>
<body><div id="app"></div>
<script>
const D = __DATA__;   // {emo, colors, p:[7] | null}
const app = document.getElementById('app');
if (!D.p) app.innerHTML = '<div class="none">일기를 저장하면<br>7가지 감정 비율이 여기에 그려져요.</div>';
else {
  const ord = D.emo.map((e,i)=>i).sort((a,b)=>D.p[b]-D.p[a]), C = 2*Math.PI*56; let off = 0;
  const arcs = ord.map(k => { const len = D.p[k]*C, gap = len > 5 ? 2.5 : 0, s = `<circle cx="75" cy="75" r="56" fill="none" stroke="${D.colors[k]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return s; }).join('');
  const t = ord[0];
  app.innerHTML = `<svg viewBox="0 0 150 150" role="img" aria-label="오늘의 감정 비율"><circle cx="75" cy="75" r="56" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>${arcs}
    <text x="75" y="71" text-anchor="middle" font-size="13" fill="${D.colors[t]}">${D.emo[t]}</text><text x="75" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#eef0ff">${Math.round(D.p[t]*100)}%</text></svg>
    <div class="leg">${D.emo.map((e,k) => `<div><i style="background:${D.colors[k]}"></i><span>${e}</span><span>${Math.round(D.p[k]*100)}%</span></div>`).join('')}</div>`;
}
</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: [숫자 카드 4개 | 감정 필터] 한 줄 → 아래 성운 배경의 별자리 지도 (상세 패널은 왼쪽 아래, 지도 버튼은 오른쪽 아래) */
  :root{
    --bg:#070918; --card:rgba(17,20,48,.78); --card-hi:rgba(26,30,70,.9); --line:rgba(150,160,255,.16); --line-hi:rgba(170,160,255,.42);
    --ink:#eef0ff; --sub:#a3a8cf; --faint:#6b7099; --gold:#ffcf6a; --violet:#9b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  #app{position:relative;height:__HEIGHT__px;display:grid;grid-template-rows:auto 1fr;gap:14px}
  button{font-family:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

  /* 위쪽 줄 */
  .top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(280px,1.55fr);gap:12px}
  .stat{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;overflow:hidden;min-width:0}
  .stat::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(155,140,255,.18)),transparent 70%);pointer-events:none}
  .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(155,140,255,.12);border:1px solid var(--line)}
  .ic svg{width:20px;height:20px;stroke:var(--c,#b9b0ff);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .stat .lab{font-size:12.5px;color:var(--sub);font-weight:500}
  .stat .val{font-size:27px;font-weight:700;line-height:1.25;margin-top:6px;color:var(--c,#eef0ff);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .val small{font-size:13px;font-weight:500;color:var(--sub);margin-left:3px}
  .stat .sub{font-size:11.5px;color:var(--faint);margin-top:2px}

  .filter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .fh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .fh svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6}
  .fh b{font-size:14px;font-weight:700}
  .all{margin-left:auto;border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px 8px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:rgba(255,255,255,.05);border-radius:99px;padding:4px 12px 4px 5px;font-size:12.5px;cursor:pointer;transition:opacity .15s}
  .chip i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--c) 45%,var(--c) 100%);box-shadow:0 0 10px var(--c)}
  .chip[aria-pressed="false"]{opacity:.35}
  .chip[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 45%,transparent)}

  /* 지도 */
  #stage{position:relative;border-radius:18px;overflow:hidden;min-height:0;border:1px solid var(--line)}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.drag{cursor:grabbing}
  .tip{position:absolute;transform:translate(-50%,-100%);background:rgba(14,16,40,.92);border:1px solid var(--line-hi);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none}
  .tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:rgba(14,16,40,.92);border-right:1px solid var(--line-hi);border-bottom:1px solid var(--line-hi)}
  .tip[hidden]{display:none}

  .panel{position:absolute;left:16px;bottom:16px;width:min(390px,calc(100% - 92px));max-height:calc(100% - 32px);overflow:auto;background:rgba(12,14,36,.93);border:1px solid var(--line-hi);border-radius:16px;padding:18px 20px;backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .panel[hidden]{display:none}
  .ph{display:flex;align-items:center;gap:10px}
  .ph .star{color:var(--gold);font-size:16px}
  .ph b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px}
  .x{margin-left:auto;border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
  .sec{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin:16px 0 10px;color:#d8dbf2}
  .sec svg{width:14px;height:14px;stroke:#d8dbf2;fill:none;stroke-width:1.6}
  .bar{display:flex;gap:3px;height:10px}
  .bar i{display:block;border-radius:6px;min-width:4px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:12px;font-size:12.5px}
  .list div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
  .list i{width:9px;height:9px;border-radius:50%}
  .list span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
  .txt{font-size:13px;line-height:1.75;color:#d3d6ee;margin:0 0 0 20px}
  .sims{display:flex;flex-wrap:wrap;gap:8px}
  .sims button{border:0;border-radius:99px;padding:6px 14px;font-size:12.5px;cursor:pointer}

  .ctrl{position:absolute;right:16px;bottom:16px;display:grid;gap:10px}
  .ctrl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(14,16,40,.85);cursor:pointer;display:grid;place-items:center}
  .ctrl svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round}
  .ctrl .gap{height:6px}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;line-height:1.7}

  @media (max-width:820px){
    .top{grid-template-columns:repeat(2,minmax(0,1fr))}
    .filter{grid-column:1/-1}
    .stat{padding:12px;grid-template-columns:32px minmax(0,1fr);gap:10px}
    .ic{width:32px;height:32px}.stat .val{font-size:21px}
    .panel{width:calc(100% - 32px);bottom:72px;max-height:55%}
    .ctrl{grid-auto-flow:column;right:16px;bottom:16px}
  }
</style></head>
<body>
<div id="app">
  <div class="top">
    <div class="stat" style="--c:#c7bdff"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></div>
      <div><div class="lab">총 기록 수</div><div class="val" id="s1"></div><div class="sub">별이 된 하루</div></div></div>
    <div class="stat" style="--c:#9fc2ff;--glow:rgba(110,160,255,.18)"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="17" cy="17" r="3.2"/><path d="M10 11l4-2.5M10 13l4 2.5"/></svg></div>
      <div><div class="lab">연결된 별 수</div><div class="val" id="s2"></div><div class="sub">비슷한 날과 이어짐</div></div></div>
    <div class="stat" id="s3box"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l7-7"/></svg></div>
      <div><div class="lab">가장 많은 감정</div><div class="val" id="s3"></div><div class="sub" id="s3s"></div></div></div>
    <div class="stat" id="s4box"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
      <div><div class="lab">이번 달 변화</div><div class="val" id="s4"></div><div class="sub" id="s4s"></div></div></div>
    <div class="filter">
      <div class="fh"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg><b>감정 필터</b><button class="all" id="all">✓ 전체 선택</button></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="panel" id="panel" hidden></div>
    <div class="ctrl">
      <button id="cCenter" aria-label="선택한 별로 이동"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <div class="gap"></div>
      <button id="cIn" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="cOut" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <div class="gap"></div>
      <button id="cFit" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
</div>

<script>
// 오류가 나면 화면에 바로 보여주기 (원인 찾기용)
window.addEventListener('error', e => {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#3a1420;color:#ffd7dd;border:1px solid #f0645a;border-radius:8px;padding:10px 12px;font:12px/1.5 monospace;white-space:pre-wrap';
  box.textContent = '별자리 지도 오류: ' + e.message + (e.lineno ? ' (줄 ' + e.lineno + ')' : '');
  document.body.appendChild(box);
});
</script>
<script>
const DATA = __DATA__;
const EMO = DATA.emo, COL = DATA.colors, NE = EMO.length, EXTRA = DATA.extra || {};
const cv = document.getElementById('cv'), g = cv.getContext('2d'), stage = document.getElementById('stage');
const DPR = Math.min(2, window.devicePixelRatio || 1), GOLD = '#ffcf6a';
let W = 0, H = 0, sel = -1, hover = -1, view = {k:1, x:0, y:0}, fit = {s:1, ox:0, oy:0};
const on = new Set(EMO.map((e,k) => k));          // 필터에 켜져 있는 감정

function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function order(v){return v.map((x,i)=>i).sort((a,b)=>v[b]-v[a])}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dot(d){return d.slice(5).replace('-','.')}
function full(d){const w='일월화수목금토'[new Date(d+'T00:00:00').getDay()];return d.replace(/-/g,'.')+' ('+w+')'}
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 별 준비 ---------- */
const N = DATA.stars.length;
const nb = Array.from({length:N}, () => []);
DATA.links.forEach(([i,j,s]) => { nb[i].push({j,s}); nb[j].push({j:i,s}); });
const stars = DATA.stars.map((s,i) => { const o = order(s.p); return {...s, i, top:o[0], second:o[1], conf:s.p[o[0]], ax:s.x, ay:s.y, x:s.x, y:s.y}; });
stars.forEach(s => s.r = 4.5 + s.conf * 3.5 + Math.min(4, nb[s.i].length * 1.1));

/* 감정 지도 좌표(PCA)를 중심으로, 별끼리 겹치지 않게 펼치기 */
(function relax(){
  const R = mb32(11);
  for (let it = 0; it < 260; it++) {
    for (let a = 0; a < N; a++) {
      const A = stars[a]; let fx = (A.ax - A.x) * .03, fy = (A.ay - A.y) * .03;
      for (let b = 0; b < N; b++) { if (a === b) continue; const B = stars[b];
        let dx = A.x - B.x, dy = A.y - B.y, d2 = dx*dx + dy*dy;
        if (d2 < 1e-6) { dx = R() - .5; dy = R() - .5; d2 = 1e-4; }
        const min = .11; if (d2 < min*min) { const d = Math.sqrt(d2), f = (min - d) / d * .4; fx += dx*f; fy += dy*f; } }
      nb[a].forEach(({j,s}) => { const B = stars[j]; fx += (B.x - A.x) * .006 * s; fy += (B.y - A.y) * .006 * s; });
      A.x = Math.min(1, Math.max(0, A.x + fx)); A.y = Math.min(1, Math.max(0, A.y + fy));
    }
  }
})();

/* ---------- 숫자 카드 ---------- */
(function cards(){
  const tops = Array(NE).fill(0); stars.forEach(s => tops[s.top]++);
  const topE = N ? tops.indexOf(Math.max(...tops)) : -1;
  document.getElementById('s1').innerHTML = `${N}<small>개</small>`;
  document.getElementById('s2').innerHTML = `${stars.filter(s => nb[s.i].length).length}<small>개</small>`;
  const b3 = document.getElementById('s3box');
  if (topE >= 0) { b3.style.setProperty('--c', COL[topE]); b3.style.setProperty('--glow', rgba(COL[topE], .2)); }
  document.getElementById('s3').textContent = topE >= 0 ? EMO[topE] : '-';
  document.getElementById('s3s').textContent = topE >= 0 ? `(${tops[topE]}일)` : '';
  const d = EXTRA.pos_delta, b4 = document.getElementById('s4box');
  const c4 = d == null ? '#a3a8cf' : d >= 0 ? '#7fe0a6' : '#ff8f86';
  b4.style.setProperty('--c', c4); b4.style.setProperty('--glow', rgba(c4, .16));
  document.getElementById('s4').textContent = d == null ? '-' : (d >= 0 ? '+' : '') + Math.round(d) + '%';
  document.getElementById('s4s').textContent = d == null ? '지난달 기록이 없어요' : '긍정 감정 · 지난달 대비';
})();

/* ---------- 감정 필터 ---------- */
(function filter(){
  const box = document.getElementById('chips');
  box.innerHTML = EMO.map((e,k) => `<button class="chip" data-k="${k}" style="--c:${COL[k]}" aria-pressed="true"><i></i>${e}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const k = +b.dataset.k; if (on.has(k)) on.delete(k); else on.add(k);
    if (!on.size) EMO.forEach((e,i) => on.add(i));
    sync(); if (sel >= 0 && !visible(stars[sel])) openPanel(-1); else draw();
  });
  document.getElementById('all').onclick = () => { EMO.forEach((e,i) => on.add(i)); sync(); draw(); };
})();
function sync(){ document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', on.has(+b.dataset.k))); }
function visible(s){ return on.has(s.top); }

/* ---------- 좌표 ---------- */
function computeFit(){
  const narrow = W < 820, padL = 70, padR = narrow ? 40 : 90, padT = 60, padB = narrow ? 90 : 70;
  const s = Math.min(W - padL - padR, H - padT - padB);
  fit = { sx: W - padL - padR, sy: H - padT - padB, ox: padL, oy: padT };
}
function px(s){ return (fit.ox + s.x * fit.sx) * view.k + view.x; }
function py(s){ return (fit.oy + s.y * fit.sy) * view.k + view.y; }

/* ---------- 성운 배경 (한 번만 그려 두기) ---------- */
let bgc = null;
function paintBg(){
  bgc = document.createElement('canvas'); bgc.width = W * DPR; bgc.height = H * DPR;
  const b = bgc.getContext('2d'); b.scale(DPR, DPR); const R = mb32(23);
  const base = b.createLinearGradient(0,0,W,H); base.addColorStop(0,'#0a0c22'); base.addColorStop(.6,'#080a1c'); base.addColorStop(1,'#0e0a26');
  b.fillStyle = base; b.fillRect(0,0,W,H);
  b.globalCompositeOperation = 'lighter';
  const clouds = [
    [.18,.30,.45,'#3b2a8a',.22],[.85,.80,.40,'#7a3fb8',.26],[.70,.95,.30,'#c050c0',.14],[.95,.35,.35,'#2a3a9a',.18],
    [.45,.60,.35,'#2a2470',.18],[.10,.85,.30,'#3a2a90',.16],[.55,.15,.30,'#24307a',.14]
  ];
  clouds.forEach(([cx,cy,r,c,a]) => { for (let k=0;k<6;k++){ const x=(cx+(R()-.5)*.12)*W, y=(cy+(R()-.5)*.12)*H, rr=r*Math.max(W,H)*(.5+R()*.5);
    const gr=b.createRadialGradient(x,y,0,x,y,rr); gr.addColorStop(0,rgba(c,a*.55)); gr.addColorStop(1,rgba(c,0)); b.fillStyle=gr; b.fillRect(0,0,W,H);} });
  // 은하수 띠 (오른쪽 아래로 흐르는 별무리)
  for (let i=0;i<Math.round(W*H/90);i++){ const t=R(), off=(R()+R()+R()-1.5)*.16; const x=(.35+t*.75+off*.5)*W, y=(.25+t*.8-off*.6)*H;
    b.fillStyle=`rgba(${200+R()*55|0},${190+R()*50|0},255,${.08+R()*.35})`; b.fillRect(x,y,R()*1.2+.3,R()*1.2+.3); }
  b.globalCompositeOperation = 'source-over';
  for (let i=0;i<Math.round(W*H/1400);i++){ b.fillStyle=`rgba(255,255,255,${.12+R()*.6})`; b.beginPath(); b.arc(R()*W,R()*H,.3+R()*1.1,0,6.283); b.fill(); }
  for (let i=0;i<14;i++){ const x=R()*W, y=R()*H, r=6+R()*8, gr=b.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,.8)'); gr.addColorStop(.3,'rgba(190,180,255,.25)'); gr.addColorStop(1,'rgba(190,180,255,0)'); b.fillStyle=gr; b.beginPath(); b.arc(x,y,r,0,6.283); b.fill(); }
  const vg=b.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)'); b.fillStyle=vg; b.fillRect(0,0,W,H);
}

/* ---------- 처음 열릴 때 별이 하나씩 떠오르기 ---------- */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let born = reduce ? 1e9 : 0;
const orderIdx = stars.map(s => s.i).sort((a,b) => stars[a].date < stars[b].date ? -1 : 1);
const rank = []; orderIdx.forEach((i,r) => rank[i] = r);
function appear(s){ return reduce ? 1 : Math.max(0, Math.min(1, (born - rank[s.i] * 35) / 500)); }

/* ---------- 그리기 ---------- */
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  if (bgc) g.drawImage(bgc, 0, 0, W, H);
  if (!N) return;
  const focus = sel >= 0 ? sel : hover;
  const near = new Set(focus >= 0 ? [focus, ...nb[focus].map(o => o.j)] : []);

  // 연결선
  DATA.links.forEach(([i,j,s]) => {
    const A = stars[i], B = stars[j], a = Math.min(appear(A), appear(B)); if (!a) return;
    const hit = focus >= 0 && (i === focus || j === focus);
    const dim = !(visible(A) && visible(B));
    const x1=px(A), y1=py(A), x2=px(B), y2=py(B);
    g.globalAlpha = a;
    if (hit) {
      const lg = g.createLinearGradient(x1,y1,x2,y2); lg.addColorStop(0, rgba(GOLD,.95)); lg.addColorStop(1, rgba(GOLD,.35));
      g.strokeStyle = lg; g.lineWidth = 1.6; g.shadowColor = GOLD; g.shadowBlur = 8;
    } else {
      const lg = g.createLinearGradient(x1,y1,x2,y2); lg.addColorStop(0, rgba(COL[A.top], dim ? .05 : .45)); lg.addColorStop(1, rgba(COL[B.top], dim ? .05 : .45));
      g.strokeStyle = lg; g.lineWidth = 1; g.shadowBlur = 0;
    }
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.shadowBlur = 0;
    if (hit) for (let t=.2;t<1;t+=.2){ g.fillStyle='rgba(255,236,190,.85)'; g.beginPath(); g.arc(x1+(x2-x1)*t, y1+(y2-y1)*t, 1.2, 0, 6.283); g.fill(); }
    g.globalAlpha = 1;
  });

  // 별
  stars.forEach(s => {
    const a = appear(s); if (!a) return;
    const isSel = s.i === sel, x = px(s), y = py(s), c = isSel ? GOLD : COL[s.top];
    const dim = !visible(s);
    const r = (isSel ? s.r * 2.1 : s.r * (s.i === hover ? 1.25 : 1)) * Math.sqrt(view.k) * (.5 + .5 * a);
    g.globalAlpha = (dim ? .22 : 1) * a;
    g.globalCompositeOperation = 'lighter';
    const halo = g.createRadialGradient(x,y,0,x,y,r*(isSel ? 9 : 5));
    halo.addColorStop(0, rgba(c, isSel ? .75 : .55)); halo.addColorStop(.35, rgba(c, isSel ? .22 : .16)); halo.addColorStop(1, rgba(c,0));
    g.fillStyle = halo; g.beginPath(); g.arc(x,y,r*(isSel ? 9 : 5),0,6.283); g.fill();
    if (isSel || s.conf > .5) {
      const L = r * (isSel ? 6 : 3.2);
      for (let q=0;q<4;q++){ const an=q*Math.PI/2, ex=x+Math.cos(an)*L, ey=y+Math.sin(an)*L, sp=g.createLinearGradient(x,y,ex,ey);
        sp.addColorStop(0,'rgba(255,255,255,.9)'); sp.addColorStop(1,'rgba(255,255,255,0)'); g.strokeStyle=sp; g.lineWidth=isSel?1.4:.9; g.beginPath(); g.moveTo(x,y); g.lineTo(ex,ey); g.stroke(); }
    }
    g.globalCompositeOperation = 'source-over';
    const core = g.createRadialGradient(x - r*.25, y - r*.25, 0, x, y, r);
    core.addColorStop(0,'#ffffff'); core.addColorStop(.45, rgba(c,1)); core.addColorStop(1, rgba(c,.85));
    g.fillStyle = core; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
    if (isSel) { g.strokeStyle = 'rgba(255,230,170,.7)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x,y,r+5,0,6.283); g.stroke(); }
    if (s.corrected) { g.fillStyle = GOLD; g.beginPath(); g.arc(x + r + 1, y - r - 1, 2.2, 0, 6.283); g.fill(); }
    // 날짜
    if (!dim) {
      g.font = `${isSel ? 700 : 500} ${isSel ? 13 : 11.5}px "Gothic A1", sans-serif`; g.textAlign = 'center';
      g.fillStyle = 'rgba(5,6,18,.55)'; g.fillText(dot(s.date), x + 1, y + r + 15 + (isSel ? 6 : 0));
      g.fillStyle = isSel ? '#ffffff' : '#c9cce8'; g.fillText(dot(s.date), x, y + r + 14 + (isSel ? 6 : 0)); g.textAlign = 'left';
    }
    g.globalAlpha = 1;
  });
  placeTip();
}

/* ---------- 말풍선 (선택하거나 마우스를 올린 별의 날짜) ---------- */
function placeTip(){
  const tip = document.getElementById('tip'), i = sel >= 0 ? sel : hover;
  if (i < 0 || appear(stars[i]) < 1) { tip.hidden = true; return; }
  const s = stars[i], r = (i === sel ? s.r * 2.1 : s.r) * Math.sqrt(view.k);
  tip.textContent = s.date.replace(/-/g,'.'); tip.hidden = false;
  tip.style.left = px(s) + 'px'; tip.style.top = (py(s) - r - 22) + 'px';
}

/* ---------- 상세 패널 ---------- */
const IC = {
  ratio:'<svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg>',
  note:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  sim:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="13" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>',
};
function openPanel(i){
  sel = i; draw();
  const box = document.getElementById('panel');
  if (i < 0) { box.hidden = true; return; }
  const s = stars[i], o = order(s.p), mine = s.corrected && EMO.indexOf(s.corrected) >= 0 ? EMO.indexOf(s.corrected) : s.top;
  const sims = (s.similar || []).slice(0,3).map(t => ({...t, k: (stars.find(q => q.date === t.date) || {}).top}));
  const half = Math.ceil(NE / 2), cols = [o.slice(0, half), o.slice(half)];
  box.innerHTML = `
    <div class="ph"><span class="star">✦</span><b>${full(s.date)}</b>
      <span class="pill" style="background:${rgba(COL[mine],.18)};color:${COL[mine]}">${EMO[mine]}</span>
      <button class="x" aria-label="닫기">×</button></div>
    <div class="sec">${IC.ratio}감정 비율</div>
    <div class="bar">${EMO.map((e,k) => s.p[k] >= .01 ? `<i style="flex:${s.p[k]};background:${COL[k]}"></i>` : '').join('')}</div>
    <div class="list">${[0,1].map(c => `<div style="display:grid;gap:6px;grid-template-columns:1fr">${cols[c].map(k => `<div><i style="background:${COL[k]}"></i><span>${EMO[k]}</span><span>${Math.round(s.p[k]*100)}%</span></div>`).join('')}</div>`).join('')}</div>
    <div class="sec">${IC.note}일기 내용</div>
    <p class="txt">${esc(s.text)}</p>
    ${sims.length ? `<div class="sec">${IC.sim}비슷했던 날 TOP ${sims.length}</div>
      <div class="sims">${sims.map(t => `<button data-d="${esc(t.date)}" style="background:${rgba(COL[t.k ?? 0],.2)};color:${COL[t.k ?? 0]}">${dot(t.date)} (${EMO[t.k ?? 0]})</button>`).join('')}</div>` : ''}`;
  box.hidden = false;
  box.querySelector('.x').onclick = () => openPanel(-1);
  box.querySelectorAll('.sims button').forEach(b => b.onclick = () => { const j = stars.findIndex(q => q.date === b.dataset.d); if (j >= 0) { if (!visible(stars[j])) { on.add(stars[j].top); sync(); } openPanel(j); } });
}

/* ---------- 마우스, 버튼 ---------- */
function pick(mx,my){ let best=-1, bd=1e9; stars.forEach(s => { if (!visible(s)) return; const d = Math.hypot(px(s)-mx, py(s)-my); if (d < bd) { bd = d; best = s.i; } }); return bd <= 16 ? best : -1; }
function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
let drag = null, moved = false;
cv.addEventListener('pointerdown', e => { drag = {p:pos(e), x:view.x, y:view.y}; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const [mx,my] = pos(e);
  if (drag) { const dx = mx - drag.p[0], dy = my - drag.p[1]; if (Math.abs(dx)+Math.abs(dy) > 3) { moved = true; cv.classList.add('drag'); } if (moved) { view.x = drag.x + dx; view.y = drag.y + dy; draw(); } return; }
  const h = pick(mx,my); if (h !== hover) { hover = h; cv.style.cursor = h >= 0 ? 'pointer' : 'grab'; draw(); }
});
cv.addEventListener('pointerup', e => { cv.classList.remove('drag'); if (!moved) { const [mx,my] = pos(e); const i = pick(mx,my); if (i >= 0 || sel >= 0) openPanel(i); } drag = null; });
cv.addEventListener('pointerleave', () => { if (hover >= 0) { hover = -1; draw(); } });
function zoomAt(f,cx,cy){ const k = Math.min(4, Math.max(.6, view.k*f)); f = k/view.k; view.x = cx-(cx-view.x)*f; view.y = cy-(cy-view.y)*f; view.k = k; draw(); }
cv.addEventListener('wheel', e => { e.preventDefault(); const [mx,my] = pos(e); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, mx, my); }, {passive:false});
document.getElementById('cIn').onclick = () => zoomAt(1.25, W/2, H/2);
document.getElementById('cOut').onclick = () => zoomAt(1/1.25, W/2, H/2);
document.getElementById('cFit').onclick = () => { view = {k:1,x:0,y:0}; draw(); };
document.getElementById('cCenter').onclick = () => {
  const i = sel >= 0 ? sel : (stars.length ? orderIdx[orderIdx.length-1] : -1); if (i < 0) return;
  const s = stars[i]; view.x += W/2 - px(s); view.y += H/2 - py(s); if (sel < 0) openPanel(i); else draw();
};

/* ---------- 시작 ---------- */
function resize(){ W = stage.clientWidth; H = stage.clientHeight; cv.width = W*DPR; cv.height = H*DPR; computeFit(); paintBg(); draw(); }
if (!N) { const e = document.createElement('div'); e.className = 'empty'; e.innerHTML = '아직 뜬 별이 없어요.<br>오늘의 별에서 첫 일기를 써 보세요.'; stage.appendChild(e); }
new ResizeObserver(resize).observe(stage);
resize();
if (!reduce && N) { const t0 = performance.now(), end = N * 35 + 550; (function tick(now){ born = now - t0; draw(); if (born < end) requestAnimationFrame(tick); else { born = 1e9; openBusiest(); } })(t0); }
else if (N) openBusiest();
// 처음에는 가장 많이 이어진 별을 열어서, 누르면 무엇이 보이는지 바로 알 수 있게
function openBusiest(){ let b = 0; stars.forEach(s => { if (nb[s.i].length > nb[b].length) b = s.i; }); openPanel(b); }
</script>
</body></html>

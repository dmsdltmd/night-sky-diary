<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1ff;--muted:#a6a8ce;--soft:#777a9f;--edge:rgba(177,157,255,.20);--violet:#aa95ff;--gold:#ffda89;--card:#12162f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:transparent;color:var(--ink);font:13px/1.6 'Gothic A1','Malgun Gothic',sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #e4d4ff;outline-offset:3px}
#app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:14px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(179,147,255,.16);border-radius:20px;background:radial-gradient(ellipse at 57% 36%,#242149 0%,#12132c 45%,#0a0e21 85%);isolation:isolate}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 80px rgba(7,8,27,.45)}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#eyebrow{position:absolute;top:22px;left:24px;pointer-events:none;z-index:2;text-shadow:0 2px 10px #070b20}
#eyebrow strong{display:block;font-size:10px;letter-spacing:.22em;font-weight:800;color:#c7a9ff}
#eyebrow span{display:block;font-size:12px;color:#ccd0ed;margin-top:3px}
#legend{position:absolute;top:98px;left:22px;display:grid;gap:6px;z-index:2}
.lg{display:flex;align-items:center;gap:9px;width:max-content;padding:4px 8px 4px 4px;background:transparent;border:1px solid transparent;border-radius:30px;color:#d5d5ef;cursor:pointer;font-size:12px;text-align:left;transition:opacity .15s,background .15s}
.lg:hover,.lg:focus-visible{background:rgba(134,118,227,.17)}
.lg[aria-pressed="false"]{opacity:.38}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff 0%,var(--c) 58%,#27214c 100%);box-shadow:0 0 13px var(--c)}
#toolbar{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.segment,.switch{display:flex;align-items:center;padding:3px;background:rgba(13,15,39,.87);border:1px solid rgba(172,155,244,.23);border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.14);backdrop-filter:blur(12px)}
.segment button,.switch button{border:0;background:none;border-radius:8px;padding:8px 12px;cursor:pointer;color:#b8b9db;font-size:11.5px;white-space:nowrap;transition:background .15s,color .15s}
.segment button[aria-pressed="true"],.switch button[aria-pressed="true"]{background:rgba(148,126,255,.29);color:#fff}
.switch button{padding:8px 12px}
.switch button::before{content:'✧';margin-right:7px;color:#c8abff}
.switch button[aria-pressed="true"]::before{content:'✦';color:#ffe0a0}
#tip{position:absolute;z-index:5;transform:translate(-50%,calc(-100% - 12px));padding:6px 10px;background:rgba(14,16,37,.95);border:1px solid rgba(179,152,255,.48);border-radius:9px;white-space:nowrap;pointer-events:none;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tip[hidden]{display:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#aeb4db;text-align:center;font-size:12px;line-height:2}
#empty[hidden]{display:none}
.side{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:22px 19px;border-radius:20px;background:linear-gradient(156deg,rgba(35,33,74,.98),rgba(15,20,45,.98) 64%,rgba(17,21,45,.98));border:1px solid rgba(166,154,255,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.side::before{content:"";position:absolute;top:-80px;right:-70px;width:230px;height:230px;background:radial-gradient(circle,rgba(148,110,245,.14),transparent 70%);pointer-events:none}
.side-label{position:relative;color:#a9a8cf;letter-spacing:.13em;font-weight:800;font-size:10px}
.side h3{position:relative;font-size:18px;line-height:1.5;margin:9px 0 2px;font-weight:800}
.side-sub{position:relative;font-size:11.5px;color:#b4b5d5;margin:0 0 13px}
.hero{position:relative;display:flex;align-items:center;gap:13px;border:1px solid rgba(176,153,255,.16);background:rgba(12,16,38,.45);border-radius:15px;padding:12px;margin-bottom:15px}
.hero .orb{width:61px;height:61px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.95),var(--c) 32%,rgba(27,27,55,.94) 78%);box-shadow:0 0 25px color-mix(in srgb,var(--c) 43%,transparent),inset -8px -10px 17px rgba(8,10,29,.65)}
.hero .orb::after{content:"";width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.19);filter:blur(8px);transform:translate(-9px,-12px)}
.hero b{display:block;color:var(--c);font-size:17px;line-height:1.35;margin-bottom:3px}
.hero span{display:block;color:#b5b7d8;font-size:11px}
#note{position:relative;color:#e0def4;font-size:12px;line-height:1.85;padding-bottom:15px;margin-bottom:14px;border-bottom:1px solid rgba(159,151,227,.15);overflow-wrap:anywhere;max-height:90px;overflow:auto}
#note:empty{display:none}
.section{position:relative;min-height:0;display:flex;flex-direction:column;flex:1}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.section-head b{font-size:12px;font-weight:800;color:#ede9ff}
.section-head small{font-size:10px;color:#a4a8cd}
#relations{overflow:auto;min-height:0;display:grid;align-content:start;gap:7px;padding:1px 2px 6px 0}
.rel{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:11px;border:1px solid rgba(169,157,242,.14);background:rgba(23,27,57,.65);border-radius:12px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s}
.rel:hover{transform:translateY(-1px);border-color:rgba(187,167,255,.47);background:rgba(79,65,125,.32)}
.rel i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.rel b{display:block;font-size:12px}
.rel span{display:block;font-size:10.5px;color:#aeb1d5}
.rel em{font-size:10.5px;color:#f2d9a3;font-style:normal}
.missing{color:#a8afd2;font-size:11px;line-height:1.8;padding:14px 10px;border:1px dashed rgba(165,151,235,.22);border-radius:12px}
#ratio{position:relative;padding:0 0 12px}
.ratio-head{display:flex;justify-content:space-between;font-size:10px;color:#b6b9d9;margin-bottom:6px}
.ratio-track{height:5px;display:flex;border-radius:20px;overflow:hidden;background:#24294b}
.ratio-track span{height:100%;min-width:0}
#empty-panel{position:relative;padding:22px 2px;color:#aeb3da;font-size:12px;line-height:2}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr) 275px;gap:10px}.side{padding:18px 14px}.lg{font-size:11px}}
@media(max-width:710px){body{overflow:hidden}#app{height:__HEIGHT__px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 258px;gap:10px}#stage{height:auto;min-height:0}#eyebrow{left:15px;top:14px}#legend{top:70px;left:12px;gap:2px}.lg{font-size:11px;padding:2px 5px 2px 4px}.side{height:258px;min-height:0;max-height:none;overflow:auto;padding:14px 15px}#toolbar{left:10px;bottom:10px;gap:5px}.segment button,.switch button{padding:7px 9px;font-size:11px}}
@media(max-width:380px){#toolbar{bottom:8px}.segment button,.switch button{font-size:10px;padding:7px 8px}}
</style>
</head>
<body>
<div id="app">
 <section id="stage" aria-label="감정 별자리 지도">
  <canvas id="cv" aria-label="하루의 감정을 나타내는 별을 클릭하세요"></canvas>
  <div id="eyebrow"><strong>MY EMOTION UNIVERSE</strong><span>별 하나에 담긴 하루의 마음</span></div>
  <div id="legend" aria-label="감정 필터"></div>
  <div id="toolbar">
   <div class="segment" role="group" aria-label="지도를 보는 방식"><button id="m2" type="button" aria-pressed="true" title="평면 감정 지도">2D</button><button id="m3" type="button" aria-pressed="false" title="입체 감정 지도">3D</button></div>
   <div class="switch"><button id="timeMode" type="button" aria-pressed="false" title="닮은 감정 연결선과 날짜순 궤적 전환">시간의 궤적</button></div>
  </div>
  <div id="tip" hidden></div>
  <div id="empty" hidden>기록이 쌓이면<br>나만의 감정 별자리가 이곳에 나타나요.</div>
 </section>
 <aside class="side" aria-label="선택한 날짜의 감정">
  <div class="side-label">A DAY IN YOUR UNIVERSE</div>
  <h3 id="dateTitle">나의 감정 별</h3>
  <p class="side-sub" id="summary">별을 눌러 마음을 들여다보세요</p>
  <div class="hero" id="hero" hidden><div class="orb" id="orb"></div><div><b id="emotionName"></b><span id="emotionSub"></span></div></div>
  <div id="ratio" hidden></div>
  <div id="note"></div>
  <div class="section"><div class="section-head"><b id="relationsTitle">닮은 감정의 날</b><small id="relationsMeta"></small></div><div id="relations"></div></div>
 </aside>
</div>
<script>
// 기존 sky.py에서 주입하는 공통 행성 드로잉 코드를 그대로 사용합니다.
__PLANET_JS__
</script>
<script>
const DATA = __DATA__;
const EMO = DATA.emo, COLORS = DATA.colors, N = DATA.stars.length;
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d'), stage = document.getElementById('stage');
const DPR = Math.min(2,window.devicePixelRatio||1);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = {mode:2, path:false, selected:-1, hovered:-1, zoom:1, panX:0, panY:0, rotA:.54, rotB:.28};
const enabled = new Set(EMO.map((_,i)=>i));
const colorFor = k => COLORS[k] || '#c8b5ff';
const rgba = (hex,a) => {const h=hex.replace('#','');const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
const escapeHTML = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const dayLabel = date => `${Number(date.slice(5,7))}월 ${Number(date.slice(8,10))}일`;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const stars = DATA.stars.map((s,i) => {
 const rank=s.p.map((_,j)=>j).sort((a,b)=>s.p[b]-s.p[a]);
 return {...s,i,top:rank[0],second:rank[1],conf:s.p[rank[0]],ax:s.x,ay:s.y};
});
const links = DATA.links.filter(([i,j]) => stars[i] && stars[j]);
const degrees = Array(N).fill(0);links.forEach(([a,b])=>{degrees[a]++;degrees[b]++;});
stars.forEach(s=>{s.r=4.1+3.6*s.conf+Math.min(3,degrees[s.i]*.7);});
const byDate = new Map(stars.map(s=>[s.date,s.i]));
const chronological = stars.map(s=>s.i).sort((a,b)=>stars[a].date.localeCompare(stars[b].date));
const previousNext = new Map(chronological.map((id,i)=>[id,[chronological[i-1],chronological[i+1]].filter(x=>x!==undefined)]));

// 기존 2D PCA 좌표를 유지하면서 겹치는 별만 아주 조금 벌려 놓습니다.
(function relax(){const rand=mulberry(11);for(let n=0;n<80;n++)for(const a of stars){let dx=0,dy=0;for(const b of stars){if(a===b)continue;let x=a.x-b.x,y=a.y-b.y,dist=Math.hypot(x,y);if(dist<.075){if(dist<.0001){x=rand()-.5;y=rand()-.5;dist=Math.hypot(x,y)||1;}const f=(.075-dist)*.10/dist;dx+=x*f;dy+=y*f;}}a.x=clamp(a.x+dx+(a.ax-a.x)*.015,.04,.96);a.y=clamp(a.y+dy+(a.ay-a.y)*.015,.04,.96);}})();

const legend=document.getElementById('legend');
legend.innerHTML=EMO.map((e,k)=>`<button class="lg" type="button" data-k="${k}" aria-pressed="true" style="--c:${colorFor(k)}"><i></i>${escapeHTML(e)}</button>`).join('');
function syncLegend(){legend.querySelectorAll('.lg').forEach(b=>b.setAttribute('aria-pressed',String(enabled.has(Number(b.dataset.k)))));}
legend.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=Number(b.dataset.k);if(enabled.size===EMO.length){enabled.clear();enabled.add(k);}else if(enabled.has(k)){enabled.delete(k);}else enabled.add(k);if(!enabled.size)EMO.forEach((_,i)=>enabled.add(i));syncLegend();paint();});
const visible=s=>enabled.has(s.top);

let W=1,H=1,sky=null,frame=null,elapsed=0;
function coords(s){
 if(state.mode===2){const hpad=H<520?92:90;const xpad=W<610?Math.min(115,W*.32):Math.min(156,W*.27);return {x:(xpad+s.x*Math.max(40,W-xpad-48))*state.zoom+state.panX,y:(hpad+s.y*Math.max(35,H-hpad-88))*state.zoom+state.panY,scale:1,depth:0};}
 const ca=Math.cos(state.rotA),sa=Math.sin(state.rotA),cb=Math.cos(state.rotB),sb=Math.sin(state.rotB);
 const x=s.x3*ca+s.z3*sa;let z=-s.x3*sa+s.z3*ca,y=s.y3*cb-z*sb;z=s.y3*sb+z*cb;
 const perspective=3.1/(3.1+z),radius=Math.min(W,H)*.39*state.zoom;
 return {x:W*.56+x*radius*perspective+state.panX,y:H*.49+y*radius*perspective+state.panY,scale:perspective,depth:z};
}
function painter(b){
 const rand=mulberry(38);b.fillStyle='#0b0e22';b.fillRect(0,0,W,H);
 const washes=[[.53,.43,.58,'#362a76',.38],[.80,.73,.46,'#6e337d',.22],[.27,.73,.40,'#232c72',.33]];
 b.globalCompositeOperation='screen';
 washes.forEach(([x,y,r,c,a])=>{const rad=Math.max(W,H)*r,gr=b.createRadialGradient(x*W,y*H,0,x*W,y*H,rad);gr.addColorStop(0,rgba(c,a));gr.addColorStop(.5,rgba(c,a*.27));gr.addColorStop(1,rgba(c,0));b.fillStyle=gr;b.fillRect(0,0,W,H);});
 b.globalCompositeOperation='source-over';
 for(let i=0;i<Math.round(W*H/830);i++){const x=rand()*W,y=rand()*H,r=rand()*.75+.13;b.fillStyle=`rgba(232,231,255,${.07+rand()*.48})`;b.beginPath();b.arc(x,y,r,0,Math.PI*2);b.fill();}
}
function refreshSky(){sky=document.createElement('canvas');sky.width=Math.max(1,Math.round(W*DPR));sky.height=Math.max(1,Math.round(H*DPR));const b=sky.getContext('2d');b.scale(DPR,DPR);painter(b);}
function nebula(p,c,r,alpha){const radius=clamp(r*9,29,80);const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);grad.addColorStop(0,rgba(c,alpha));grad.addColorStop(.28,rgba(c,alpha*.36));grad.addColorStop(1,rgba(c,0));ctx.fillStyle=grad;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,6.283);ctx.fill();}
function line(a,b,col1,col2,alpha,width,dashed=false){
 const gr=ctx.createLinearGradient(a.x,a.y,b.x,b.y);gr.addColorStop(0,rgba(col1,alpha));gr.addColorStop(1,rgba(col2,alpha));ctx.strokeStyle=gr;ctx.lineWidth=width;
 ctx.setLineDash(dashed?[3,7]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
}
function paint(){
 if(!ctx)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(sky)ctx.drawImage(sky,0,0,W,H);if(!N)return;
 const projected=stars.map(coords);paint.projected=projected;
 const focus=state.hovered>=0?state.hovered:state.selected;
 ctx.save();ctx.globalCompositeOperation='screen';
 // 성운은 별 위치에 따라 퍼지므로 데이터와 무관한 가짜 감정 영역을 만들지 않습니다.
 stars.forEach(s=>{if(!visible(s))return;const p=projected[s.i];nebula(p,colorFor(s.top),s.r*p.scale,.10);});
 ctx.restore();
 if(state.path){
  // 날짜순 점선은 유사도 연결선과 완전히 다른 의미입니다.
  for(let i=1;i<chronological.length;i++){
   const a=chronological[i-1],b=chronological[i];if(!visible(stars[a])||!visible(stars[b]))continue;
   const active=focus>=0&&(a===focus||b===focus);
   line(projected[a],projected[b],'#d5c1ff','#ffda92',active?.92:.37,active?2.15:1.15,true);
  }
 }else{
  links.forEach(([a,b])=>{const A=stars[a],B=stars[b];if(!visible(A)||!visible(B))return;const active=focus>=0&&(focus===a||focus===b);line(projected[a],projected[b],colorFor(A.top),colorFor(B.top),active?.93:.28,active?2:1.05,false);});
 }
 for(const i of stars.map(s=>s.i).sort((a,b)=>projected[b].depth-projected[a].depth)){
  const s=stars[i],p=projected[i];if(!visible(s))continue;
  const active=i===state.selected,related=focus>=0&&(focus===i||(state.path?previousNext.get(focus)?.includes(i):links.some(([a,b])=>(a===focus&&b===i)||(b===focus&&a===i))));
  const dim=focus>=0&&!related;
  const color=colorFor(s.top),radius=s.r*p.scale*Math.sqrt(state.zoom)*(active?1.65:i===state.hovered?1.26:1);
  ctx.save();ctx.globalAlpha=dim?.52:1;ctx.globalCompositeOperation='screen';
  const rad=radius*(active?7:5),gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);gr.addColorStop(0,rgba(color,active?.72:.58));gr.addColorStop(.18,rgba(color,.24));gr.addColorStop(1,rgba(color,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.283);ctx.fill();
  if(active){ctx.strokeStyle=rgba('#e9ddff',.7);ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,radius+8+Math.sin(elapsed*.002)*1.6,0,6.283);ctx.stroke();}
  const core=ctx.createRadialGradient(p.x-radius*.24,p.y-radius*.3,0,p.x,p.y,radius);core.addColorStop(0,'#fff');core.addColorStop(.34,rgba(color,1));core.addColorStop(1,rgba(color,.79));ctx.fillStyle=core;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,6.283);ctx.fill();
  if(active){ctx.fillStyle='#eee9ff';ctx.font='700 12px "Gothic A1",sans-serif';ctx.textAlign='center';ctx.fillText(dayLabel(s.date),p.x,p.y+radius+22);}
  ctx.restore();
 }
 const tip=document.getElementById('tip');if(state.hovered>=0&&state.hovered!==state.selected&&visible(stars[state.hovered])){const s=stars[state.hovered],p=projected[state.hovered];tip.textContent=`${dayLabel(s.date)} · ${EMO[s.top]}`;tip.style.left=clamp(p.x,60,W-60)+'px';tip.style.top=p.y+'px';tip.hidden=false;}else tip.hidden=true;
}
function panel(index){
 state.selected=index;const title=document.getElementById('dateTitle'),summary=document.getElementById('summary'),hero=document.getElementById('hero'),ratio=document.getElementById('ratio'),note=document.getElementById('note'),rel=document.getElementById('relations'),name=document.getElementById('emotionName'),sub=document.getElementById('emotionSub');
 const relTitle=document.getElementById('relationsTitle'),relMeta=document.getElementById('relationsMeta');
 if(index<0){title.textContent='나의 감정 별';summary.textContent='별을 누르면 그날의 기록이 보여요';hero.hidden=true;ratio.hidden=true;note.textContent='';rel.innerHTML='<div class="missing">날짜가 쌓일수록 나만의 우주가 완성돼요.</div>';relTitle.textContent='닮은 감정의 날';relMeta.textContent='';paint();return;}
 const s=stars[index],rank=s.p.map((_,i)=>i).sort((a,b)=>s.p[b]-s.p[a]);
 title.textContent=dayLabel(s.date);summary.textContent='그날 마음에 남은 감정';hero.hidden=false;
 const orb=document.getElementById('orb');orb.style.setProperty('--c',colorFor(s.top));name.style.setProperty('--c',colorFor(s.top));name.textContent=EMO[s.top];sub.textContent=`${Math.round(s.conf*100)}% · ${EMO[s.second]} ${Math.round(s.p[s.second]*100)}%`;
 ratio.hidden=false;ratio.innerHTML=`<div class="ratio-head"><span>그날의 감정 비율</span><span>7가지 감정</span></div><div class="ratio-track">${s.p.map((v,i)=>`<span style="width:${(v*100).toFixed(2)}%;background:${colorFor(i)}" title="${escapeHTML(EMO[i])} ${Math.round(v*100)}%"></span>`).join('')}</div>`;
 note.textContent=s.text||'';
 let candidates;
 if(state.path){relTitle.textContent='시간의 궤적';relMeta.textContent='이전 · 다음 기록';candidates=(previousNext.get(index)||[]).map(i=>({i,detail:stars[i].date<s.date?'이전 기록':'다음 기록'}));}
 else{relTitle.textContent='닮은 감정의 날';relMeta.textContent='감정 비율 기준';candidates=(s.similar||[]).filter(t=>byDate.has(t.date)).map(t=>({i:byDate.get(t.date),detail:`유사도 ${Math.round(t.score*100)}%`})).slice(0,5);}
 rel.innerHTML=candidates.length?candidates.map(({i,detail})=>{const q=stars[i];return `<button class="rel" type="button" data-i="${i}" title="${escapeHTML(dayLabel(q.date))} 기록 보기"><i style="--c:${colorFor(q.top)}"></i><div><b>${escapeHTML(dayLabel(q.date))}</b><span>${escapeHTML(EMO[q.top])} · ${escapeHTML(EMO[q.second])}</span></div><em>${escapeHTML(detail)}</em></button>`;}).join(''):'<div class="missing">'+(N<2?'다른 날에도 기록하면 별이 연결돼요.':'연결된 날짜가 없어요.')+'</div>';
 paint();
}
document.getElementById('relations').addEventListener('click',e=>{const btn=e.target.closest('button[data-i]');if(!btn)return;const i=Number(btn.dataset.i);if(!visible(stars[i])){EMO.forEach((_,k)=>enabled.add(k));syncLegend();}panel(i);});
function setView(mode){state.mode=mode;state.zoom=1;state.panX=0;state.panY=0;document.getElementById('m2').setAttribute('aria-pressed',String(mode===2));document.getElementById('m3').setAttribute('aria-pressed',String(mode===3));paint();}
document.getElementById('m2').onclick=()=>setView(2);document.getElementById('m3').onclick=()=>setView(3);
document.getElementById('timeMode').onclick=()=>{state.path=!state.path;document.getElementById('timeMode').setAttribute('aria-pressed',String(state.path));panel(state.selected);};
let activePointer=null;
function position(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function pick(x,y){const P=paint.projected||[];let best=-1,dist=Infinity;stars.forEach(s=>{if(!visible(s))return;const p=P[s.i];if(!p)return;const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=s.i;}});return dist<17?best:-1;}
canvas.addEventListener('pointerdown',e=>{const [x,y]=position(e);activePointer={x,y,px:state.panX,py:state.panY,ra:state.rotA,rb:state.rotB,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const [x,y]=position(e);if(activePointer){const dx=x-activePointer.x,dy=y-activePointer.y;if(Math.abs(dx)+Math.abs(dy)>4)activePointer.moved=true;if(activePointer.moved){canvas.classList.add('drag');if(state.mode===2){state.panX=activePointer.px+dx;state.panY=activePointer.py+dy;}else{state.rotA=activePointer.ra+dx*.009;state.rotB=clamp(activePointer.rb+dy*.009,-1.25,1.25);}paint();}return;}const i=pick(x,y);if(i!==state.hovered){state.hovered=i;canvas.style.cursor=i<0?'grab':'pointer';paint();}});
canvas.addEventListener('pointerup',e=>{if(activePointer&&!activePointer.moved){const [x,y]=position(e),i=pick(x,y);if(i>=0)panel(i);}activePointer=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointercancel',()=>{activePointer=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointerleave',()=>{if(state.hovered>=0){state.hovered=-1;paint();}});
function zoomAt(f,x,y){const target=clamp(state.zoom*f,.65,3.5),ratio=target/state.zoom;if(state.mode===2){state.panX=x-(x-state.panX)*ratio;state.panY=y-(y-state.panY)*ratio;}state.zoom=target;paint();}
canvas.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=position(e);zoomAt(e.deltaY<0?1.12:1/1.12,x,y);},{passive:false});
let oldW=0,oldH=0;
function resize(){const w=Math.max(1,Math.round(stage.clientWidth)),h=Math.max(1,Math.round(stage.clientHeight));if(oldW===w&&oldH===h)return;oldW=w;oldH=h;W=w;H=h;canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);refreshSky();paint();}
let waiting=false;function scheduleResize(){if(waiting)return;waiting=true;requestAnimationFrame(()=>{waiting=false;resize();});}
new ResizeObserver(scheduleResize).observe(stage);resize();
if(N){panel(chronological[chronological.length-1]);}else{document.getElementById('empty').hidden=false;panel(-1);}
if(!reduceMotion){let previous=performance.now();function animate(now){const dt=Math.min(now-previous,80);previous=now;elapsed+=dt;if(state.mode===3&&!activePointer)state.rotA+=dt*.00013;if(state.mode===3||state.selected>=0)paint();requestAnimationFrame(animate);}requestAnimationFrame(animate);}
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--ink:#f4f2ff;--muted:#abb4d4;--soft:#7987b1;--violet:#b5a0ff;--line:rgba(183,197,255,.17);--card:#0d1532}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--ink);font:12px/1.6 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #d5c8ff;outline-offset:3px}
#app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:13px;min-width:0}
#stage{position:relative;overflow:hidden;isolation:isolate;min-width:0;border-radius:24px;border:1px solid rgba(163,174,242,.25);background:#090e27;box-shadow:0 12px 42px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.06)}
#stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 44% 50%,rgba(110,75,176,.18),transparent 50%),radial-gradient(ellipse at 82% 70%,rgba(70,51,154,.17),transparent 45%),linear-gradient(145deg,#0b1634 0%,#100f30 48%,#10112c 100%)}
#stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 105px rgba(1,4,18,.45);border-radius:inherit}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#topbar{position:absolute;z-index:3;top:21px;left:23px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.kicker{font:700 10px/1.2 'Inter','Segoe UI',sans-serif;letter-spacing:.28em;color:#e0d6ff;text-shadow:0 2px 10px #0b1028}
#topbar h2{margin:6px 0 0;font-size:18px;line-height:1.3;letter-spacing:-.06em;font-weight:700;color:#f7f4ff}
#topbar p{margin:5px 0 0;font-size:11px;color:#c3c9e6}
#starCount{padding:6px 9px 6px 10px;font:600 10px 'Inter','Segoe UI',sans-serif;letter-spacing:.09em;color:#c7d0ec;border:1px solid rgba(194,197,250,.25);border-radius:30px;background:rgba(13,20,50,.62);backdrop-filter:blur(12px);white-space:nowrap}
#starCount i{display:inline-block;width:6px;height:6px;background:#a7e8dc;border-radius:50%;box-shadow:0 0 11px #70dbd1;margin-right:8px;vertical-align:1px}
#filterbar{position:absolute;z-index:3;top:108px;left:22px;right:22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:530px}
.filter{cursor:pointer;min-width:0;padding:7px 10px 7px 9px;border:1px solid rgba(195,204,255,.13);border-radius:999px;background:rgba(15,23,53,.64);color:#cdd3ed;display:inline-flex;align-items:center;gap:7px;font-size:10.5px;line-height:1;white-space:nowrap;transition:background .2s,border-color .2s,opacity .2s,transform .2s;backdrop-filter:blur(9px)}
.filter i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 11px var(--c)}
.filter:hover{transform:translateY(-1px);border-color:rgba(201,197,255,.45);background:rgba(59,57,108,.56)}
.filter[aria-pressed="false"]{opacity:.40}
.filter[aria-pressed="true"]{border-color:rgba(206,206,255,.25)}
#toolbar{position:absolute;z-index:3;bottom:18px;left:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.control{display:flex;align-items:center;gap:3px;padding:4px;background:rgba(8,13,36,.79);border:1px solid rgba(195,198,255,.24);border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 5px 22px rgba(4,6,20,.20)}
.control button{border:0;background:transparent;color:#bac1df;border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer;white-space:nowrap;line-height:1.2;transition:background .2s,color .2s}
.control button:hover{color:#fff;background:rgba(152,139,227,.18)}
.control button[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,rgba(139,116,224,.66),rgba(98,105,188,.53));box-shadow:inset 0 1px rgba(255,255,255,.16)}
#timeMode::before{content:"";display:inline-block;vertical-align:1px;width:7px;height:7px;border:1px solid #a6d2fb;border-radius:50%;margin-right:8px;box-shadow:0 0 9px rgba(165,208,255,.3)}
#timeMode[aria-pressed="true"]::before{background:#bcdfff}
#hint{position:absolute;z-index:2;bottom:31px;right:20px;font-size:10px;color:#9aabd6;letter-spacing:.03em;pointer-events:none}
#tip{position:absolute;z-index:5;transform:translate(-50%,calc(-100% - 13px));white-space:nowrap;pointer-events:none;padding:7px 11px;border-radius:9px;border:1px solid rgba(207,196,255,.45);background:rgba(12,15,37,.93);box-shadow:0 8px 24px rgba(3,4,18,.4);font-size:11px}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2;pointer-events:none;color:#c5c4ea;line-height:2;font-size:13px}
#empty b{display:block;font-size:20px;letter-spacing:-.06em;color:#eee9ff;margin-bottom:8px}

/* The companion panel is deliberately an editorial journal, not another dashboard. */
#side{position:relative;display:flex;min-width:0;min-height:0;flex-direction:column;overflow:hidden;padding:25px 21px 20px;border:1px solid rgba(160,174,236,.22);border-radius:24px;background:radial-gradient(ellipse at 95% -5%,rgba(113,93,183,.23),transparent 49%),radial-gradient(ellipse at -20% 87%,rgba(45,78,139,.13),transparent 50%),linear-gradient(156deg,#161b3c,#101830 56%,#0c132a);box-shadow:inset 0 1px rgba(255,255,255,.065),0 16px 37px rgba(0,0,0,.07)}
#side::before{content:"";position:absolute;top:0;left:23px;right:23px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,202,255,.46),transparent);pointer-events:none}
.side-kicker{font:700 10px 'Inter','Segoe UI',sans-serif;letter-spacing:.24em;color:#b7a8ee}
#dateTitle{margin:12px 0 2px;font-size:34px;font-weight:800;letter-spacing:-.08em;line-height:1.23;color:#fff}
#summary{color:#9eaad2;font-size:11px;margin:0 0 18px}
#hero{position:relative;min-height:125px;flex:none;display:flex;align-items:center;gap:14px;padding:15px 14px;margin-bottom:17px;border:1px solid rgba(192,185,248,.20);border-radius:18px;background:radial-gradient(ellipse at 24% 48%,rgba(137,122,231,.19),transparent 60%),linear-gradient(140deg,rgba(45,48,92,.8),rgba(16,21,47,.88));overflow:hidden}
#hero::after{content:"";position:absolute;right:-48px;top:-65px;width:160px;height:160px;border:1px solid rgba(190,190,248,.1);border-radius:50%;box-shadow:0 0 0 32px rgba(174,159,255,.018),0 0 0 66px rgba(174,159,255,.012);pointer-events:none}
#orb{position:relative;flex:none;width:87px;height:87px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0%,color-mix(in srgb,var(--c) 48%,white) 12%,var(--c) 31%,color-mix(in srgb,var(--c2) 45%,#17234a) 61%,#0a1430 88%);box-shadow:0 0 0 5px rgba(225,223,255,.04),0 0 32px color-mix(in srgb,var(--c) 28%,transparent),inset -10px -10px 15px rgba(3,5,21,.65),inset 2px 3px 9px rgba(255,255,255,.3)}
#orb::before{content:"";position:absolute;inset:-8px;border:1px solid color-mix(in srgb,var(--c2) 68%,transparent);border-radius:50%;transform:rotate(-20deg) scaleX(1.10);opacity:.68}
#orb::after{content:"";position:absolute;left:16px;top:10px;width:25px;height:19px;background:rgba(255,255,255,.7);filter:blur(11px);border-radius:50%}
#hero-text{position:relative;z-index:2;min-width:0}
#emotionName{display:block;font-size:22px;letter-spacing:-.05em;line-height:1.3;font-weight:700;color:#fff}
#emotionSub{display:block;font-size:10px;color:#c8c8e1;line-height:1.8;margin-top:7px}
#ratio{flex:none;margin:0 0 17px}
.ratio-head{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#aab5d9;margin-bottom:8px}
.ratio-head span:last-child{color:#8999c2}
.ratio-track{height:7px;display:flex;gap:3px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.06)}
.ratio-track span{display:block;min-width:0;border-radius:999px}
#quote-label{font-size:10px;font-weight:700;letter-spacing:.04em;color:#a5afdc;margin:0 0 7px}
#note{min-height:0;max-height:104px;overflow:auto;flex:none;padding:13px 14px 14px;color:#f1ebff;font-size:11.5px;line-height:1.9;border-radius:13px;border:1px solid rgba(177,174,244,.19);border-left:2px solid rgba(180,166,250,.7);background:rgba(16,24,56,.56);overflow-wrap:anywhere;white-space:pre-wrap}
#note:empty{display:none}
#relationSection{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:19px;border-top:1px solid rgba(177,190,248,.13);padding-top:15px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
#relationsTitle{font-size:12px;font-weight:700;color:#eff0ff}
#relationsMeta{font-size:10px;color:#8392bd;white-space:nowrap}
#relations{min-height:0;overflow-y:auto;display:grid;align-content:start;gap:7px;padding-right:2px}
.rel{display:flex;width:100%;border:1px solid rgba(165,185,244,.17);border-radius:12px;background:linear-gradient(125deg,rgba(39,51,96,.56),rgba(18,28,59,.65));align-items:center;gap:10px;text-align:left;padding:10px 9px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.rel:hover{background:rgba(77,76,138,.48);border-color:rgba(193,179,255,.44);transform:translateX(2px)}
.rel i{display:block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 11px var(--c)}
.rel-info{min-width:0;flex:1}
.rel b{display:block;font-weight:700;font-size:11px;color:#f4f2ff}
.rel span{display:block;margin-top:1px;font-size:10px;color:#96a5ce}
.rel em{font-style:normal;white-space:nowrap;font-size:10px;color:#c6baf1}
.missing{padding:15px 12px;border:1px dashed rgba(171,180,234,.2);border-radius:12px;background:rgba(38,46,83,.3);color:#a6b2da;font-size:11px;line-height:1.85}
#relationSection[hidden],#hero[hidden],#ratio[hidden]{display:none!important}
@media(max-width:1020px){#app{grid-template-columns:minmax(0,1fr) 280px;gap:10px}#side{padding:22px 16px 17px}#filterbar{right:8px}.filter{padding:7px 8px}}

@media(max-width:420px){#topbar p,#hint,#starCount{display:none}#filterbar{top:71px}.filter{padding:6px}#relations{grid-template-columns:1fr}}
@media(max-width:740px){#side{display:flex;overflow-y:auto;overflow-x:hidden}#quote-label{display:block}#note{max-height:92px;flex:none}#relationSection{flex:none;min-height:130px;overflow:visible}#relations{display:grid;grid-template-columns:1fr;overflow:visible}#hero{min-height:86px;flex:none}#ratio{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){.filter,.rel,.control button{transition:none!important}}

<body>
<div id="app">
 <section id="stage" aria-label="감정이 비슷한 날을 연결한 우주 지도">
  <canvas id="cv" aria-label="감정 기록의 빛점을 선택하고 드래그해 탐색하는 지도"></canvas>
  <div id="topbar"><div><div class="kicker">EMOTION · NEBULA ATLAS</div><h2>나의 감정이 만든 우주</h2><p>한 달의 마음이 빛과 궤도가 되는 공간</p></div><div id="starCount"><i></i><span id="countValue">0 DAYS</span></div></div>
  <div id="filterbar" aria-label="감정 색상 필터"></div>
  <div id="toolbar"><div class="control" aria-label="지도 보기 방식"><button id="m2" type="button" aria-pressed="true" title="감정 비율로 가까운 날을 평면에 표시">2D</button><button id="m3" type="button" aria-pressed="false" title="감정 비율을 입체 공간에 표시">3D</button></div><div class="control"><button id="timeMode" type="button" aria-pressed="false" title="닮은 마음의 연결과 기록 날짜순 궤적을 전환">시간의 궤적</button></div></div>
  <div id="hint">빛을 선택하면 그날의 마음이 펼쳐집니다 <span>✦</span></div>
  <div id="tip" hidden></div>
  <div id="empty" hidden><b>아직 빛이 모이지 않았어요</b>감정 기록을 남기면<br>이곳에 나만의 우주가 펼쳐집니다.</div>
 </section>
 <aside id="side" aria-label="선택한 감정 기록">
  <div class="side-kicker">A MOMENT, HELD IN LIGHT</div>
  <h3 id="dateTitle">나의 하루</h3>
  <p id="summary">빛점을 선택하면 그날의 감정이 펼쳐져요</p>
  <div id="hero" hidden><div id="orb"></div><div id="hero-text"><b id="emotionName"></b><span id="emotionSub"></span></div></div>
  <div id="ratio" hidden></div>
  <div id="quote-label">그날의 한 문장</div>
  <div id="note"></div>
  <section id="relationSection"><div class="section-head"><b id="relationsTitle">비슷한 마음의 기억</b><small id="relationsMeta"></small></div><div id="relations"></div></section>
 </aside>
</div>
<script>
'use strict';
// sky.universe_html() supplies these values from the existing analysis pipeline.
const DATA=__DATA__;
const EMO=Array.isArray(DATA.emo)?DATA.emo:[];
const COLORS=Array.isArray(DATA.colors)?DATA.colors:[];
const records=Array.isArray(DATA.stars)?DATA.stars:[];
const N=records.length;
const canvas=document.getElementById('cv');
const stage=document.getElementById('stage');
const ctx=canvas.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

canvas.addEventListener('pointerdown',e=>{const p=pos(e);drag={x:p.x,y:p.y,px:state.panX,py:state.panY,ra:state.rotA,rb:state.rotB,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const p=pos(e);if(drag){const dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){canvas.classList.add('drag');if(state.view===2){state.panX=drag.px+dx;state.panY=drag.py+dy;}else{state.rotA=drag.ra+dx*.009;state.rotB=clamp(drag.rb+dy*.009,-1.2,1.2);}draw();}return;}const i=pick(p.x,p.y);if(state.hover!==i){state.hover=i;canvas.style.cursor=i<0?'grab':'pointer';draw();}});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const p=pos(e),i=pick(p.x,p.y);if(i>=0)panel(i);}drag=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointerleave',()=>{if(state.hover!==-1){state.hover=-1;draw();}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),next=clamp(state.zoom*(e.deltaY<0?1.1:1/1.1),.75,3),ratio=next/state.zoom;if(state.view===2){state.panX=p.x-(p.x-state.panX)*ratio;state.panY=p.y-(p.y-state.panY)*ratio;}state.zoom=next;draw();},{passive:false});
let oldW=0,oldH=0;
function resize(){const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);if(w===oldW&&h===oldH)return;oldW=w;oldH=h;W=w;H=h;canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);createBackground();draw();}
new ResizeObserver(()=>requestAnimationFrame(resize)).observe(stage);
resize();if(N){panel(order[order.length-1]);}else{$('empty').hidden=false;panel(-1);}
if(!reduced){let last=performance.now();function animate(now){const delta=Math.min(now-last,80);if(delta>=(state.view===3?55:85)){last=now;elapsed+=delta;if(state.view===3&&!drag)state.rotA+=delta*.000075;draw();}requestAnimationFrame(animate);}requestAnimationFrame(animate);}
</script>

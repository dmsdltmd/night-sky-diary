#stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 105px rgba(4,6,24,.42)}
#stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(240,198,255,.11),transparent 23%,transparent 76%,rgba(131,112,255,.08));mix-blend-mode:screen}
#cv{position:relative;z-index:0}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#eyebrow{position:absolute;top:22px;left:24px;pointer-events:none;z-index:2;text-shadow:0 2px 10px #070b20}
#eyebrow strong{display:block;font-size:10px;letter-spacing:.22em;font-weight:800;color:#c7a9ff}
#eyebrow span{display:block;font-size:12px;color:#ccd0ed;margin-top:3px}
#legend{position:absolute;top:98px;left:22px;display:grid;gap:6px;z-index:2}
.lg{display:flex;align-items:center;gap:9px;width:max-content;padding:4px 8px 4px 4px;background:transparent;border:1px solid transparent;border-radius:30px;color:#d5d5ef;cursor:pointer;font-size:12px;text-align:left;transition:opacity .15s,background .15s}
.lg:hover,.lg:focus-visible{background:rgba(134,118,227,.17)}
.lg[aria-pressed="false"]{opacity:.38}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff 0%,var(--c) 58%,#27214c 100%);box-shadow:0 0 13px var(--c)}
#toolbar{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.segment,.switch{display:flex;align-items:center;padding:3px;background:rgba(13,15,39,.87);border:1px solid rgba(172,155,244,.23);border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.14);backdrop-filter:blur(12px)}
.segment button,.switch button{border:0;background:none;border-radius:8px;padding:8px 12px;cursor:pointer;color:#b8b9db;font-size:11.5px;white-space:nowrap;transition:background .15s,color .15s}
.segment button[aria-pressed="true"],.switch button[aria-pressed="true"]{background:rgba(148,126,255,.29);color:#fff}
.switch button{padding:8px 12px}
.switch button::before{content:'✧';margin-right:7px;color:#c8abff}
.switch button[aria-pressed="true"]::before{content:'✦';color:#ffe0a0}
#tip{position:absolute;z-index:5;transform:translate(-50%,calc(-100% - 12px));padding:6px 10px;background:rgba(14,16,37,.95);border:1px solid rgba(179,152,255,.48);border-radius:9px;white-space:nowrap;pointer-events:none;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tip[hidden]{display:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#aeb4db;text-align:center;font-size:12px;line-height:2}
#empty[hidden]{display:none}
.side{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:24px 19px;border-radius:20px;background:radial-gradient(ellipse at 105% -12%,rgba(142,81,224,.26),transparent 54%),linear-gradient(156deg,#272044,#14182e 57%,#12152e);border:1px solid rgba(190,163,255,.31);box-shadow:inset 0 1px 0 rgba(255,255,255,.075),0 10px 45px rgba(6,5,30,.12)}
.side::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 93% 5%,rgba(186,122,242,.20),transparent 31%),radial-gradient(circle at -10% 88%,rgba(87,92,202,.13),transparent 45%);opacity:.78}
.side-label{position:relative;color:#cab9ff;letter-spacing:.18em;font-weight:800;font-size:10px}
.side h3{position:relative;font-size:24px;line-height:1.45;margin:9px 0 2px;font-weight:800;letter-spacing:-.025em;color:#f9f3ff;text-shadow:0 0 20px rgba(181,140,255,.23)}
.side-sub{position:relative;font-size:11.5px;color:#b4b5d5;margin:0 0 13px}
.hero{position:relative;display:flex;align-items:center;gap:16px;border:1px solid rgba(184,163,255,.29);background:linear-gradient(125deg,rgba(114,92,184,.22),rgba(12,17,42,.80) 70%);border-radius:17px;padding:15px 13px;margin:9px 0 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 9px 30px rgba(6,7,23,.16)}
.hero .orb{position:relative;width:79px;height:79px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,1),color-mix(in srgb,var(--c) 58%,#fff) 17%,var(--c) 43%,color-mix(in srgb,var(--c2) 45%,#1b163e) 66%,#12142d 99%);box-shadow:0 0 14px 3px color-mix(in srgb,var(--c) 37%,transparent),0 0 37px color-mix(in srgb,var(--c2) 31%,transparent),inset -12px -12px 23px rgba(7,8,23,.77),inset 4px 6px 10px rgba(255,255,255,.28)}
.hero .orb::before{content:"";position:absolute;left:-14px;right:-14px;top:24px;height:25px;border:1px solid color-mix(in srgb,var(--c2) 78%,#f2e7ff);border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 13px color-mix(in srgb,var(--c2) 43%,transparent);opacity:.74}
.hero .orb::after{content:"";position:absolute;width:29px;height:17px;left:13px;top:10px;border-radius:50%;background:rgba(255,255,255,.69);filter:blur(10px);transform:rotate(-34deg)}
.hero b{display:block;color:var(--c);font-size:20px;line-height:1.35;margin-bottom:5px;text-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
.hero span{display:block;color:#b5b7d8;font-size:11px}
#note{position:relative;color:#eeeafa;font-size:12.5px;line-height:1.9;padding:18px 15px 17px 28px;margin:10px 0 17px;border:1px solid rgba(166,147,233,.25);border-left:2px solid rgba(202,167,255,.67);border-radius:12px;background:linear-gradient(110deg,rgba(119,93,174,.18),rgba(14,18,40,.45));overflow-wrap:anywhere;max-height:120px;overflow:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
#note:not(:empty)::before{content:'“';position:absolute;top:-8px;left:8px;font-size:34px;font-family:Georgia,serif;color:#c6a4ff;opacity:.8}
#note:empty{display:none}
.section{position:relative;min-height:0;display:flex;flex-direction:column;flex:1}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.section-head b{font-size:13px;font-weight:800;color:#f0e8ff}
.section-head small{font-size:10px;color:#a4a8cd}
#relations{overflow:auto;min-height:0;display:grid;align-content:start;gap:7px;padding:1px 2px 6px 0}
.rel{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:12px 10px;border:1px solid rgba(181,159,242,.19);background:linear-gradient(115deg,rgba(58,48,107,.38),rgba(19,25,55,.64));border-radius:12px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s}
.rel:hover{transform:translateY(-1px);border-color:rgba(187,167,255,.47);background:rgba(79,65,125,.32)}
.rel i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.rel b{display:block;font-size:12px}

<script>
// 기존 sky.py에서 주입하는 공통 행성 드로잉 코드를 그대로 사용합니다.
__PLANET_JS__

<script>
const DATA = __DATA__;
const EMO = DATA.emo, COLORS = DATA.colors, N = DATA.stars.length;
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d'), stage = document.getElementById('stage');
const DPR = Math.min(2,window.devicePixelRatio||1);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = {mode:2, path:N>=2 && N<=3, selected:-1, hovered:-1, zoom:1, panX:0, panY:0, rotA:.54, rotB:.28};
const enabled = new Set(EMO.map((_,i)=>i));
const colorFor = k => COLORS[k] || '#c8b5ff';
const rgba = (hex,a) => {const h=hex.replace('#','');const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
const escapeHTML = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const dayLabel = date => `${Number(date.slice(5,7))}월 ${Number(date.slice(8,10))}일`;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const stars = DATA.stars.map((s,i) => {
 const rank=s.p.map((_,j)=>j).sort((a,b)=>s.p[b]-s.p[a]);
 return {...s,i,top:rank[0],second:rank[1],conf:s.p[rank[0]],ax:s.x,ay:s.y};
});
const links = DATA.links.filter(([i,j]) => stars[i] && stars[j]);
const degrees = Array(N).fill(0);links.forEach(([a,b])=>{degrees[a]++;degrees[b]++;});
stars.forEach(s=>{s.r=(4.1+3.6*s.conf+Math.min(3,degrees[s.i]*.7))*(N<=3?1.33:1);});
const byDate = new Map(stars.map(s=>[s.date,s.i]));
const chronological = stars.map(s=>s.i).sort((a,b)=>stars[a].date.localeCompare(stars[b].date));
const previousNext = new Map(chronological.map((id,i)=>[id,[chronological[i-1],chronological[i+1]].filter(x=>x!==undefined)]));

// 기존 2D PCA 좌표를 유지하면서 겹치는 별만 아주 조금 벌려 놓습니다.
(function relax(){const rand=mulberry(11);for(let n=0;n<80;n++)for(const a of stars){let dx=0,dy=0;for(const b of stars){if(a===b)continue;let x=a.x-b.x,y=a.y-b.y,dist=Math.hypot(x,y);if(dist<.075){if(dist<.0001){x=rand()-.5;y=rand()-.5;dist=Math.hypot(x,y)||1;}const f=(.075-dist)*.10/dist;dx+=x*f;dy+=y*f;}}a.x=clamp(a.x+dx+(a.ax-a.x)*.015,.04,.96);a.y=clamp(a.y+dy+(a.ay-a.y)*.015,.04,.96);}})();

const legend=document.getElementById('legend');
legend.innerHTML=EMO.map((e,k)=>`<button class="lg" type="button" data-k="${k}" aria-pressed="true" style="--c:${colorFor(k)}"><i></i>${escapeHTML(e)}</button>`).join('');
function syncLegend(){legend.querySelectorAll('.lg').forEach(b=>b.setAttribute('aria-pressed',String(enabled.has(Number(b.dataset.k)))));}
legend.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=Number(b.dataset.k);if(enabled.size===EMO.length){enabled.clear();enabled.add(k);}else if(enabled.has(k)){enabled.delete(k);}else enabled.add(k);if(!enabled.size)EMO.forEach((_,i)=>enabled.add(i));syncLegend();paint();});
const visible=s=>enabled.has(s.top);

let W=1,H=1,sky=null,frame=null,elapsed=0;
function coords(s){
 if(state.mode===2){const hpad=H<520?92:90;const xpad=W<610?Math.min(115,W*.32):Math.min(156,W*.27);return {x:(xpad+s.x*Math.max(40,W-xpad-48))*state.zoom+state.panX,y:(hpad+s.y*Math.max(35,H-hpad-88))*state.zoom+state.panY,scale:1,depth:0};}
 const ca=Math.cos(state.rotA),sa=Math.sin(state.rotA),cb=Math.cos(state.rotB),sb=Math.sin(state.rotB);
 const x=s.x3*ca+s.z3*sa;let z=-s.x3*sa+s.z3*ca,y=s.y3*cb-z*sb;z=s.y3*sb+z*cb;
 const perspective=3.1/(3.1+z),radius=Math.min(W,H)*.39*state.zoom;
 return {x:W*.56+x*radius*perspective+state.panX,y:H*.49+y*radius*perspective+state.panY,scale:perspective,depth:z};
}
function painter(b){
 // 배경은 실제 감정 기록이 아니라 장식용 우주입니다. 별 데이터와 혼동되지 않도록 구분해 그립니다.
 const rand=mulberry(6739);
 const skyFill=b.createLinearGradient(0,0,W,H);
 skyFill.addColorStop(0,'#070d24');skyFill.addColorStop(.48,'#101038');skyFill.addColorStop(1,'#090b20');
 b.clearRect(0,0,W,H);
 b.globalCompositeOperation='screen';
 // 겹쳐진 성운의 큰 색 영역. 두 개의 기록만 있어도 빈 공간이 밋밋하지 않도록 구성합니다.
 const ambient=[
  [.20,.29,.45,'#4737d9',.39],[.66,.65,.51,'#a033b1',.36],
  [.82,.19,.38,'#5238b5',.34],[.20,.84,.42,'#19419a',.38],
  [.69,.84,.29,'#b341a8',.24],[.56,.36,.28,'#4934a1',.19],
  [.08,.49,.24,'#256a9c',.21],[.96,.58,.34,'#732fa9',.25]
 ];
 ambient.forEach(([x,y,r,c,a])=>{
  const radius=Math.max(W,H)*r,gr=b.createRadialGradient(x*W,y*H,0,x*W,y*H,radius);
  gr.addColorStop(0,rgba(c,a));gr.addColorStop(.31,rgba(c,a*.65));
  gr.addColorStop(.65,rgba(c,a*.19));gr.addColorStop(1,rgba(c,0));
  b.fillStyle=gr;b.fillRect(0,0,W,H);
 });
 // 은하수처럼 흐르는 두 줄의 가벼운 별빛 먼지와 겹친 구름.
 const streams=[
   {x:.00,y:.75,dx:1.07,dy:-.62,amp:.11,phase:.5,spread:.075,c:'#9b5dff',n:155},
   {x:-.09,y:.82,dx:1.16,dy:-.48,amp:.10,phase:2.1,spread:.065,c:'#f176cb',n:120},
   {x:-.03,y:.63,dx:1.12,dy:-.48,amp:.08,phase:4.4,spread:.08,c:'#4b7ee6',n:100},
 ];
 streams.forEach(st=>{
  for(let i=0;i<st.n;i++){
   const t=rand(),wave=Math.sin(t*8.0+st.phase)*st.amp;
   const x=(st.x+st.dx*t+Math.sin(t*3.8)*.035)*W;
   const y=(st.y+st.dy*t+wave+(rand()-.5)*st.spread)*H;
   const cloud=Math.min(W,H)*(.035+rand()*.09);
   const shade=rand()*.025+.009;
   const gr=b.createRadialGradient(x,y,0,x,y,cloud);
   gr.addColorStop(0,rgba(st.c,shade));gr.addColorStop(.4,rgba(st.c,shade*.42));gr.addColorStop(1,rgba(st.c,0));
   b.fillStyle=gr;b.fillRect(x-cloud,y-cloud,cloud*2,cloud*2);
  }
 });
 // 성운의 먼지 띠: 작은 점들은 상호작용하는 기록 별이 아닌 장식입니다.
 for(let i=0;i<1550;i++){
  const u=rand(),wave=Math.sin(u*8.0+.7)*.10;
  const px=(.02+u*1.02+(rand()-.5)*.14)*W;
  const py=(.76-.56*u+wave+(rand()-.5)*.15)*H;
  const r=.25+rand()*1.05;
  b.fillStyle=rgba(i%7===0?'#f7b5ed':i%5===0?'#ada9ff':'#e8d9ff',.08+rand()*.27);
  b.beginPath();b.arc(px,py,r,0,Math.PI*2);b.fill();
 }
 b.globalCompositeOperation='source-over';
 // 공간에 깊이를 만드는 멀리 있는 작은 별들.
 for(let i=0;i<Math.round(W*H/470);i++){
  const x=rand()*W,y=rand()*H,r=rand()*.83+.1;
  b.fillStyle=`rgba(232,232,255,${.06+rand()*.53})`;
  b.beginPath();b.arc(x,y,r,0,Math.PI*2);b.fill();
 }
 // 드물게 반짝이는 별빛. 실제 기록 별처럼 커지지 않게 작게 표현합니다.
 for(let i=0;i<34;i++){
  const x=(.06+rand()*.88)*W,y=(.04+rand()*.91)*H;
  const power=.16+rand()*.28,size=1.8+rand()*2.8;
  b.strokeStyle=`rgba(216,206,255,${power})`;b.lineWidth=.55;
  b.beginPath();b.moveTo(x-size,y);b.lineTo(x+size,y);b.moveTo(x,y-size*1.6);b.lineTo(x,y+size*1.6);b.stroke();
  b.fillStyle=`rgba(249,242,255,${power+.11})`;b.beginPath();b.arc(x,y,.5,0,Math.PI*2);b.fill();
 }
 // 색 영역과 가장자리가 부드럽게 이어지도록 비네트 처리.
 const vignette=b.createRadialGradient(W*.52,H*.49,Math.min(W,H)*.14,W*.52,H*.5,Math.max(W,H)*.75);
 vignette.addColorStop(0,'rgba(2,4,17,0)');vignette.addColorStop(1,'rgba(2,3,13,.60)');
 b.fillStyle=vignette;b.fillRect(0,0,W,H);
}
function refreshSky(){sky=document.createElement('canvas');sky.width=Math.max(1,Math.round(W*DPR));sky.height=Math.max(1,Math.round(H*DPR));const b=sky.getContext('2d');b.scale(DPR,DPR);painter(b);}
function nebula(p,c,r,alpha){const radius=clamp(r*13,48,138);const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);grad.addColorStop(0,rgba(c,alpha));grad.addColorStop(.28,rgba(c,alpha*.36));grad.addColorStop(1,rgba(c,0));ctx.fillStyle=grad;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,6.283);ctx.fill();}
function curveControl(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
 const bend=Math.min(24,len*.11),dir=(dx+dy>=0?1:-1);
 return {x:(a.x+b.x)/2-dy/len*bend*dir,y:(a.y+b.y)/2+dx/len*bend*dir};
}
function pointOnCurve(a,b,t){
 const c=curveControl(a,b),u=1-t;
 return {x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};
}
function line(a,b,col1,col2,alpha,width,dashed=false){
 const c=curveControl(a,b),gradient=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
 gradient.addColorStop(0,rgba(col1,alpha*.90));gradient.addColorStop(.52,rgba('#e7ddff',alpha*.78));gradient.addColorStop(1,rgba(col2,alpha*.90));
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=gradient;
 // One curved filament with a halo, not a rigid geometry-like graph.
 ctx.globalAlpha=.21;ctx.lineWidth=width*5.5;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke();
 ctx.globalAlpha=1;ctx.lineWidth=width;ctx.setLineDash(dashed?[3,6]:[]);
 if(dashed)ctx.lineDashOffset=reduceMotion?0:-elapsed*.008;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke();ctx.restore();
}
function lightTraveler(a,b,color,seed,power=1){
 if(reduceMotion)return;
 const t=(elapsed*.00019+seed*.371)%1,{x,y}=pointOnCurve(a,b,t);
 ctx.save();ctx.globalCompositeOperation='screen';
 const glow=ctx.createRadialGradient(x,y,0,x,y,15*power);
 glow.addColorStop(0,rgba('#fff',.66*power));glow.addColorStop(.18,rgba(color,.50*power));glow.addColorStop(1,rgba(color,0));
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,15*power,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f5f8ff';ctx.beginPath();ctx.arc(x,y,1.35*power,0,Math.PI*2);ctx.fill();ctx.restore();
}
function paint(){
 if(!ctx)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(sky)ctx.drawImage(sky,0,0,W,H);if(!N)return;
 const projected=stars.map(coords);paint.projected=projected;
 const focus=state.hovered>=0?state.hovered:state.selected;
 ctx.save();ctx.globalCompositeOperation='screen';
 // 성운은 별 위치에 따라 퍼지므로 데이터와 무관한 가짜 감정 영역을 만들지 않습니다.
 stars.forEach(s=>{if(!visible(s))return;const p=projected[s.i];nebula(p,colorFor(s.top),s.r*p.scale,.24);});
 ctx.restore();
 if(state.path){
  // 날짜순 점선은 유사도 연결선과 완전히 다른 의미입니다.
  for(let i=1;i<chronological.length;i++){
   const a=chronological[i-1],b=chronological[i];if(!visible(stars[a])||!visible(stars[b]))continue;
   const active=focus>=0&&(a===focus||b===focus);
   line(projected[a],projected[b],colorFor(stars[a].top),colorFor(stars[b].top),active?.92:.55,active?2.4:1.25,true);
   if(active||chronological.length<=4)lightTraveler(projected[a],projected[b],colorFor(stars[b].top),i,active?1.1:.78);
  }
 }else{
  links.forEach(([a,b],index)=>{const A=stars[a],B=stars[b];if(!visible(A)||!visible(B))return;const active=focus>=0&&(focus===a||focus===b);line(projected[a],projected[b],colorFor(A.top),colorFor(B.top),active?.97:.37,active?2.35:1.1,false);if(active)lightTraveler(projected[a],projected[b],colorFor(A.top),index,1.04);});
 }
 for(const i of stars.map(s=>s.i).sort((a,b)=>projected[b].depth-projected[a].depth)){
  const s=stars[i],p=projected[i];if(!visible(s))continue;
  const active=i===state.selected,related=focus>=0&&(focus===i||(state.path?previousNext.get(focus)?.includes(i):links.some(([a,b])=>(a===focus&&b===i)||(b===focus&&a===i))));
  const dim=focus>=0&&!related;
  const c1=colorFor(s.top),c2=colorFor(s.second);
  const radius=clamp((8.8+Math.sqrt(Math.max(0,s.conf))*5.8)*p.scale*Math.sqrt(state.zoom)*(active?1.29:i===state.hovered?1.12:1)*(N<=3?1.15:1),7,29);
  const breathe=reduceMotion?1:1+Math.sin(elapsed*.0017+i*1.9)*.09;
  ctx.save();ctx.globalAlpha=dim?.50:1;ctx.globalCompositeOperation='screen';
  // The emotional field encodes the dominant feeling with a quiet secondary halo.
  const outer=radius*(active?8.3:6.5)*breathe;
  const halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,outer);
  halo.addColorStop(0,rgba(c1,active?.35:.28));halo.addColorStop(.21,rgba(c1,active?.22:.15));
  halo.addColorStop(.46,rgba(c2,.052));halo.addColorStop(1,rgba(c1,0));
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(p.x,p.y,outer,0,Math.PI*2);ctx.fill();
  // Thin concentric energy echoes show focus. They are NOT additional diary points.
  ctx.globalCompositeOperation='source-over';
  const ringA=radius*(active?2.28:1.85),ringB=radius*(active?3.02:2.43);
  ctx.lineWidth=active?1.25:.7;ctx.strokeStyle=rgba(c1,active?.59:.20);
  ctx.beginPath();ctx.arc(p.x,p.y,ringA,0,Math.PI*2);ctx.stroke();
  if(active){ctx.strokeStyle=rgba(c2,.43);ctx.lineWidth=.9;ctx.beginPath();ctx.arc(p.x,p.y,ringB,.2,Math.PI*1.37);ctx.stroke();}
  // A glossy, circular light drop: recognizable, not a five-pointed star/planet.
  const body=ctx.createRadialGradient(p.x-radius*.27,p.y-radius*.33,radius*.02,p.x,p.y,radius*1.14);
  body.addColorStop(0,rgba('#ffffff',.65));
  body.addColorStop(.25,rgba(c1,1));body.addColorStop(.61,rgba(c1,.93));
  body.addColorStop(.84,rgba(c2,.24));body.addColorStop(1,rgba('#0c1635',.87));
  ctx.fillStyle=body;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle=rgba('#ffffff',active?.58:.22);ctx.stroke();
  // Secondary feeling reads as a *single arc*, not a whole second planet color.
  ctx.strokeStyle=rgba(c2,active?.95:.75);ctx.lineWidth=active?2.5:1.7;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(p.x,p.y,radius+3,-Math.PI*.38,Math.PI*.15);ctx.stroke();
  const gleam=ctx.createRadialGradient(p.x-radius*.35,p.y-radius*.4,0,p.x-radius*.3,p.y-radius*.35,radius*.52);
  gleam.addColorStop(0,'rgba(255,255,255,.66)');gleam.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gleam;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();
  // Keep labels for small datasets; more days stay uncluttered until selected.
  if(active||N<=4){
   ctx.fillStyle=active?'#f9fbff':'rgba(236,240,255,.83)';
   ctx.font=(active?'700':'500')+' 12px "Gothic A1",sans-serif';ctx.textAlign='center';
   ctx.shadowColor='rgba(7,9,32,.9)';ctx.shadowBlur=8;
   ctx.fillText(dayLabel(s.date),p.x,p.y+ringA+18);
  }
  ctx.restore();
 }
 const tip=document.getElementById('tip');if(state.hovered>=0&&state.hovered!==state.selected&&visible(stars[state.hovered])){const s=stars[state.hovered],p=projected[state.hovered];tip.textContent=`${dayLabel(s.date)} · ${EMO[s.top]}`;tip.style.left=clamp(p.x,60,W-60)+'px';tip.style.top=p.y+'px';tip.hidden=false;}else tip.hidden=true;
}
function panel(index){
 state.selected=index;const title=document.getElementById('dateTitle'),summary=document.getElementById('summary'),hero=document.getElementById('hero'),ratio=document.getElementById('ratio'),note=document.getElementById('note'),rel=document.getElementById('relations'),name=document.getElementById('emotionName'),sub=document.getElementById('emotionSub');
 const relTitle=document.getElementById('relationsTitle'),relMeta=document.getElementById('relationsMeta');
 if(index<0){title.textContent='나의 감정 별';summary.textContent='별을 누르면 그날의 기록이 보여요';hero.hidden=true;ratio.hidden=true;note.textContent='';rel.innerHTML='<div class="missing">날짜가 쌓일수록 나만의 우주가 완성돼요.</div>';relTitle.textContent='닮은 감정의 날';relMeta.textContent='';paint();return;}
 const s=stars[index],rank=s.p.map((_,i)=>i).sort((a,b)=>s.p[b]-s.p[a]);
 title.textContent=dayLabel(s.date);summary.textContent='하루의 감정 기록';hero.hidden=false;
 const orb=document.getElementById('orb');orb.style.setProperty('--c',colorFor(s.top));orb.style.setProperty('--c2',colorFor(s.second));name.style.setProperty('--c',colorFor(s.top));name.textContent=EMO[s.top];sub.textContent=`${Math.round(s.conf*100)}% · ${EMO[s.second]} ${Math.round(s.p[s.second]*100)}%`;
 ratio.hidden=false;ratio.innerHTML=`<div class="ratio-head"><span>그날의 감정 비율</span><span>7가지 감정</span></div><div class="ratio-track">${s.p.map((v,i)=>`<span style="width:${(v*100).toFixed(2)}%;background:${colorFor(i)}" title="${escapeHTML(EMO[i])} ${Math.round(v*100)}%"></span>`).join('')}</div>`;
 note.textContent=s.text||'';
 let candidates;
 if(state.path){relTitle.textContent='시간의 궤적';relMeta.textContent='이전 · 다음 기록';candidates=(previousNext.get(index)||[]).map(i=>({i,detail:stars[i].date<s.date?'이전 기록':'다음 기록'}));}
 else{relTitle.textContent='닮은 감정의 날';relMeta.textContent='감정 비율 기준';candidates=(s.similar||[]).filter(t=>t.date!==s.date && t.score>=.6 && byDate.has(t.date)).map(t=>({i:byDate.get(t.date),detail:`유사도 ${Math.round(t.score*100)}%`})).slice(0,5);}
 rel.innerHTML=candidates.length?candidates.map(({i,detail})=>{const q=stars[i];return `<button class="rel" type="button" data-i="${i}" title="${escapeHTML(dayLabel(q.date))} 기록 보기"><i style="--c:${colorFor(q.top)}"></i><div><b>${escapeHTML(dayLabel(q.date))}</b><span>${escapeHTML(EMO[q.top])} · ${escapeHTML(EMO[q.second])}</span></div><em>${escapeHTML(detail)}</em></button>`;}).join(''):'<div class="missing">'+(N<2?'다른 날에도 기록하면 별이 연결돼요.':'아직 감정이 닮은 날짜가 없어요.')+'</div>';
 paint();
}
document.getElementById('relations').addEventListener('click',e=>{const btn=e.target.closest('button[data-i]');if(!btn)return;const i=Number(btn.dataset.i);if(!visible(stars[i])){EMO.forEach((_,k)=>enabled.add(k));syncLegend();}panel(i);});
function setView(mode){state.mode=mode;state.zoom=1;state.panX=0;state.panY=0;document.getElementById('m2').setAttribute('aria-pressed',String(mode===2));document.getElementById('m3').setAttribute('aria-pressed',String(mode===3));paint();}
document.getElementById('m2').onclick=()=>setView(2);document.getElementById('m3').onclick=()=>setView(3);
document.getElementById('timeMode').setAttribute('aria-pressed',String(state.path));
document.getElementById('timeMode').onclick=()=>{state.path=!state.path;document.getElementById('timeMode').setAttribute('aria-pressed',String(state.path));panel(state.selected);};
let activePointer=null;
function position(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function pick(x,y){const P=paint.projected||[];let best=-1,dist=Infinity;stars.forEach(s=>{if(!visible(s))return;const p=P[s.i];if(!p)return;const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=s.i;}});return dist<17?best:-1;}
canvas.addEventListener('pointerdown',e=>{const [x,y]=position(e);activePointer={x,y,px:state.panX,py:state.panY,ra:state.rotA,rb:state.rotB,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const [x,y]=position(e);if(activePointer){const dx=x-activePointer.x,dy=y-activePointer.y;if(Math.abs(dx)+Math.abs(dy)>4)activePointer.moved=true;if(activePointer.moved){canvas.classList.add('drag');if(state.mode===2){state.panX=activePointer.px+dx;state.panY=activePointer.py+dy;}else{state.rotA=activePointer.ra+dx*.009;state.rotB=clamp(activePointer.rb+dy*.009,-1.25,1.25);}paint();}return;}const i=pick(x,y);if(i!==state.hovered){state.hovered=i;canvas.style.cursor=i<0?'grab':'pointer';paint();}});
canvas.addEventListener('pointerup',e=>{if(activePointer&&!activePointer.moved){const [x,y]=position(e),i=pick(x,y);if(i>=0)panel(i);}activePointer=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointercancel',()=>{activePointer=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointerleave',()=>{if(state.hovered>=0){state.hovered=-1;paint();}});
function zoomAt(f,x,y){const target=clamp(state.zoom*f,.65,3.5),ratio=target/state.zoom;if(state.mode===2){state.panX=x-(x-state.panX)*ratio;state.panY=y-(y-state.panY)*ratio;}state.zoom=target;paint();}
canvas.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=position(e);zoomAt(e.deltaY<0?1.12:1/1.12,x,y);},{passive:false});
let oldW=0,oldH=0;
function resize(){const w=Math.max(1,Math.round(stage.clientWidth)),h=Math.max(1,Math.round(stage.clientHeight));if(oldW===w&&oldH===h)return;oldW=w;oldH=h;W=w;H=h;canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);refreshSky();paint();}
let waiting=false;function scheduleResize(){if(waiting)return;waiting=true;requestAnimationFrame(()=>{waiting=false;resize();});}
new ResizeObserver(scheduleResize).observe(stage);resize();
if(N){panel(chronological[chronological.length-1]);}else{document.getElementById('empty').hidden=false;panel(-1);}
if(!reduceMotion){let previous=performance.now();function animate(now){const dt=now-previous;if(dt>=30){previous=now;elapsed+=Math.min(dt,90);if(state.mode===3&&!activePointer)state.rotA+=dt*.00013;if(state.mode===3||state.selected>=0)paint();}requestAnimationFrame(animate);}requestAnimationFrame(animate);}
</script>

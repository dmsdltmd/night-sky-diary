<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: [감정 지도 (왼쪽 감정 범례, 아래 2D/3D 전환) | 유사한 감정의 날 목록] */
  :root{ --card:rgba(16,20,46,.82); --line:rgba(140,150,255,.15); --line-hi:rgba(165,155,255,.42); --ink:#eef0ff; --sub:#a3a8cf; --faint:#6b7099; --violet:#8b7bff; --gold:#ffcf6a; }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  button{font-family:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  #app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}
  #stage{position:relative;overflow:hidden}
  canvas#cv{display:block;width:100%;height:100%;cursor:grab}
  canvas#cv.drag{cursor:grabbing}
  .legend{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:grid;gap:10px}
  .lg{display:flex;align-items:center;gap:10px;border:0;background:none;font-size:13px;cursor:pointer;padding:2px 0;text-align:left}
  .lg i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--c) 50%);box-shadow:0 0 8px var(--c)}
  .lg[aria-pressed="false"]{opacity:.35}
  .mode{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;background:rgba(12,14,36,.86);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;font-size:12.5px;color:#d6d9f2}
  .seg{display:flex;background:rgba(255,255,255,.05);border-radius:9px;padding:3px}
  .seg button{border:0;background:none;padding:5px 14px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--sub)}
  .seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
  .ctrl{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
  .ctrl button{height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(12,14,36,.86);cursor:pointer;font-size:12.5px;display:grid;place-items:center}
  .ctrl svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
  .tip{position:absolute;transform:translate(-50%,-100%);background:rgba(14,16,40,.92);border:1px solid var(--line-hi);border-radius:8px;padding:5px 10px;font-size:12px;white-space:nowrap;pointer-events:none}
  .tip[hidden]{display:none}
  .side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;min-height:0}
  .side h4{margin:0 0 4px;font-size:14px;font-weight:700}
  .base{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}
  .base b{color:var(--ink);font-weight:500}
  .list{overflow:auto;min-height:0;display:grid;gap:4px;align-content:start}
  .item{display:grid;grid-template-columns:48px minmax(0,1fr) 14px;gap:12px;align-items:center;border:0;border-bottom:1px solid rgba(140,150,255,.08);background:none;padding:10px 4px;text-align:left;cursor:pointer;border-radius:8px}
  .item:hover{background:rgba(255,255,255,.04)}
  .item canvas{width:48px;height:48px}
  .item b{display:block;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .item .mx{font-size:12px;margin:2px 0}
  .item small{font-size:11.5px;color:var(--sub)}
  .item .arr{color:var(--faint);font-size:16px}
  .none{font-size:12.5px;color:var(--faint);padding:8px 0}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
  @media (max-width:820px){ #app{grid-template-columns:1fr;grid-template-rows:minmax(380px,1fr) auto;height:auto;min-height:__HEIGHT__px} .legend{top:16px;transform:none;grid-auto-flow:column;gap:8px 12px} .side{max-height:360px} }
</style></head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" id="legend"></div>
    <div class="mode">감정 지도 (PCA 기반)<div class="seg"><button id="m2" aria-pressed="true">2D</button><button id="m3" aria-pressed="false">3D</button></div></div>
  </div>
  <div class="side"><h4 style="margin-bottom:10px">유사한 감정의 날</h4><div class="base" id="base" hidden></div><div class="list" id="list"></div></div>
</div>
<script>
window.addEventListener('error', e => { const b = document.createElement('div'); b.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#3a1420;color:#ffd7dd;border:1px solid #f0645a;border-radius:8px;padding:10px 12px;font:12px/1.5 monospace'; b.textContent = '감정 유니버스 오류: ' + e.message + (e.lineno ? ' (줄 ' + e.lineno + ')' : ''); document.body.appendChild(b); });
__PLANET_JS__
</script>
<script>
const DATA = __DATA__;   // {emo, colors, stars:[{date,text,p,x,y,x3,y3,z3,similar,corrected}], links}
const EMO = DATA.emo, COL = DATA.colors, NE = EMO.length;
const cv = document.getElementById('cv'), g = cv.getContext('2d'), stage = document.getElementById('stage');
const DPR = Math.min(2, devicePixelRatio || 1), GOLD = '#ffcf6a';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, sel = -1, hover = -1, mode = 2, view = {k:1,x:0,y:0}, rot = {a:.6, b:.35}, spin = !reduce;
const on = new Set(EMO.map((e,k) => k));
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function order(v){return v.map((x,i)=>i).sort((a,b)=>v[b]-v[a])}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function kor(d){return `${+d.slice(5,7)}월 ${+d.slice(8,10)}일`}
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const N = DATA.stars.length;
const stars = DATA.stars.map((s,i) => { const o = order(s.p); return {...s, i, top:o[0], second:o[1], conf:s.p[o[0]], ax:s.x, ay:s.y}; });
const deg = Array(N).fill(0); DATA.links.forEach(([i,j]) => { deg[i]++; deg[j]++; });
stars.forEach(s => s.r = 3.4 + s.conf*3 + Math.min(3, deg[s.i]*.8));
const byDate = {}; stars.forEach(s => byDate[s.date] = s.i);

/* 2D: 감정이 비슷한 날은 가깝게(PCA), 겹치지 않게 펼치기 */
(function relax(){ const R = mb32(11);
  for (let it=0; it<240; it++) for (let a=0;a<N;a++){ const A = stars[a]; let fx=(A.ax-A.x)*.03, fy=(A.ay-A.y)*.03;
    for (let b=0;b<N;b++){ if (a===b) continue; const B = stars[b]; let dx=A.x-B.x, dy=A.y-B.y, d2=dx*dx+dy*dy; if (d2<1e-6){dx=R()-.5;dy=R()-.5;d2=1e-4;}
      const m=.085; if (d2<m*m){ const d=Math.sqrt(d2), f=(m-d)/d*.4; fx+=dx*f; fy+=dy*f; } }
    A.x = Math.min(1,Math.max(0,A.x+fx)); A.y = Math.min(1,Math.max(0,A.y+fy)); } })();

/* 범례 = 감정 필터 */
const lg = document.getElementById('legend');
lg.innerHTML = EMO.map((e,k) => `<button class="lg" data-k="${k}" style="--c:${COL[k]}" aria-pressed="true"><i></i>${e}</button>`).join('');
lg.querySelectorAll('.lg').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (on.has(k) && on.size === NE) { on.clear(); on.add(k); } else if (on.has(k)) on.delete(k); else on.add(k); if (!on.size) EMO.forEach((e,i) => on.add(i));
  lg.querySelectorAll('.lg').forEach(x => x.setAttribute('aria-pressed', on.has(+x.dataset.k))); draw(); });
function visible(s){ return on.has(s.top); }

/* 좌표: 2D는 평면, 3D는 세 번째 주성분까지 써서 돌려 보기 */
function project(s){
  if (mode === 2) return {x: (150 + s.x*(W-230))*view.k + view.x, y: (60 + s.y*(H-140))*view.k + view.y, sc: 1, d: 0};
  const ca = Math.cos(rot.a), sa = Math.sin(rot.a), cb = Math.cos(rot.b), sb = Math.sin(rot.b);
  let x = s.x3*ca + s.z3*sa, z = -s.x3*sa + s.z3*ca, y = s.y3*cb - z*sb; z = s.y3*sb + z*cb;
  const f = 3.2, sc = f / (f + z), R = Math.min(W, H) * .4 * view.k;
  return {x: W*.55 + x*R*sc + view.x, y: H*.5 + y*R*sc + view.y, sc, d: z};
}

/* 배경 */
let bgc = null;
function paintBg(){
  bgc = document.createElement('canvas'); bgc.width = W*DPR; bgc.height = H*DPR; const b = bgc.getContext('2d'); b.scale(DPR,DPR); const R = mb32(23);
  b.globalCompositeOperation = 'lighter';
  [[.3,.35,.5,'#33268a',.2],[.8,.75,.45,'#6a35a8',.2],[.65,.15,.35,'#22307a',.16],[.15,.85,.35,'#3a2a90',.12]].forEach(([x,y,r,c,a]) => { for (let k=0;k<4;k++){ const cx=(x+(R()-.5)*.1)*W, cy=(y+(R()-.5)*.1)*H, rr=r*Math.max(W,H)*(.5+R()*.5), gr=b.createRadialGradient(cx,cy,0,cx,cy,rr); gr.addColorStop(0,rgba(c,a*.6)); gr.addColorStop(1,rgba(c,0)); b.fillStyle=gr; b.fillRect(0,0,W,H);} });
  b.globalCompositeOperation = 'source-over';
  for (let i=0;i<Math.round(W*H/1300);i++){ b.fillStyle=`rgba(255,255,255,${.1+R()*.5})`; b.beginPath(); b.arc(R()*W,R()*H,.3+R(),0,6.283); b.fill(); }
}

/* 그리기 */
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H); if (bgc) g.drawImage(bgc,0,0,W,H);
  if (!N) return;
  const P = stars.map(project); draw.P = P;
  const focus = sel >= 0 ? sel : hover;
  DATA.links.forEach(([i,j,s]) => { const A = stars[i], B = stars[j], hit = focus >= 0 && (i === focus || j === focus), dim = !(visible(A) && visible(B));
    const a = P[i], b = P[j], depth = mode === 3 ? Math.min(a.sc, b.sc) : 1;
    if (hit) { g.strokeStyle = rgba(GOLD,.9); g.lineWidth = 1.5; }
    else { const lgd = g.createLinearGradient(a.x,a.y,b.x,b.y); lgd.addColorStop(0, rgba(COL[A.top], dim ? .04 : .35*depth)); lgd.addColorStop(1, rgba(COL[B.top], dim ? .04 : .35*depth)); g.strokeStyle = lgd; g.lineWidth = .8; }
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); });
  const idx = stars.map(s => s.i).sort((p,q) => P[q].d - P[p].d);   // 뒤에서부터 그리기
  idx.forEach(i => { const s = stars[i], p = P[i], isSel = i === sel, c = isSel ? GOLD : COL[s.top], dim = !visible(s);
    const r = s.r * p.sc * (isSel ? 1.9 : i === hover ? 1.25 : 1) * Math.sqrt(view.k);
    g.globalAlpha = (dim ? .15 : 1) * (mode === 3 ? Math.max(.35, Math.min(1, p.sc*1.1)) : 1);
    g.globalCompositeOperation = 'lighter';
    const halo = g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*(isSel?8:5)); halo.addColorStop(0,rgba(c,isSel?.7:.5)); halo.addColorStop(.35,rgba(c,.14)); halo.addColorStop(1,rgba(c,0));
    g.fillStyle = halo; g.beginPath(); g.arc(p.x,p.y,r*(isSel?8:5),0,6.283); g.fill();
    if (isSel) for (let q=0;q<4;q++){ const an=q*Math.PI/2, L=r*5, ex=p.x+Math.cos(an)*L, ey=p.y+Math.sin(an)*L, sp=g.createLinearGradient(p.x,p.y,ex,ey); sp.addColorStop(0,'rgba(255,255,255,.85)'); sp.addColorStop(1,'rgba(255,255,255,0)'); g.strokeStyle=sp; g.lineWidth=1.2; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(ex,ey); g.stroke(); }
    g.globalCompositeOperation = 'source-over';
    const core = g.createRadialGradient(p.x-r*.25,p.y-r*.25,0,p.x,p.y,r); core.addColorStop(0,'#fff'); core.addColorStop(.45,rgba(c,1)); core.addColorStop(1,rgba(c,.85));
    g.fillStyle = core; g.beginPath(); g.arc(p.x,p.y,r,0,6.283); g.fill();
    if (isSel) { g.font = '700 12.5px "Gothic A1", sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.fillText(kor(s.date), p.x, p.y + r + 18); g.textAlign = 'left'; }
    g.globalAlpha = 1; });
  const tip = document.getElementById('tip');
  if (hover >= 0 && hover !== sel) { const s = stars[hover], p = P[hover]; tip.textContent = `${kor(s.date)} · ${EMO[s.top]} ${Math.round(s.conf*100)}%`; tip.style.left = p.x+'px'; tip.style.top = (p.y - s.r*p.sc - 10)+'px'; tip.hidden = false; } else tip.hidden = true;
}

/* 유사한 감정의 날 목록 */
function select(i){
  sel = i; draw();
  const base = document.getElementById('base'), list = document.getElementById('list');
  if (i < 0) { base.textContent = '지도에서 별을 누르면 그날과 감정 구성이 닮은 날을 찾아 줘요.'; list.innerHTML = ''; return; }
  const s = stars[i];
  base.innerHTML = `<b>${kor(s.date)}</b>(${EMO[s.top]} + ${EMO[s.second]})과 닮은 날 · ${esc(s.text)}`;
  const sims = (s.similar || []).filter(t => byDate[t.date] !== undefined);
  list.innerHTML = sims.length ? sims.map((t,n) => { const q = stars[byDate[t.date]];
    return `<button class="item" data-d="${esc(t.date)}"><canvas width="96" height="96" id="th${n}"></canvas><span><b>${kor(t.date)}</b><div class="mx"><span style="color:${COL[q.top]}">${EMO[q.top]}</span> <span style="color:#6b7099">+</span> <span style="color:${COL[q.second]}">${EMO[q.second]}</span></div><small>유사도 ${Math.round(t.score*100)}%</small></span><span class="arr">›</span></button>`; }).join('')
    : '<div class="none">이 기간에 비슷한 날이 없어요.</div>';
  sims.forEach((t,n) => { const q = stars[byDate[t.date]], c = document.getElementById('th'+n).getContext('2d'); c.scale(2,2); drawPlanet(c, 24, 24, 15, COL[q.top], {second: COL[q.second], seed: byDate[t.date]*13+5, glow: .7}); });
  list.querySelectorAll('.item').forEach(b => b.onclick = () => { const j = byDate[b.dataset.d]; if (!visible(stars[j])) { EMO.forEach((e,k) => on.add(k)); lg.querySelectorAll('.lg').forEach(x => x.setAttribute('aria-pressed','true')); } select(j); });
}

/* 2D / 3D 전환 */
function setMode(m){ mode = m; view = {k:1,x:0,y:0}; document.getElementById('m2').setAttribute('aria-pressed', m === 2); document.getElementById('m3').setAttribute('aria-pressed', m === 3); draw(); }
document.getElementById('m2').onclick = () => setMode(2);
document.getElementById('m3').onclick = () => setMode(3);
let drag = null, moved = false;
let lastT = performance.now();
(function loop(now){ const dt = Math.min(50, now - lastT); lastT = now; if (mode === 3 && spin && !drag) { rot.a += dt * .00018; draw(); } requestAnimationFrame(loop); })(lastT);

/* 마우스 */
function mpos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function pick(mx,my){ const P = draw.P || []; let best=-1, bd=1e9; stars.forEach(s => { if (!visible(s)) return; const d = Math.hypot(P[s.i].x-mx, P[s.i].y-my); if (d < bd) { bd = d; best = s.i; } }); return bd <= 14 ? best : -1; }
cv.addEventListener('pointerdown', e => { drag = {p:mpos(e), x:view.x, y:view.y, a:rot.a, b:rot.b}; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { const [mx,my] = mpos(e);
  if (drag) { const dx = mx-drag.p[0], dy = my-drag.p[1]; if (Math.abs(dx)+Math.abs(dy) > 3) { moved = true; cv.classList.add('drag'); }
    if (moved) { if (mode === 2) { view.x = drag.x+dx; view.y = drag.y+dy; } else { rot.a = drag.a + dx*.008; rot.b = Math.max(-1.2, Math.min(1.2, drag.b + dy*.008)); } draw(); } return; }
  const h = pick(mx,my); if (h !== hover) { hover = h; cv.style.cursor = h >= 0 ? 'pointer' : 'grab'; draw(); } });
cv.addEventListener('pointerup', e => { cv.classList.remove('drag'); if (!moved) { const [mx,my] = mpos(e); const i = pick(mx,my); if (i >= 0) select(i); } drag = null; });
cv.addEventListener('pointerleave', () => { if (hover >= 0) { hover = -1; draw(); } });
function zoomAt(f,cx,cy){ const k = Math.min(4, Math.max(.6, view.k*f)); f = k/view.k; if (mode === 2) { view.x = cx-(cx-view.x)*f; view.y = cy-(cy-view.y)*f; } view.k = k; draw(); }
cv.addEventListener('wheel', e => { e.preventDefault(); const [mx,my] = mpos(e); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, mx, my); }, {passive:false});

function resize(){ W = stage.clientWidth; H = stage.clientHeight; cv.width = W*DPR; cv.height = H*DPR; paintBg(); draw(); }
if (!N) { const e = document.createElement('div'); e.className = 'empty'; e.innerHTML = '이 기간에는 아직 기록이 없어요.'; stage.appendChild(e); }
new ResizeObserver(resize).observe(stage); resize();
if (N) { const latest = stars.slice().sort((a,b) => a.date < b.date ? 1 : -1)[0]; select(latest.i); } else select(-1);
</script>
</body></html>

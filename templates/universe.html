<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f2ff;--muted:#abb4d4;--soft:#7987b1;--violet:#b5a0ff;--line:rgba(183,197,255,.17);--card:#0d1532}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--ink);font:12px/1.6 'Gothic A1','Malgun Gothic',sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #d5c8ff;outline-offset:3px}
#app{height:__HEIGHT__px;display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:13px;min-width:0}
#stage{position:relative;overflow:hidden;isolation:isolate;min-width:0;border-radius:24px;border:1px solid rgba(163,174,242,.25);background:#090e27;box-shadow:0 12px 42px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.06)}
#stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 44% 50%,rgba(110,75,176,.18),transparent 50%),radial-gradient(ellipse at 82% 70%,rgba(70,51,154,.17),transparent 45%),linear-gradient(145deg,#0b1634 0%,#100f30 48%,#10112c 100%)}
#stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 105px rgba(1,4,18,.45);border-radius:inherit}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#topbar{position:absolute;z-index:3;top:21px;left:23px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.kicker{font:700 10px/1.2 'DM Sans',sans-serif;letter-spacing:.28em;color:#e0d6ff;text-shadow:0 2px 10px #0b1028}
#topbar h2{margin:6px 0 0;font-size:18px;line-height:1.3;letter-spacing:-.06em;font-weight:700;color:#f7f4ff}
#topbar p{margin:5px 0 0;font-size:11px;color:#c3c9e6}
#starCount{padding:6px 9px 6px 10px;font:600 10px 'DM Sans',sans-serif;letter-spacing:.09em;color:#c7d0ec;border:1px solid rgba(194,197,250,.25);border-radius:30px;background:rgba(13,20,50,.62);backdrop-filter:blur(12px);white-space:nowrap}
#starCount i{display:inline-block;width:6px;height:6px;background:#a7e8dc;border-radius:50%;box-shadow:0 0 11px #70dbd1;margin-right:8px;vertical-align:1px}
#filterbar{position:absolute;z-index:3;top:108px;left:22px;right:22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:530px}
.filter{cursor:pointer;min-width:0;padding:7px 10px 7px 9px;border:1px solid rgba(195,204,255,.13);border-radius:999px;background:rgba(15,23,53,.64);color:#cdd3ed;display:inline-flex;align-items:center;gap:7px;font-size:10.5px;line-height:1;white-space:nowrap;transition:background .2s,border-color .2s,opacity .2s,transform .2s;backdrop-filter:blur(9px)}
.filter i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 11px var(--c)}
.filter:hover{transform:translateY(-1px);border-color:rgba(201,197,255,.45);background:rgba(59,57,108,.56)}
.filter[aria-pressed="false"]{opacity:.40}
.filter[aria-pressed="true"]{border-color:rgba(206,206,255,.25)}
#toolbar{position:absolute;z-index:3;bottom:18px;left:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.control{display:flex;align-items:center;gap:3px;padding:4px;background:rgba(8,13,36,.79);border:1px solid rgba(195,198,255,.24);border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 5px 22px rgba(4,6,20,.20)}
.control button{border:0;background:transparent;color:#bac1df;border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer;white-space:nowrap;line-height:1.2;transition:background .2s,color .2s}
.control button:hover{color:#fff;background:rgba(152,139,227,.18)}
.control button[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,rgba(139,116,224,.66),rgba(98,105,188,.53));box-shadow:inset 0 1px rgba(255,255,255,.16)}
#timeMode::before{content:"";display:inline-block;vertical-align:1px;width:7px;height:7px;border:1px solid #a6d2fb;border-radius:50%;margin-right:8px;box-shadow:0 0 9px rgba(165,208,255,.3)}
#timeMode[aria-pressed="true"]::before{background:#bcdfff}
#hint{position:absolute;z-index:2;bottom:31px;right:20px;font-size:10px;color:#9aabd6;letter-spacing:.03em;pointer-events:none}
#tip{position:absolute;z-index:5;transform:translate(-50%,calc(-100% - 13px));white-space:nowrap;pointer-events:none;padding:7px 11px;border-radius:9px;border:1px solid rgba(207,196,255,.45);background:rgba(12,15,37,.93);box-shadow:0 8px 24px rgba(3,4,18,.4);font-size:11px}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2;pointer-events:none;color:#c5c4ea;line-height:2;font-size:13px}
#empty b{display:block;font-size:20px;letter-spacing:-.06em;color:#eee9ff;margin-bottom:8px}

/* The companion panel is deliberately an editorial journal, not another dashboard. */
#side{position:relative;display:flex;min-width:0;min-height:0;flex-direction:column;overflow:hidden;padding:25px 21px 20px;border:1px solid rgba(160,174,236,.22);border-radius:24px;background:radial-gradient(ellipse at 95% -5%,rgba(113,93,183,.23),transparent 49%),radial-gradient(ellipse at -20% 87%,rgba(45,78,139,.13),transparent 50%),linear-gradient(156deg,#161b3c,#101830 56%,#0c132a);box-shadow:inset 0 1px rgba(255,255,255,.065),0 16px 37px rgba(0,0,0,.07)}
#side::before{content:"";position:absolute;top:0;left:23px;right:23px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,202,255,.46),transparent);pointer-events:none}
.side-kicker{font:700 10px 'DM Sans',sans-serif;letter-spacing:.24em;color:#b7a8ee}
#dateTitle{margin:12px 0 2px;font-size:34px;font-weight:800;letter-spacing:-.08em;line-height:1.23;color:#fff}
#summary{color:#9eaad2;font-size:11px;margin:0 0 18px}
#hero{position:relative;min-height:125px;flex:none;display:flex;align-items:center;gap:14px;padding:15px 14px;margin-bottom:17px;border:1px solid rgba(192,185,248,.20);border-radius:18px;background:radial-gradient(ellipse at 24% 48%,rgba(137,122,231,.19),transparent 60%),linear-gradient(140deg,rgba(45,48,92,.8),rgba(16,21,47,.88));overflow:hidden}
#hero::after{content:"";position:absolute;right:-48px;top:-65px;width:160px;height:160px;border:1px solid rgba(190,190,248,.1);border-radius:50%;box-shadow:0 0 0 32px rgba(174,159,255,.018),0 0 0 66px rgba(174,159,255,.012);pointer-events:none}
#orb{position:relative;flex:none;width:87px;height:87px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0%,color-mix(in srgb,var(--c) 48%,white) 12%,var(--c) 31%,color-mix(in srgb,var(--c2) 45%,#17234a) 61%,#0a1430 88%);box-shadow:0 0 0 5px rgba(225,223,255,.04),0 0 32px color-mix(in srgb,var(--c) 28%,transparent),inset -10px -10px 15px rgba(3,5,21,.65),inset 2px 3px 9px rgba(255,255,255,.3)}
#orb::before{content:"";position:absolute;inset:-8px;border:1px solid color-mix(in srgb,var(--c2) 68%,transparent);border-radius:50%;transform:rotate(-20deg) scaleX(1.10);opacity:.68}
#orb::after{content:"";position:absolute;left:16px;top:10px;width:25px;height:19px;background:rgba(255,255,255,.7);filter:blur(11px);border-radius:50%}
#hero-text{position:relative;z-index:2;min-width:0}
#emotionName{display:block;font-size:22px;letter-spacing:-.05em;line-height:1.3;font-weight:700;color:#fff}
#emotionSub{display:block;font-size:10px;color:#c8c8e1;line-height:1.8;margin-top:7px}
#ratio{flex:none;margin:0 0 17px}
.ratio-head{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#aab5d9;margin-bottom:8px}
.ratio-head span:last-child{color:#8999c2}
.ratio-track{height:7px;display:flex;gap:3px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.06)}
.ratio-track span{display:block;min-width:0;border-radius:999px}
#quote-label{font-size:10px;font-weight:700;letter-spacing:.04em;color:#a5afdc;margin:0 0 7px}
#note{min-height:0;max-height:104px;overflow:auto;flex:none;padding:13px 14px 14px;color:#f1ebff;font-size:11.5px;line-height:1.9;border-radius:13px;border:1px solid rgba(177,174,244,.19);border-left:2px solid rgba(180,166,250,.7);background:rgba(16,24,56,.56);overflow-wrap:anywhere;white-space:pre-wrap}
#note:empty{display:none}
#relationSection{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:19px;border-top:1px solid rgba(177,190,248,.13);padding-top:15px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
#relationsTitle{font-size:12px;font-weight:700;color:#eff0ff}
#relationsMeta{font-size:10px;color:#8392bd;white-space:nowrap}
#relations{min-height:0;overflow-y:auto;display:grid;align-content:start;gap:7px;padding-right:2px}
.rel{display:flex;width:100%;border:1px solid rgba(165,185,244,.17);border-radius:12px;background:linear-gradient(125deg,rgba(39,51,96,.56),rgba(18,28,59,.65));align-items:center;gap:10px;text-align:left;padding:10px 9px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.rel:hover{background:rgba(77,76,138,.48);border-color:rgba(193,179,255,.44);transform:translateX(2px)}
.rel i{display:block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 11px var(--c)}
.rel-info{min-width:0;flex:1}
.rel b{display:block;font-weight:700;font-size:11px;color:#f4f2ff}
.rel span{display:block;margin-top:1px;font-size:10px;color:#96a5ce}
.rel em{font-style:normal;white-space:nowrap;font-size:10px;color:#c6baf1}
.missing{padding:15px 12px;border:1px dashed rgba(171,180,234,.2);border-radius:12px;background:rgba(38,46,83,.3);color:#a6b2da;font-size:11px;line-height:1.85}
#relationSection[hidden],#hero[hidden],#ratio[hidden]{display:none!important}
@media(max-width:1020px){#app{grid-template-columns:minmax(0,1fr) 280px;gap:10px}#side{padding:22px 16px 17px}#filterbar{right:8px}.filter{padding:7px 8px}}
@media(max-width:740px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:370px 265px;gap:8px}#side{padding:14px 17px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;overflow:auto}#dateTitle{font-size:25px;margin:6px 0 1px}#summary{margin-bottom:6px}#hero{min-height:85px;padding:9px 11px;margin-bottom:7px}#orb{width:58px;height:58px}#hero-text #emotionName{font-size:17px}#ratio{margin:0}#quote-label{grid-column:2;grid-row:1;align-self:end}#note{grid-column:2;grid-row:2 / span 3;max-height:125px}#relationSection{grid-column:1/-1;margin-top:4px;padding-top:7px}#relations{grid-template-columns:1fr 1fr}#topbar{top:16px;left:16px}#topbar h2{font-size:16px}#filterbar{top:80px;left:13px;right:11px;gap:4px}.filter{font-size:9px;padding:6px 7px}#toolbar{bottom:11px;left:12px}#hint{bottom:20px;right:12px}}
@media(max-width:420px){#topbar p,#hint,#starCount{display:none}#filterbar{top:71px}.filter{padding:6px}#relations{grid-template-columns:1fr}}
@media(max-width:740px){#side{display:flex;overflow-y:auto;overflow-x:hidden}#quote-label{display:block}#note{max-height:92px;flex:none}#relationSection{flex:none;min-height:130px;overflow:visible}#relations{display:grid;grid-template-columns:1fr;overflow:visible}#hero{min-height:86px;flex:none}#ratio{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){.filter,.rel,.control button{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <section id="stage" aria-label="감정이 비슷한 날을 연결한 우주 지도">
  <canvas id="cv" aria-label="감정 기록의 빛점을 선택하고 드래그해 탐색하는 지도"></canvas>
  <div id="topbar"><div><div class="kicker">THE UNIVERSE WITHIN</div><h2>감정이 머문 자리</h2><p>닮은 마음들이 가까운 곳에 빛나요</p></div><div id="starCount"><i></i><span id="countValue">0 DAYS</span></div></div>
  <div id="filterbar" aria-label="감정 색상 필터"></div>
  <div id="toolbar"><div class="control" aria-label="지도 보기 방식"><button id="m2" type="button" aria-pressed="true" title="감정 비율로 가까운 날을 평면에 표시">2D</button><button id="m3" type="button" aria-pressed="false" title="감정 비율을 입체 공간에 표시">3D</button></div><div class="control"><button id="timeMode" type="button" aria-pressed="false" title="닮은 마음의 연결과 기록 날짜순 궤적을 전환">시간의 궤적</button></div></div>
  <div id="hint">드래그하여 탐색 · 휠로 확대</div>
  <div id="tip" hidden></div>
  <div id="empty" hidden><b>아직 빛이 모이지 않았어요</b>감정 기록을 남기면<br>이곳에 나만의 우주가 펼쳐집니다.</div>
 </section>
 <aside id="side" aria-label="선택한 감정 기록">
  <div class="side-kicker">A PAGE OF YOUR SKY</div>
  <h3 id="dateTitle">나의 하루</h3>
  <p id="summary">빛점을 선택하면 그날의 감정이 펼쳐져요</p>
  <div id="hero" hidden><div id="orb"></div><div id="hero-text"><b id="emotionName"></b><span id="emotionSub"></span></div></div>
  <div id="ratio" hidden></div>
  <div id="quote-label">그날 남긴 기록</div>
  <div id="note"></div>
  <section id="relationSection"><div class="section-head"><b id="relationsTitle">감정이 닮은 날</b><small id="relationsMeta"></small></div><div id="relations"></div></section>
 </aside>
</div>
<script>
'use strict';
// sky.universe_html() supplies these values from the existing analysis pipeline.
const DATA=__DATA__;
const EMO=Array.isArray(DATA.emo)?DATA.emo:[];
const COLORS=Array.isArray(DATA.colors)?DATA.colors:[];
const records=Array.isArray(DATA.stars)?DATA.stars:[];
const N=records.length;
const canvas=document.getElementById('cv');
const stage=document.getElementById('stage');
const ctx=canvas.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtDay=date=>{const parts=String(date||'').split('-');return parts.length===3?`${Number(parts[1])}월 ${Number(parts[2])}일`:String(date||'');};
const safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const col=k=>COLORS[k]||'#b8a4ff';
const rgba=(h,a)=>{const s=h.replace('#',''),v=parseInt(s,16)||0;return `rgba(${(v>>16)&255},${(v>>8)&255},${v&255},${a})`;};
const randGen=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296;};
const stars=records.map((r,i)=>{
 const p=Array.isArray(r.p)&&r.p.length===EMO.length?r.p.map(Number):EMO.map(()=>0);
 const rank=p.map((_,k)=>k).sort((a,b)=>p[b]-p[a]);
 return {...r,i,p,top:rank[0]??0,secondary:rank[1]??0,conf:p[rank[0]]||0,ax:Number(r.x)||.5,ay:Number(r.y)||.5,x:Number(r.x)||.5,y:Number(r.y)||.5,x3:Number(r.x3)||0,y3:Number(r.y3)||0,z3:Number(r.z3)||0};
});
const links=(DATA.links||[]).filter(([a,b])=>stars[a]&&stars[b]&&a!==b);
const order=stars.map(s=>s.i).sort((a,b)=>String(stars[a].date).localeCompare(String(stars[b].date)));
const dateIndex=new Map(stars.map(s=>[s.date,s.i]));
const neighbors=new Map(order.map((j,k)=>[j,[order[k-1],order[k+1]].filter(v=>v!==undefined)]));
const enabled=new Set(EMO.map((_,i)=>i));
const state={view:2,time:N>=2&&N<=3,selected:-1,hover:-1,zoom:1,panX:0,panY:0,rotA:.4,rotB:.22};
$('countValue').textContent=`${String(N).padStart(2,'0')} DAYS`;
$('filterbar').innerHTML=EMO.map((name,i)=>`<button class="filter" type="button" data-k="${i}" aria-pressed="true" style="--c:${col(i)}"><i></i>${safe(name)}</button>`).join('');
const show=s=>enabled.has(s.top);
function syncFilters(){$('filterbar').querySelectorAll('.filter').forEach(el=>el.setAttribute('aria-pressed',String(enabled.has(+el.dataset.k))));}
$('filterbar').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=+b.dataset.k;if(enabled.size===EMO.length){enabled.clear();enabled.add(k);}else if(enabled.has(k)){enabled.delete(k);}else enabled.add(k);if(!enabled.size)EMO.forEach((_,i)=>enabled.add(i));syncFilters();if(state.selected>=0&&!show(stars[state.selected])){const next=order.find(i=>show(stars[i]));panel(next??-1);}draw();});
// For truly small datasets we spread points just enough to be legible, without faking extra entries.
if(N===2){const a=stars[order[0]],b=stars[order[1]];a.x=.36;a.y=.46;b.x=.70;b.y=.61;}
else if(N===3){const p=[[.36,.39],[.72,.48],[.53,.70]];order.forEach((id,j)=>{stars[id].x=p[j][0];stars[id].y=p[j][1];});}
else if(N>3){const random=randGen(46);for(let t=0;t<110;t++){for(const a of stars){let dx=0,dy=0;for(const b of stars){if(a===b)continue;let vx=a.x-b.x,vy=a.y-b.y,d=Math.hypot(vx,vy);if(d<.106){if(d<.0001){vx=random()-.5;vy=random()-.5;d=Math.hypot(vx,vy)||1;}const f=(.106-d)*.11/d;dx+=vx*f;dy+=vy*f;}}a.x=clamp(a.x+dx+(a.ax-a.x)*.014,.065,.93);a.y=clamp(a.y+dy+(a.ay-a.y)*.014,.06,.94);}}}
let W=1,H=1,elapsed=0,background=null,projected=[],hitAreas=[];
function projectedPoint(s){
 if(state.view===2){const left=W<550?40:54,top=173,right=42,bottom=78;const spaceX=Math.max(25,W-left-right),spaceY=Math.max(25,H-top-bottom);return {x:(left+s.x*spaceX)*state.zoom+state.panX,y:(top+s.y*spaceY)*state.zoom+state.panY,z:0,scale:1};}
 const a=Math.cos(state.rotA),b=Math.sin(state.rotA),c=Math.cos(state.rotB),d=Math.sin(state.rotB);
 const rx=s.x3*a+s.z3*b,rz=-s.x3*b+s.z3*a,ry=s.y3*c-rz*d,depth=s.y3*d+rz*c;
 const perspective=3.25/(3.25+depth);const size=Math.min(W*.37,H*.35)*state.zoom;
 return {x:W*.52+rx*size*perspective+state.panX,y:H*.55+ry*size*perspective+state.panY,z:depth,scale:perspective};
}
function createBackground(){
 const paper=document.createElement('canvas');paper.width=Math.round(W*DPR);paper.height=Math.round(H*DPR);const g=paper.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
 const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#070f27');grad.addColorStop(.44,'#131638');grad.addColorStop(1,'#090e25');g.fillStyle=grad;g.fillRect(0,0,W,H);
 // Broad velvet nebulae, not false data points.
 const clouds=[[.62,.58,.49,'#9957c9',.37],[.31,.58,.39,'#3047c4',.36],[.73,.33,.41,'#7046c1',.21],[.55,.77,.32,'#c55ca5',.22],[.15,.79,.34,'#2276b1',.18]];
 for(const [x,y,r,color,alpha] of clouds){const R=Math.max(W,H)*r,gl=g.createRadialGradient(W*x,H*y,0,W*x,H*y,R);gl.addColorStop(0,rgba(color,alpha));gl.addColorStop(.40,rgba(color,alpha*.42));gl.addColorStop(1,rgba(color,0));g.fillStyle=gl;g.fillRect(0,0,W,H);}
 const rand=randGen(99);
 // Milky Way stream, deliberately faint so real data is always recognizable.
 g.save();g.globalCompositeOperation='screen';
 for(let k=0;k<1050;k++){const t=rand(),curve=.78-.63*t+.082*Math.sin(t*7+.2);const x=(t*1.19-.07+(rand()-.5)*.15)*W,y=(curve+(rand()-.5)*.20)*H;const radius=.18+rand()*.92;g.fillStyle=rgba(rand()<.4?'#a4b3ff':'#d6b9eb',.04+rand()*.25);g.beginPath();g.arc(x,y,radius,0,6.283);g.fill();}
 for(let i=0;i<Math.round(W*H/650);i++){const x=rand()*W,y=rand()*H,rr=.2+rand()*.69;g.fillStyle=`rgba(220,230,255,${.08+rand()*.36})`;g.beginPath();g.arc(x,y,rr,0,6.283);g.fill();}
 for(let i=0;i<20;i++){const x=rand()*W,y=rand()*H,rr=1+rand()*2;g.strokeStyle=`rgba(228,217,255,${.07+rand()*.19})`;g.lineWidth=.65;g.beginPath();g.moveTo(x-rr,y);g.lineTo(x+rr,y);g.moveTo(x,y-rr*1.5);g.lineTo(x,y+rr*1.5);g.stroke();}
 g.restore();
 const shade=g.createRadialGradient(W*.55,H*.52,Math.min(W,H)*.1,W*.55,H*.52,Math.max(W,H)*.74);shade.addColorStop(0,'rgba(1,3,17,0)');shade.addColorStop(1,'rgba(1,4,18,.62)');g.fillStyle=shade;g.fillRect(0,0,W,H);
 background=paper;
}
function glow(p,color,r,strength){const R=Math.min(150,Math.max(35,r));const light=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);light.addColorStop(0,rgba(color,strength));light.addColorStop(.28,rgba(color,strength*.32));light.addColorStop(1,rgba(color,0));ctx.fillStyle=light;ctx.beginPath();ctx.arc(p.x,p.y,R,0,6.283);ctx.fill();}
const midpoint=(a,b,offset=0)=>{const vx=b.x-a.x,vy=b.y-a.y,d=Math.hypot(vx,vy)||1;const bend=Math.min(38,d*.12)+offset;return {x:(a.x+b.x)/2-vy/d*bend,y:(a.y+b.y)/2+vx/d*bend};};
const onCurve=(a,b,t)=>{const c=midpoint(a,b),u=1-t;return {x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};};
function thread(a,b,c1,c2,active,dotted){
 const ctrl=midpoint(a,b),gradient=ctx.createLinearGradient(a.x,a.y,b.x,b.y);gradient.addColorStop(0,rgba(c1,active?.7:.23));gradient.addColorStop(.5,rgba('#d4c9ff',active?.8:.34));gradient.addColorStop(1,rgba(c2,active?.7:.23));
 ctx.save();ctx.lineCap='round';ctx.strokeStyle=gradient;ctx.lineWidth=active?1.85:1.1;ctx.setLineDash(dotted?[3,7]:[]);if(dotted&&!reduced)ctx.lineDashOffset=-elapsed*.01;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(ctrl.x,ctrl.y,b.x,b.y);ctx.stroke();
 ctx.setLineDash([]);if(active){const glowC=ctx.createLinearGradient(a.x,a.y,b.x,b.y);glowC.addColorStop(0,rgba(c1,.08));glowC.addColorStop(1,rgba(c2,.08));ctx.strokeStyle=glowC;ctx.lineWidth=7;ctx.stroke();}
 if(!reduced&&(active||N<=3)){const t=(elapsed*.00018)%1,q=onCurve(a,b,t);glow(q,c2,12,.45);ctx.beginPath();ctx.fillStyle='#f4f1ff';ctx.arc(q.x,q.y,1.4,0,6.283);ctx.fill();}ctx.restore();
}
function drawOrb(s,p,focus){
 const chosen=s.i===state.selected,over=s.i===state.hover,related=focus<0||s.i===focus||neighbors.get(focus)?.includes(s.i)||links.some(([a,b])=>(a===focus&&b===s.i)||(b===focus&&a===s.i));
 const primary=col(s.top),secondary=col(s.secondary);const R=clamp((N<=3?16.5:12.2)+(s.conf*8),10,26)*p.scale*Math.sqrt(state.zoom)*(chosen?1.21:1);
 const breathe=reduced?1:1+.035*Math.sin(elapsed*.0014+s.i*1.9);ctx.save();ctx.globalAlpha=related?1:.38;
 ctx.globalCompositeOperation='screen';glow(p,primary,R*(chosen?5.8:4.5)*breathe,chosen?.29:.20);glow(p,secondary,R*3.8,.065);
 ctx.globalCompositeOperation='source-over';ctx.strokeStyle=rgba(primary,chosen?.62:.18);ctx.lineWidth=chosen?1.2:.75;ctx.beginPath();ctx.arc(p.x,p.y,R*(chosen?1.9:1.68),0,6.283);ctx.stroke();
 if(chosen){ctx.strokeStyle=rgba(secondary,.48);ctx.beginPath();ctx.arc(p.x,p.y,R*2.32,-1.35,1.52);ctx.stroke();}
 // Pearlescent light-seed, not a five-pointed star or an imitation planet.
 const orb=ctx.createRadialGradient(p.x-R*.34,p.y-R*.40,R*.04,p.x,p.y,R*1.13);orb.addColorStop(0,'rgba(255,255,255,.97)');orb.addColorStop(.18,rgba(primary,.96));orb.addColorStop(.58,rgba(primary,.84));orb.addColorStop(.82,rgba(secondary,.29));orb.addColorStop(1,rgba('#08122e',.94));ctx.fillStyle=orb;ctx.beginPath();ctx.arc(p.x,p.y,R,0,6.283);ctx.fill();
 ctx.strokeStyle=rgba('#ffffff',chosen?.59:.20);ctx.lineWidth=.9;ctx.stroke();ctx.strokeStyle=rgba(secondary,.85);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,R+2.7,-.7,.55);ctx.stroke();
 const label=chosen||over||N<=4;if(label){ctx.font=(chosen?'700':'500')+' 11px "Gothic A1",sans-serif';ctx.textAlign='center';ctx.shadowColor='#060b23';ctx.shadowBlur=10;ctx.fillStyle=chosen?'#ffffff':'rgba(237,241,255,.87)';ctx.fillText(fmtDay(s.date),p.x,p.y+R+27);ctx.shadowBlur=0;}
 hitAreas.push({i:s.i,x:p.x,y:p.y,r:Math.max(17,R+7)});ctx.restore();
}
function draw(){if(!ctx)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(background)ctx.drawImage(background,0,0,W,H);if(!N)return;
 projected=stars.map(projectedPoint);hitAreas=[];
 const focus=state.hover>=0?state.hover:state.selected;
 // A quiet field around actual emotions, not fake stars.
 ctx.save();ctx.globalCompositeOperation='screen';for(const s of stars)if(show(s))glow(projected[s.i],col(s.top),N<4?128:75,N<4?.12:.07);ctx.restore();
 if(state.time){for(let j=1;j<order.length;j++){const a=order[j-1],b=order[j];if(show(stars[a])&&show(stars[b]))thread(projected[a],projected[b],col(stars[a].top),col(stars[b].top),a===focus||b===focus,true);}}
 else for(const [a,b] of links){if(show(stars[a])&&show(stars[b]))thread(projected[a],projected[b],col(stars[a].top),col(stars[b].top),a===focus||b===focus,false);}
 for(const s of [...stars].sort((a,b)=>projected[b.i].z-projected[a.i].z))if(show(s))drawOrb(s,projected[s.i],focus);
 const tip=$('tip');if(state.hover>=0&&state.hover!==state.selected&&show(stars[state.hover])){const s=stars[state.hover],p=projected[s.i];tip.textContent=`${fmtDay(s.date)} · ${EMO[s.top]}`;tip.style.left=clamp(p.x,55,W-55)+'px';tip.style.top=p.y+'px';tip.hidden=false;}else tip.hidden=true;
}
function panel(i){state.selected=i;const title=$('dateTitle'),summary=$('summary'),hero=$('hero'),ratio=$('ratio'),note=$('note'),rel=$('relations');
 if(i<0){title.textContent='나의 하루';summary.textContent='빛점을 선택하면 그날의 감정이 펼쳐져요';hero.hidden=true;ratio.hidden=true;note.textContent='';$('relationSection').hidden=true;draw();return;}
 $('relationSection').hidden=false;const s=stars[i],rank=s.p.map((_,j)=>j).sort((a,b)=>s.p[b]-s.p[a]);title.textContent=fmtDay(s.date);summary.textContent='그날의 마음을 다시 펼쳐볼까요';hero.hidden=false;
 $('orb').style.setProperty('--c',col(s.top));$('orb').style.setProperty('--c2',col(s.secondary));$('emotionName').textContent=EMO[s.top];$('emotionSub').textContent=`${Math.round(s.conf*100)}% · ${EMO[s.secondary]} ${Math.round(s.p[s.secondary]*100)}%`;
 ratio.hidden=false;ratio.innerHTML=`<div class="ratio-head"><span>그날의 감정</span><span>7가지 감정의 비율</span></div><div class="ratio-track">${s.p.map((n,j)=>`<span title="${safe(EMO[j])} ${Math.round(n*100)}%" style="width:${Math.max(0,Number(n))*100}%;background:${col(j)}"></span>`).join('')}</div>`;
 note.textContent=s.text||'기록된 내용이 없어요.';let candidates=[];
 if(state.time){$('relationsTitle').textContent='시간을 따라간 기록';$('relationsMeta').textContent='이전 · 다음';candidates=(neighbors.get(i)||[]).map(j=>({i:j,detail:stars[j].date<s.date?'이전':'다음'}));}
 else{$('relationsTitle').textContent='마음이 닮은 날';$('relationsMeta').textContent='감정 유사도';candidates=(s.similar||[]).filter(o=>o.date!==s.date&&o.score>=.6&&dateIndex.has(o.date)).slice(0,5).map(o=>({i:dateIndex.get(o.date),detail:`${Math.round(o.score*100)}% 닮음`}));}
 rel.innerHTML=candidates.length?candidates.map(({i:j,detail})=>{const other=stars[j];return `<button class="rel" type="button" data-i="${j}"><i style="--c:${col(other.top)}"></i><span class="rel-info"><b>${safe(fmtDay(other.date))}</b><span>${safe(EMO[other.top])} · ${safe(EMO[other.secondary])}</span></span><em>${safe(detail)}</em></button>`;}).join(''):`<div class="missing">${N<2?'다른 날의 기록이 쌓이면 이곳에 이어져요.':state.time?'연결된 이전 또는 다음 기록이 없어요.':'이번 달에는 충분히 닮은 기록이 아직 없어요.'}</div>`;
 draw();
}
$('relations').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const i=+b.dataset.i;if(!show(stars[i])){EMO.forEach((_,j)=>enabled.add(j));syncFilters();}panel(i);});
function view(v){state.view=v;state.zoom=1;state.panX=0;state.panY=0;$('m2').setAttribute('aria-pressed',String(v===2));$('m3').setAttribute('aria-pressed',String(v===3));$('hint').textContent=v===3?'드래그하여 회전 · 휠로 확대':'드래그하여 탐색 · 휠로 확대';draw();}
$('m2').onclick=()=>view(2);$('m3').onclick=()=>view(3);
$('timeMode').setAttribute('aria-pressed',String(state.time));$('timeMode').onclick=()=>{state.time=!state.time;$('timeMode').setAttribute('aria-pressed',String(state.time));panel(state.selected);};
const pos=e=>{const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};};
const pick=(x,y)=>{let best=-1,dist=Infinity;for(const h of hitAreas){const d=Math.hypot(h.x-x,h.y-y);if(d<h.r&&d<dist){best=h.i;dist=d;}}return best;};
let drag=null;
canvas.addEventListener('pointerdown',e=>{const p=pos(e);drag={x:p.x,y:p.y,px:state.panX,py:state.panY,ra:state.rotA,rb:state.rotB,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const p=pos(e);if(drag){const dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){canvas.classList.add('drag');if(state.view===2){state.panX=drag.px+dx;state.panY=drag.py+dy;}else{state.rotA=drag.ra+dx*.009;state.rotB=clamp(drag.rb+dy*.009,-1.2,1.2);}draw();}return;}const i=pick(p.x,p.y);if(state.hover!==i){state.hover=i;canvas.style.cursor=i<0?'grab':'pointer';draw();}});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const p=pos(e),i=pick(p.x,p.y);if(i>=0)panel(i);}drag=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('drag');});
canvas.addEventListener('pointerleave',()=>{if(state.hover!==-1){state.hover=-1;draw();}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),next=clamp(state.zoom*(e.deltaY<0?1.1:1/1.1),.75,3),ratio=next/state.zoom;if(state.view===2){state.panX=p.x-(p.x-state.panX)*ratio;state.panY=p.y-(p.y-state.panY)*ratio;}state.zoom=next;draw();},{passive:false});
let oldW=0,oldH=0;
function resize(){const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);if(w===oldW&&h===oldH)return;oldW=w;oldH=h;W=w;H=h;canvas.width=Math.round(w*DPR);canvas.height=Math.round(h*DPR);createBackground();draw();}
new ResizeObserver(()=>requestAnimationFrame(resize)).observe(stage);
resize();if(N){panel(order[order.length-1]);}else{$('empty').hidden=false;panel(-1);}
if(!reduced){let last=performance.now();function animate(now){const delta=Math.min(now-last,80);if(delta>=29){last=now;elapsed+=delta;if(state.view===3&&!drag)state.rotA+=delta*.000075;draw();}requestAnimationFrame(animate);}requestAnimationFrame(animate);}

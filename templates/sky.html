<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;500;700&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#090c1c;color:#eef0ff;font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;height:__HEIGHT__px}
  canvas{display:block;width:100%;height:100%;border-radius:22px}
  .card{position:absolute;right:14px;top:14px;width:min(320px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;
        background:rgba(21,26,59,.94);border:1px solid rgba(238,240,255,.15);border-radius:18px;padding:16px;box-sizing:border-box;
        box-shadow:0 20px 40px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
  .card[hidden]{display:none}
  .card h3{font-family:"Nanum Myeongjo",serif;margin:0 0 4px;font-size:19px}
  .card .sub{color:#a6acd3;font-size:12px;margin-bottom:10px}
  .card p{font-size:14px;line-height:1.65;margin:10px 0}
  .bar{display:grid;grid-template-columns:34px 1fr 36px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
  .bar i{display:block;height:7px;border-radius:7px}
  .bar .t{background:rgba(238,240,255,.08);border-radius:7px;overflow:hidden}
  .bar span:last-child{text-align:right;color:#a6acd3}
  .lab{font-size:11px;letter-spacing:.1em;color:#e8c472;margin-top:12px}
  .sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sim button{border:1px solid rgba(238,240,255,.2);background:none;color:#eef0ff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .x{position:absolute;right:10px;top:8px;border:0;background:none;color:#a6acd3;font-size:20px;cursor:pointer}
  .hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:rgba(238,240,255,.6)}
</style></head>
<body>
<div id="wrap">
  <canvas id="sky"></canvas>
  <div class="card" id="card" hidden></div>
  <div class="hint" id="hint"></div>
</div>
<script>
const DATA = __DATA__;
const EMO = DATA.emo, COL = DATA.colors;
const cv = document.getElementById('sky'), g = cv.getContext('2d'), wrap = document.getElementById('wrap');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1), sel = -1, pts = [];

function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function order(v){return v.map((x,i)=>i).sort((a,b)=>v[b]-v[a])}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function place(){
  const R = mb32(DATA.seed || 7);
  pts = DATA.stars.map((s, i) => {
    let x, y;
    if (DATA.mode === 'poster') {
      // 월간 포스터: 왼쪽에서 오른쪽으로 날짜 순서, 위아래는 물결 모양
      const t = (s.day - 1) / Math.max(1, DATA.days - 1), ph = (DATA.seed % 100) / 15;
      x = 0.08 + t * 0.84 + (R() - .5) * 0.04;
      y = 0.42 + Math.sin(t * 6.5 + ph) * 0.17 + (R() - .5) * 0.12;
    } else { x = s.x; y = s.y; }
    const o = order(s.p), conf = s.p[o[0]];
    return { ...s, i, X: x * W, Y: y * H, c: COL[o[0]], c2: COL[o[1]], conf, r: (3.5 + conf * 6) * (W < 500 ? .8 : 1) };
  });
}

function draw(){
  const R = mb32(DATA.seed || 7);
  g.setTransform(DPR,0,0,DPR,0,0);
  const bg = g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#03050f'); bg.addColorStop(.55,'#0b1230'); bg.addColorStop(1,'#1a1f4a');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  // 먼 별들
  for (let i=0;i<Math.round(W*H/2200);i++){ g.fillStyle=`rgba(255,255,255,${.1+R()*.6})`; g.beginPath(); g.arc(R()*W,R()*H,.3+R()*1.0,0,6.283); g.fill(); }
  // 성운: 각 별의 섞인 감정 색
  g.globalCompositeOperation='lighter';
  pts.forEach(p=>{ for(let k=0;k<4;k++){ const r=R(); let acc=0, idx=0; for(let j=0;j<p.p.length;j++){acc+=p.p[j]; if(r<=acc){idx=j;break}}
    const cx=p.X+(R()-.5)*90, cy=p.Y+(R()-.5)*90, rad=40+R()*70, rg=g.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,rgba(COL[idx],.11)); rg.addColorStop(1,rgba(COL[idx],0)); g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,rad,0,6.283); g.fill(); }});
  g.globalCompositeOperation='source-over';
  // 연결선
  if (DATA.mode === 'poster') {
    for (let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], lg=g.createLinearGradient(a.X,a.Y,b.X,b.Y);
      lg.addColorStop(0,rgba(a.c,.7)); lg.addColorStop(1,rgba(b.c,.7)); g.strokeStyle=lg; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(a.X,a.Y); g.lineTo(b.X,b.Y); g.stroke(); }
  } else {
    DATA.links.forEach(([i,j,s])=>{ const a=pts[i], b=pts[j], on = sel===i||sel===j;
      g.strokeStyle = on ? 'rgba(232,196,114,.85)' : `rgba(255,255,255,${(s-.85)*1.4})`; g.lineWidth = on?1.6:.9;
      g.beginPath(); g.moveTo(a.X,a.Y); g.lineTo(b.X,b.Y); g.stroke(); });
  }
  // 별
  pts.forEach(p=>{ const s=p.r;
    g.globalCompositeOperation='lighter';
    const h1=g.createRadialGradient(p.X,p.Y,0,p.X,p.Y,s*6); h1.addColorStop(0,rgba(p.c,.55)); h1.addColorStop(1,rgba(p.c,0));
    g.fillStyle=h1; g.beginPath(); g.arc(p.X,p.Y,s*6,0,6.283); g.fill();
    const len=s*(2.4+p.conf*3.5);
    for(let q=0;q<4;q++){ const an=q*Math.PI/2, ex=p.X+Math.cos(an)*len, ey=p.Y+Math.sin(an)*len, sp=g.createLinearGradient(p.X,p.Y,ex,ey);
      sp.addColorStop(0,'rgba(255,255,255,.85)'); sp.addColorStop(1,'rgba(255,255,255,0)'); g.strokeStyle=sp; g.lineWidth=1;
      g.beginPath(); g.moveTo(p.X,p.Y); g.lineTo(ex,ey); g.stroke(); }
    g.globalCompositeOperation='source-over';
    g.strokeStyle=rgba(p.c2,.8); g.lineWidth=1.5; g.beginPath(); g.arc(p.X,p.Y,s*2,0,6.283); g.stroke();
    const h2=g.createRadialGradient(p.X,p.Y,0,p.X,p.Y,s*1.6); h2.addColorStop(0,'#fff'); h2.addColorStop(.45,rgba(p.c,.95)); h2.addColorStop(1,rgba(p.c,0));
    g.fillStyle=h2; g.beginPath(); g.arc(p.X,p.Y,s*1.6,0,6.283); g.fill();
    if (p.i===sel){ g.strokeStyle='#e8c472'; g.lineWidth=1.5; g.setLineDash([3,4]); g.beginPath(); g.arc(p.X,p.Y,s*3.2,0,6.283); g.stroke(); g.setLineDash([]); }
  });
  // 포스터: 언덕 + 제목
  if (DATA.mode === 'poster') {
    const top = DATA.top >= 0 ? COL[DATA.top] : '#8fa0ff';
    const hz=g.createRadialGradient(W/2,H,10,W/2,H,H*.6); hz.addColorStop(0,rgba(top,.45)); hz.addColorStop(1,rgba(top,0)); g.fillStyle=hz; g.fillRect(0,H*.4,W,H*.6);
    const hill=(base,amp,fr,off,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=10)g.lineTo(x,base-Math.sin(x*fr+off)*amp-Math.sin(x*fr*2.3+off*1.7)*amp*.4);g.lineTo(W,H);g.closePath();g.fill()};
    hill(H*.86,H*.035,.011,DATA.seed%7,'#0a0f2b'); hill(H*.92,H*.03,.016,DATA.seed%5+2,'#04060f');
    g.fillStyle='#fff'; g.font=`700 ${Math.round(W*.06)}px "Nanum Myeongjo", serif`; g.fillText(DATA.title||'', W*.06, H*.12);
    g.fillStyle='rgba(255,255,255,.7)'; g.font=`300 ${Math.max(12,Math.round(W*.022))}px "Gothic A1", sans-serif`; g.fillText(DATA.subtitle||'', W*.06, H*.12+W*.04);
  }
}

function showCard(i){
  const card = document.getElementById('card');
  sel = i; draw();
  if (i < 0) { card.hidden = true; return; }
  const p = pts[i], o = order(p.p);
  card.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <h3>${esc(p.date)}</h3>
    <div class="sub">${EMO[o[0]]} ${Math.round(p.p[o[0]]*100)}% · ${EMO[o[1]]} ${Math.round(p.p[o[1]]*100)}%${p.corrected?` · 내가 고른 감정: ${esc(p.corrected)}`:''}</div>
    ${o.map(k=>`<div class="bar"><span>${EMO[k]}</span><span class="t"><i style="width:${(p.p[k]*100).toFixed(1)}%;background:${COL[k]}"></i></span><span>${Math.round(p.p[k]*100)}%</span></div>`).join('')}
    <p>${esc(p.text)}</p>
    ${p.similar && p.similar.length ? `<div class="lab">이 날과 비슷했던 날</div><div class="sim">${p.similar.map(s=>`<button data-d="${esc(s.date)}">${esc(s.date)} · ${Math.round(s.score*100)}%</button>`).join('')}</div>` : ''}`;
  card.hidden = false;
  card.querySelector('.x').onclick = () => showCard(-1);
  card.querySelectorAll('.sim button').forEach(b => b.onclick = () => { const j = pts.findIndex(q => q.date === b.dataset.d); if (j >= 0) showCard(j); });
}

function hit(ev){
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = -1, bd = 1e9;
  pts.forEach((p,i)=>{ const d = Math.hypot(p.X-x, p.Y-y); if (d < bd) { bd = d; best = i; } });
  return bd <= Math.max(18, (pts[best]||{r:0}).r * 3) ? best : -1;
}
cv.addEventListener('click', ev => { const i = hit(ev); if (i >= 0 || sel >= 0) showCard(i); });
cv.addEventListener('mousemove', ev => { cv.style.cursor = hit(ev) >= 0 ? 'pointer' : 'default'; });

function resize(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  place(); draw(); if (sel >= 0) showCard(sel);
}
document.getElementById('hint').textContent = DATA.stars.length ? (DATA.mode === 'poster' ? '별을 누르면 그날의 일기가 열려요' : '감정이 비슷한 날은 가까이 놓이고 선으로 이어져요 · 별을 눌러 보세요') : '아직 뜬 별이 없어요';
new ResizeObserver(resize).observe(wrap);
resize();
</script>
</body></html>

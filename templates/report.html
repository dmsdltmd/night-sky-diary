<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 위 [감정 분포 도넛 | 감정 변화 추이 선 그래프] → 아래 [자주 함께 나타나는 감정 조합 | 감정이 크게 변화한 날 | 최근 일기] */
  :root{ --card:rgba(16,20,46,.82); --line:rgba(140,150,255,.15); --ink:#eef0ff; --sub:#a3a8cf; --faint:#6b7099; --violet:#8b7bff; }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  button{font-family:inherit;color:inherit}
  #app{display:grid;gap:14px}
  .r1{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:14px}
  .r2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
  .card h4{margin:0 0 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}
  .donut{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center}
  .donut svg{width:160px;height:160px}
  svg text{font-family:"Gothic A1",sans-serif}
  .leg{display:grid;gap:7px;font-size:12.5px}
  .leg div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
  .leg i{width:9px;height:9px;border-radius:50%}
  .leg span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
  .tog{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:400}
  .tog button{border:0;background:none;font-size:11.5px;display:flex;align-items:center;gap:5px;cursor:pointer;padding:0}
  .tog i{width:7px;height:7px;border-radius:50%}
  .tog button[aria-pressed="false"]{opacity:.35}
  .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(140,150,255,.08);font-size:13px}
  .row .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--sub)}
  .row .d{display:flex;align-items:center;gap:5px;min-width:0}
  .row .d i{width:9px;height:9px;border-radius:50%;flex:none}
  .row b{font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
  .chg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(140,150,255,.08);font-size:12.5px}
  .chg canvas{width:40px;height:40px}
  .chg b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
  .chg em{font-style:normal;color:var(--sub);font-size:11.5px;white-space:nowrap}
  .rec{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px solid rgba(140,150,255,.08)}
  .rec b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rec span{color:#cfd2ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .none{font-size:12.5px;color:var(--faint)}
  .hint{font-size:11.5px;color:var(--faint);margin-top:10px}
  @media (max-width:900px){ .r1,.r2{grid-template-columns:1fr} .donut{grid-template-columns:130px 1fr} .donut svg{width:130px;height:130px} }
</style></head>
<body><div id="app"></div>
<script>
__PLANET_JS__
</script>
<script>
const R = __DATA__;   // {emo, colors, days, mean:[7], series:[{date,p}], pairs:[[a,b,n]], turns:[{date,from,to,jsd}], recent:[{date,text}], year, month}
const EMO = R.emo, COL = R.colors, NE = EMO.length;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function kor(d){return `${+d.slice(5,7)}월 ${+d.slice(8,10)}일`}
const ord = EMO.map((e,i)=>i).sort((a,b)=>R.mean[b]-R.mean[a]);
const shown = new Set(ord.slice(0,4));    // 처음에는 비율이 높은 감정 4개만 선으로

function donut(){
  const C = 2*Math.PI*60; let off = 0;
  const arcs = ord.map(k => { const len = R.mean[k]*C, gap = len > 5 ? 2.5 : 0, s = `<circle cx="80" cy="80" r="60" fill="none" stroke="${COL[k]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join('');
  return `<div class="card"><h4>감정 분포</h4><div class="donut">
    <svg viewBox="0 0 160 160" role="img" aria-label="이번 달 감정 분포"><circle cx="80" cy="80" r="60" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>${arcs}
    <text x="80" y="76" text-anchor="middle" font-size="11.5" fill="#a3a8cf">전체 감정</text><text x="80" y="94" text-anchor="middle" font-size="11.5" fill="#a3a8cf">비율</text></svg>
    <div class="leg">${EMO.map((e,k) => `<div><i style="background:${COL[k]}"></i><span>${e}</span><span>${Math.round(R.mean[k]*100)}%</span></div>`).join('')}</div></div></div>`;
}

function trend(){
  return `<div class="card"><h4>감정 변화 추이<div class="tog" id="tog">${ord.map(k => `<button data-k="${k}" aria-pressed="${shown.has(k)}"><i style="background:${COL[k]}"></i>${EMO[k]}</button>`).join('')}</div></h4><div id="chart"></div></div>`;
}
function drawChart(){
  const w = 640, h = 210, L = 38, B = 24, T = 8, Rr = 10, dim = new Date(R.year, R.month, 0).getDate();
  const X = d => L + (d-1)/(dim-1)*(w-L-Rr), Y = v => T + (1-v)*(h-T-B);
  let s = '';
  [0,.25,.5,.75,1].forEach(v => { s += `<line x1="${L}" x2="${w-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,${v ? .06 : .14})"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="#6b7099">${v*100}%</text>`; });
  [1,7,14,21,28].filter(d => d <= dim).forEach(d => { s += `<text x="${X(d)}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="#6b7099">${R.month}/${d}</text>`; });
  ord.slice().reverse().forEach(k => { if (!shown.has(k)) return;
    const pts = R.series.map(o => [X(+o.date.slice(8,10)), Y(o.p[k])]);
    if (pts.length > 1) s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${COL[k]}" stroke-width="1.8" stroke-linejoin="round" opacity=".9"/>`;
    pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${COL[k]}"/>`; }); });
  document.getElementById('chart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="날짜별 감정 비율 변화">${s}</svg>`;
}

function pairs(){
  const p = R.pairs.slice(0,5);
  return `<div class="card"><h4>자주 함께 나타나는 감정 조합</h4>${p.length ? p.map(([a,b,n],i) => { const ka = EMO.indexOf(a), kb = EMO.indexOf(b);
    return `<div class="row"><span class="n">${i+1}</span><span class="d"><i style="background:${COL[ka]}"></i>${a} <span style="color:#6b7099">+</span> <i style="background:${COL[kb]}"></i>${b}</span><b>${Math.round(n/R.days*100)}%</b></div>`; }).join('')
    : '<div class="none">이번 달은 한 감정이 뚜렷한 날이 많았어요.</div>'}</div>`;
}
function turns(){
  const t = R.turns.slice(0,4);
  return `<div class="card"><h4>감정이 크게 변화한 날</h4>${t.length ? t.map((x,n) => { const a = EMO.indexOf(x.from), b = EMO.indexOf(x.to);
    return `<div class="chg"><canvas width="80" height="80" id="tc${n}"></canvas><span><b>${kor(x.date)}</b><span style="color:${COL[a]}">${x.from}</span> <span style="color:#6b7099">→</span> <span style="color:${COL[b]}">${x.to}</span></span><em>변화폭 ${Math.round(x.jsd*100)}%</em></div>`; }).join('')
    : '<div class="none">이번 달은 감정 구성이 크게 바뀐 날 없이 이어졌어요.</div>'}</div>`;
}
function recent(){
  return `<div class="card"><h4>최근 일기</h4>${R.recent.length ? R.recent.map(r => `<div class="rec"><b>${kor(r.date)}</b><span>${esc(r.text)}</span></div>`).join('') : '<div class="none">아직 일기가 없어요.</div>'}<div class="hint">아래 '전체 기록 보기'에서 모든 일기를 찾아볼 수 있어요.</div></div>`;
}

const app = document.getElementById('app');
if (!R.days) app.innerHTML = '<div class="card"><div class="none">이 달에는 아직 기록이 없어요.</div></div>';
else if (R.part === 'top') {
  app.innerHTML = `<div class="r1">${donut()}${trend()}</div>`;
  drawChart();
  document.querySelectorAll('#tog button').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (shown.has(k)) { if (shown.size > 1) shown.delete(k); } else shown.add(k); b.setAttribute('aria-pressed', shown.has(k)); drawChart(); });
} else {
  app.innerHTML = `<div class="r2" style="grid-template-columns:1fr 1fr">${pairs()}${turns()}</div>`;
  R.turns.slice(0,4).forEach((x,n) => { const c = document.getElementById('tc'+n).getContext('2d'); c.scale(2,2); drawPlanet(c, 20, 20, 12, COL[EMO.indexOf(x.to)], {second: COL[EMO.indexOf(x.from)], seed: n*31+7, glow: .6}); });
}
</script></body></html>

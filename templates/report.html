<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감정의 궤적 · 월간 리포트</title>
<style>
:root{--bg:#0c112b;--surface:rgba(20,25,54,.96);--surface2:rgba(22,29,64,.87);--border:rgba(162,171,239,.18);--text:#f0f2ff;--muted:#aab3d3;--quiet:#8290bc;--violet:#afa4ff;--gold:#ffcf6a;--green:#6fd3a8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font:13px/1.53 'Pretendard','Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button{font:inherit}
#app{width:100%;height:100%;min-width:0}
.top-grid{display:grid;grid-template-columns:minmax(235px,.37fr) minmax(0,.63fr);gap:12px;height:100%;min-height:0}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%;min-height:0}
.card{position:relative;overflow:hidden;min-width:0;min-height:0;height:100%;padding:17px 19px;background:radial-gradient(ellipse at 100% -10%,rgba(111,95,188,.14),transparent 49%),linear-gradient(145deg,rgba(23,29,62,.97),rgba(13,18,43,.97));border:1px solid var(--border);border-radius:19px;box-shadow:0 14px 35px rgba(0,2,17,.11),inset 0 1px rgba(255,255,255,.035)}
.eyebrow{color:#b4a6ed;letter-spacing:.16em;font-weight:700;font-size:9px;line-height:1.5;text-transform:uppercase}
.head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:5px 0 9px}
.head h2{font-size:17px;font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.4}
.head .small{color:var(--quiet);font-size:11px}
.highlight{display:flex;align-items:center;gap:12px;border-radius:13px;padding:10px 12px;background:rgba(142,139,226,.095);border:1px solid rgba(160,156,235,.13);margin:12px 0 13px}
.orb{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,#fff8,var(--accent) 44%,#0003 100%);box-shadow:0 0 19px color-mix(in srgb,var(--accent) 38%,transparent)}
.highlight-label{font-size:10.5px;color:var(--muted)}
.highlight-name{font-weight:800;font-size:19px;letter-spacing:-.035em;line-height:1.45}
.highlight-percent{color:#c5cbe7;font-size:11px;font-weight:600;margin-left:4px}
.bars{display:grid;gap:7px;margin-top:9px}
.barrow{display:grid;grid-template-columns:36px minmax(0,1fr) 40px;gap:9px;align-items:center;font-size:11px;color:#c8cee7}
.track{height:7px;border-radius:10px;background:rgba(143,154,218,.13);overflow:hidden}
.fill{display:block;height:100%;width:var(--value);background:var(--accent);border-radius:10px;box-shadow:0 0 10px color-mix(in srgb,var(--accent) 28%,transparent)}
.barrow strong{text-align:right;font-weight:700;color:#e2e5fa;font-size:11px;font-variant-numeric:tabular-nums}
.snapshot-note{margin-top:10px;color:var(--quiet);font-size:10.5px;line-height:1.4}
.trend{display:flex;flex-direction:column}
.trend .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0;flex-wrap:wrap}
.filter{display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.filter button{display:inline-flex;gap:5px;align-items:center;border-radius:999px;color:#c4cbe4;border:1px solid rgba(160,167,226,.17);background:rgba(12,17,41,.42);cursor:pointer;font-size:10px;padding:4px 7px;line-height:1.35;white-space:nowrap}
.filter button[aria-pressed=true]{background:rgba(127,108,219,.20);border-color:rgba(183,164,245,.58);color:#fff}
.filter button:focus-visible{outline:2px solid #c0b3ff;outline-offset:2px}
.filter i,.bubble{width:7px;height:7px;flex:none;border-radius:50%;display:inline-block;background:var(--accent)}
.chart-wrap{flex:1;min-height:0;margin-top:5px}
.chart-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.chart-note{color:var(--quiet);font-size:10px;line-height:1.35;margin-top:0}
.line-swatch{height:5px;width:5px;display:inline-block;border-radius:50%;margin-right:4px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.section-head h2{font-size:16px;margin:5px 0 0;letter-spacing:-.04em}
.section-head .sub{font-size:10px;color:var(--quiet);white-space:nowrap}
.result-list{display:grid;gap:8px}
.result{display:grid;grid-template-columns:21px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:rgba(117,130,205,.06);border:1px solid rgba(155,167,238,.105);border-radius:12px;min-height:49px}
.result-num{width:20px;height:20px;display:grid;place-items:center;border:1px solid rgba(157,172,235,.24);border-radius:50%;color:#aeb8dc;font-size:10px;font-weight:700}
.result-main{min-width:0;font-weight:700;font-size:12px;color:#e6e9ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-main .arrow{color:#9aa7ce;padding:0 6px;font-size:12px}
.result-value{color:#d7dcf3;font-size:11px;font-weight:700;white-space:nowrap}
.result-meta{color:#a8b3d4;font-size:10px;line-height:1.25;margin-top:3px}
.result-mood{display:flex;align-items:center;gap:6px}
.empty{display:grid;place-items:center;text-align:center;min-height:155px;padding:16px;color:#a9b5d6;background:rgba(117,132,204,.05);border:1px dashed rgba(146,157,214,.18);border-radius:13px}
.empty strong{display:block;margin-bottom:5px;color:#e5e9ff;font-size:13px}
.empty span{font-size:11px}
.card-foot{color:var(--quiet);font-size:10.5px;margin-top:12px;line-height:1.45}
.bottom-grid .card{padding:17px 18px}
@media(max-width:780px){
 .top-grid{grid-template-columns:minmax(180px,.37fr) minmax(0,.63fr);gap:8px}
 .bottom-grid{gap:8px}
 .card{padding:12px 13px;border-radius:15px}
 .head h2{font-size:14px}.highlight{padding:7px 9px;margin:8px 0}.orb{width:30px;height:30px}
 .highlight-name{font-size:15px}.barrow{grid-template-columns:30px minmax(0,1fr) 31px;gap:5px;font-size:10px}
 .top-grid .eyebrow{font-size:8px}.trend .topbar{align-items:flex-start}
 .filter button{font-size:9px;padding:3px 5px}.bottom-grid .card{padding:12px}
 .result{gap:6px;padding:8px 7px}.result-main{font-size:10.5px}.result-meta{font-size:9px}.result-value{font-size:10px}
}
@media(max-width:520px){
 .top-grid{grid-template-columns:1fr;grid-template-rows:73px minmax(0,1fr);gap:7px}
 .snapshot{padding:8px 11px;display:flex;align-items:center;gap:10px}
 .snapshot .eyebrow,.snapshot .head,.snapshot .bars,.snapshot .snapshot-note{display:none}
 .snapshot .highlight{flex:1;margin:0;min-width:0;padding:5px 7px;gap:8px;justify-content:flex-start}
 .snapshot:before{content:'이번 달 대표 감정';color:#bdb5e6;font-size:10px;font-weight:700;white-space:nowrap}
 .snapshot .orb{width:28px;height:28px}.snapshot .highlight-name{font-size:13px}.snapshot .highlight-label{display:none}.snapshot .highlight-percent{font-size:10px}
 .trend{padding:10px 10px}.trend .head h2{font-size:13px}.trend .eyebrow,.trend .head .small{display:none}
 .trend .topbar{display:flex;gap:3px;align-items:center}.trend .head{margin:0}
 .filter{justify-content:flex-start;gap:3px}.filter button{font-size:9px;padding:3px 5px}
 .chart-wrap{margin-top:4px}
 .bottom-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:7px}
 .bottom-grid .card{padding:9px 11px}
 .bottom-grid .eyebrow,.bottom-grid .card-foot{display:none}
 .section-head{margin-bottom:6px}.section-head h2{font-size:13px;margin:0}.section-head .sub{font-size:9px}
 .result-list{gap:4px}.result{min-height:27px;padding:4px 7px;grid-template-columns:16px 1fr auto}
 .result-num{width:15px;height:15px;font-size:8px}.result-main{font-size:10px}.result-meta{display:none}
 .empty{min-height:48px;padding:6px}.empty strong{font-size:11px;margin:0}.empty span{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body><main id="app"></main>
<script>
const R=__DATA__;
const $=id=>document.getElementById(id);
const EMO=Array.isArray(R.emo)?R.emo:[];
const COL=Array.isArray(R.colors)?R.colors:[];
const days=Number(R.days)||0;
const avg=Array.isArray(R.mean)?R.mean:EMO.map(()=>0);
const series=(Array.isArray(R.series)?R.series:[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const ranked=EMO.map((_,k)=>k).sort((a,b)=>(avg[b]||0)-(avg[a]||0));
const palette=k=>COL[k]||'#a99bff';
const fmtPct=v=>`${Math.round(100*(Number(v)||0))}%`;
const fmtDate=d=>{const match=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));return match?`${Number(match[2])}월 ${Number(match[3])}일`:'날짜 확인 필요';};
const eText=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
const dot=k=>`<i class="bubble" style="--accent:${palette(k)}"></i>`;
const colorStyle=k=>`style="--accent:${palette(k)}"`;
function summaryCard(){
 const top=ranked[0]??0;
 const max=avg[top]||0;
 const order=ranked.slice(0,3);
 return `<section class="card snapshot"><div class="eyebrow">MONTHLY SNAPSHOT</div><div class="head"><h2>한 달의 마음</h2><span class="small">${days}일 기록</span></div>
 <div class="highlight"><span class="orb" ${colorStyle(top)}></span><div><div class="highlight-label">이번 달 가장 두드러진 감정</div><div class="highlight-name">${eText(EMO[top]||'기록')} <span class="highlight-percent">${fmtPct(max)}</span></div></div></div>
 <div class="bars">${order.map(k=>`<div class="barrow"><span>${eText(EMO[k])}</span><div class="track"><i class="fill" style="--accent:${palette(k)};--value:${Math.min(100,Math.max(0,(avg[k]||0)*100))}%"></i></div><strong>${fmtPct(avg[k])}</strong></div>`).join('')}</div>
 <div class="snapshot-note">하루별 감정 비율의 월간 평균이에요.</div></section>`;
}
const chosen=new Set(ranked.slice(0,Math.min(3,ranked.length)));
function trendCard(){
 return `<section class="card trend"><div class="topbar"><div><div class="eyebrow">EMOTIONAL TIMELINE</div><div class="head"><h2>감정 변화 추이</h2><span class="small">기록한 날짜 기준</span></div></div><div class="filter" id="filter"></div></div><div class="chart-wrap" id="chart"></div><div class="chart-note">그래프의 점은 실제로 기록한 날짜를 나타냅니다.</div></section>`;
}
function drawFilter(){const f=$('filter');if(!f)return;f.innerHTML=ranked.map(k=>`<button type="button" aria-pressed="${chosen.has(k)}" data-k="${k}"><i style="--accent:${palette(k)}"></i>${eText(EMO[k])}</button>`).join('');
 f.querySelectorAll('button').forEach(btn=>{btn.addEventListener('click',()=>{const k=Number(btn.dataset.k);if(chosen.has(k)){if(chosen.size===1)return;chosen.delete(k);}else chosen.add(k);drawFilter();drawChart();});});
}
function drawChart(){
 const box=$('chart');if(!box)return;
 const w=620,h=177,L=37,Rt=14,T=8,B=25;const last=new Date(Number(R.year),Number(R.month),0).getDate()||31;
 const x=d=>L+(Math.max(1,Math.min(last,d))-1)/Math.max(1,last-1)*(w-L-Rt);
 const y=v=>T+(1-Math.max(0,Math.min(1,Number(v)||0)))*(h-T-B);
 let markup='';
 for(const v of [0,.25,.5,.75,1]){markup+=`<line x1="${L}" x2="${w-Rt}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(181,190,240,${v===0?.22:.11})" stroke-dasharray="${v===0?'none':'3 5'}"/><text x="${L-9}" y="${y(v)+4}" fill="#8b98bc" font-size="10" text-anchor="end">${Math.round(v*100)}</text>`;}
 for(const d of [1,7,14,21,28].filter(d=>d<=last)){markup+=`<text x="${x(d)}" y="${h-4}" fill="#8b98bc" font-size="10" text-anchor="middle">${d}일</text>`;}
 const visible=ranked.slice().reverse().filter(k=>chosen.has(k));
 for(const k of visible){
  const points=series.filter(o=>Array.isArray(o.p)).map(o=>({x:x(Number(String(o.date).slice(-2))),y:y(o.p[k]),date:String(o.date),v:Number(o.p[k])||0}));
  if(points.length>1){
   for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i],gap=Number(b.date.slice(-2))-Number(a.date.slice(-2));
    markup+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${palette(k)}" stroke-width="2.0" stroke-opacity=".78" stroke-linecap="round" ${gap>3?'stroke-dasharray="4 5"':''}/>`;
   }
  }
  for(const p of points){markup+=`<circle cx="${p.x}" cy="${p.y}" r="3.8" fill="${palette(k)}" stroke="#101733" stroke-width="1.3"><title>${fmtDate(p.date)} · ${eText(EMO[k])} ${fmtPct(p.v)}</title></circle>`;}
 }
 box.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="이번 달 감정 비율의 날짜별 변화. 3일 초과 기록 공백은 점선으로 연결">${markup}</svg>`;
}
function moodPair(item,index){const [a,b,n]=item;const ai=EMO.indexOf(a),bi=EMO.indexOf(b);return `<div class="result"><span class="result-num">${index+1}</span><div class="result-main">${dot(ai)} ${eText(a)} <span class="arrow">+</span> ${dot(bi)} ${eText(b)}</div><div class="result-value">${Math.max(0,Number(n)||0)}일</div></div>`;}
function change(item,index){const ai=EMO.indexOf(item.from),bi=EMO.indexOf(item.to);const score=Math.min(100,Math.max(0,Math.round((Number(item.jsd)||0)*100)));return `<div class="result"><span class="result-num">${index+1}</span><div><div class="result-main">${fmtDate(item.date)} <span class="arrow">·</span> ${dot(ai)}${eText(item.from)} <span class="arrow">→</span> ${dot(bi)}${eText(item.to)}</div><div class="result-meta">기록된 감정의 구성 변화</div></div><div class="result-value">지수 ${score}</div></div>`;}
function bottom(){
 const pairs=Array.isArray(R.pairs)?R.pairs.slice(0,3):[];
 const turns=Array.isArray(R.turns)?R.turns.slice(0,3):[];
 return `<div class="bottom-grid"><section class="card"><div class="section-head"><div><div class="eyebrow">EMOTION COMBINATIONS</div><h2>함께 나타난 감정</h2></div><span class="sub">각 감정 20% 이상</span></div>
 ${pairs.length?`<div class="result-list">${pairs.map(moodPair).join('')}</div>`:`<div class="empty"><div><strong>눈에 띄는 조합이 없어요</strong><span>기록이 늘어나면 함께 나타난 감정도 확인할 수 있어요.</span></div></div>`}
 <div class="card-foot">두 감정이 함께 일정 비율 이상 나타난 날짜 수입니다.</div></section>
 <section class="card"><div class="section-head"><div><div class="eyebrow">EMOTIONAL CHANGES</div><h2>감정이 달라진 날</h2></div><span class="sub">이전 기록과 비교</span></div>
 ${turns.length?`<div class="result-list">${turns.map(change).join('')}</div>`:`<div class="empty"><div><strong>큰 변화가 감지되지 않았어요</strong><span>기록이 더 쌓이면 감정 변화가 두드러진 날을 살펴볼 수 있어요.</span></div></div>`}
 <div class="card-foot">변화 지수는 감정 비율의 차이를 나타내는 참고값입니다.</div></section></div>`;
}
const app=$('app');
if(!days){app.innerHTML='<section class="card"><div class="empty"><div><strong>이번 달 기록이 아직 없어요</strong><span>하루의 마음을 기록하면 리포트가 만들어져요.</span></div></div></section>';}
else if(R.part==='top'){app.innerHTML=`<div class="top-grid">${summaryCard()}${trendCard()}</div>`;drawFilter();drawChart();}
else{app.innerHTML=bottom();}
</script>
</body>
</html>
